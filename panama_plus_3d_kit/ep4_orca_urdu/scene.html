<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MONARCH Panama-Plus 3D — Orca vs Humpback (Urdu)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020a14;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 42%, transparent 45%, rgba(1, 6, 14, 0.72) 100%);
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 88px 54px 235px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pill {
      background: rgba(4, 15, 29, 0.76);
      border: 1px solid rgba(112, 214, 255, 0.40);
      color: #e6f6ff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .pill.gold {
      border-color: rgba(255, 209, 102, 0.55);
      color: #ffd166;
    }
    .center-callout {
      align-self: center;
      text-align: center;
      background: rgba(3, 12, 24, 0.80);
      border: 1px solid rgba(255, 209, 102, 0.52);
      padding: 18px 28px;
      border-radius: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transform: translateY(14px) scale(0.96);
    }
    .center-callout.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .callout-head {
      color: #ffd166;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .callout-sub {
      margin-top: 6px;
      color: #cfefff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.10em;
    }
    .captions-wrap {
      align-self: center;
      text-align: center;
      max-width: 940px;
      padding: 18px 28px;
      border-radius: 18px;
      background: rgba(2, 9, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .captions-text {
      color: #ffffff;
      font-size: 44px;
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -0.01em;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
    }
    .captions-text .hi {
      color: #ffd166;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">MONARCH® URDU 3D</div>
      <div class="pill gold" id="beatTag">SAMANDARI SHIKAARI</div>
    </div>
    <div class="center-callout" id="callout">
      <div class="callout-head" id="calloutHead"></div>
      <div class="callout-sub" id="calloutSub"></div>
    </div>
    <div class="captions-wrap" id="captionWrap">
      <div class="captions-text" id="captionsText"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.28;
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03162a);
    scene.fog = new THREE.FogExp2(0x03162a, 0.023);

    const camera = new THREE.PerspectiveCamera(44, 1080 / 1920, 0.1, 260);

    // Rich Teal-Gold Underwater Cinema Lighting
    scene.add(new THREE.HemisphereLight(0x88dcff, 0x020c18, 1.42));
    const sunKey = new THREE.DirectionalLight(0xe6f8ff, 3.8);
    sunKey.position.set(8, 28, 10);
    scene.add(sunKey);
    const rimCyan = new THREE.DirectionalLight(0x38bdf8, 4.0);
    rimCyan.position.set(-11, 7, -12);
    scene.add(rimCyan);
    const rimGold = new THREE.DirectionalLight(0xffcf70, 2.1);
    rimGold.position.set(9, -3, -8);
    scene.add(rimGold);

    // Animated Snell's Window Sea Surface Overhead
    const surfaceGeo = new THREE.PlaneGeometry(170, 170, 40, 40);
    const surfaceBasePos = surfaceGeo.attributes.position.array.slice();
    const surfaceMat = new THREE.MeshBasicMaterial({
      color: 0x45c4ff,
      transparent: true,
      opacity: 0.27,
      side: THREE.DoubleSide,
    });
    const surfaceMesh = new THREE.Mesh(surfaceGeo, surfaceMat);
    surfaceMesh.rotation.x = Math.PI / 2;
    surfaceMesh.position.y = 14.0;
    scene.add(surfaceMesh);

    const snellDisc = new THREE.Mesh(
      new THREE.CircleGeometry(14, 48),
      new THREE.MeshBasicMaterial({ color: 0xdff6ff, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
    );
    snellDisc.rotation.x = Math.PI / 2;
    snellDisc.position.set(0, 13.85, -8);
    scene.add(snellDisc);

    // Deep Seabed Floor
    const floorGeo = new THREE.PlaneGeometry(180, 180, 42, 42);
    const floorPos = floorGeo.attributes.position;
    for (let i = 0; i < floorPos.count; i++) {
      const x = floorPos.getX(i);
      const y = floorPos.getY(i);
      floorPos.setZ(i, Math.sin(x * 0.14) * 0.68 + Math.cos(y * 0.12) * 0.68);
    }
    floorGeo.computeVertexNormals();
    const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ color: 0x051a2e, roughness: 0.76, metalness: 0.12 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -7.5;
    scene.add(floor);

    // Soft Radial God-Rays
    const rayCanvas = document.createElement('canvas');
    rayCanvas.width = 128;
    rayCanvas.height = 128;
    const rctx = rayCanvas.getContext('2d');
    const grad = rctx.createLinearGradient(0, 0, 0, 128);
    grad.addColorStop(0.0, 'rgba(135, 222, 255, 0.95)');
    grad.addColorStop(0.55, 'rgba(56, 189, 248, 0.35)');
    grad.addColorStop(1.0, 'rgba(56, 189, 248, 0.0)');
    rctx.fillStyle = grad;
    rctx.fillRect(0, 0, 128, 128);
    const rayTex = new THREE.CanvasTexture(rayCanvas);

    const rayGeo = new THREE.ConeGeometry(4.8, 28, 24, 1, true);
    const rayMat = new THREE.MeshBasicMaterial({
      map: rayTex,
      color: 0x9be7ff,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
    });
    const rays = [];
    for (let i = 0; i < 8; i++) {
      const r = new THREE.Mesh(rayGeo, rayMat);
      r.position.set((i - 3.5) * 4.2, 5.5, -4 - (i % 3) * 5);
      r.rotation.z = (i - 3.5) * 0.07;
      scene.add(r);
      rays.push(r);
    }

    // 550 Bioluminescent Plankton & Bubbles
    const pCount = 550;
    const pGeo = new THREE.BufferGeometry();
    const pArr = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      pArr[i * 3] = Math.sin(i * 12.9898) * 22;
      pArr[i * 3 + 1] = ((i % 45) / 45) * 20 - 7;
      pArr[i * 3 + 2] = Math.cos(i * 78.233) * 22;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
    const particles = new THREE.Points(
      pGeo,
      new THREE.PointsMaterial({ color: 0xc2f2ff, size: 0.12, transparent: true, opacity: 0.58, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    scene.add(particles);

    // Sonar & Pectoral-Slap Shockwave Rings
    const sonarGroup = new THREE.Group();
    const sonarRings = [];
    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.95, 1.12, 48),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
      );
      ring.rotation.x = Math.PI / 2;
      sonarGroup.add(ring);
      sonarRings.push(ring);
    }
    scene.add(sonarGroup);

    const shockRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.4, 0.14, 12, 40),
      new THREE.MeshBasicMaterial({ color: 0xdff6ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending })
    );
    scene.add(shockRing);

    const actors = { orcas: [], whale: null, shark: null, fishes: [] };
    const mixers = [];
    const loader = new GLTFLoader();

    function normalizeModel(gltfScene, targetLength) {
      const root = new THREE.Group();
      const inner = SkeletonUtils.clone(gltfScene);
      const box = new THREE.Box3().setFromObject(inner);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const scale = targetLength / Math.max(size.x, size.y, size.z, 0.001);
      inner.scale.setScalar(scale);
      inner.position.sub(center.multiplyScalar(scale));
      if (size.x > size.z * 1.15) {
        const pivot = new THREE.Group();
        pivot.add(inner);
        pivot.rotation.y = Math.PI / 2;
        root.add(pivot);
      } else {
        root.add(inner);
      }
      inner.traverse((o) => {
        if (o.isMesh && o.material) {
          o.material = o.material.clone();
          o.material.roughness = Math.min(o.material.roughness ?? 0.5, 0.44);
        }
      });
      return { root, inner };
    }

    const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));
    let TIMELINE = null;

    window.__MONARCH_INIT__ = async (timeline) => {
      TIMELINE = timeline;
      renderer.setSize(1080, 1920, false);

      const [orcaGltf, whaleGltf, fishGltf, sharkGltf] = await Promise.all([
        loadGLTF('/assets/orca.glb'),
        loadGLTF('/assets/whale.glb'),
        loadGLTF('/assets/fish1.glb'),
        loadGLTF('/assets/shark.glb'),
      ]);

      for (let i = 0; i < 3; i++) {
        const { root, inner } = normalizeModel(orcaGltf.scene, 4.2);
        scene.add(root);
        actors.orcas.push(root);
        if (orcaGltf.animations && orcaGltf.animations.length > 0) {
          const mx = new THREE.AnimationMixer(inner);
          const act = mx.clipAction(orcaGltf.animations[0]);
          act.play();
          act.time = i * 0.45;
          mixers.push(mx);
        }
      }

      const whaleRes = normalizeModel(whaleGltf.scene, 11.6);
      scene.add(whaleRes.root);
      actors.whale = whaleRes.root;

      const sharkRes = normalizeModel(sharkGltf.scene, 3.3);
      scene.add(sharkRes.root);
      actors.shark = sharkRes.root;

      for (let i = 0; i < 24; i++) {
        const fishRes = normalizeModel(fishGltf.scene, 0.72);
        scene.add(fishRes.root);
        actors.fishes.push(fishRes.root);
      }

      renderer.render(scene, camera);
    };

    function formatCaption(text, tLocal, dur) {
      const words = text.split(' ');
      const progress = Math.min(1, Math.max(0, tLocal / Math.max(dur * 0.90, 0.2)));
      const activeIdx = Math.min(words.length - 1, Math.floor(progress * words.length));
      const winStart = Math.max(0, Math.floor(activeIdx / 6) * 6);
      const slice = words.slice(winStart, winStart + 6);
      return slice
        .map((w, i) => (winStart + i <= activeIdx ? `<span class="hi">${w}</span>` : w))
        .join(' ');
    }

    window.__MONARCH_FRAME__ = (frameIdx) => {
      const fps = TIMELINE.fps || 30;
      const t = frameIdx / fps;

      for (const mx of mixers) mx.setTime(t);

      // Animate overhead sea ripples
      const sPos = surfaceGeo.attributes.position;
      for (let i = 0; i < sPos.count; i++) {
        const bx = surfaceBasePos[i * 3];
        const by = surfaceBasePos[i * 3 + 1];
        sPos.setZ(i, Math.sin(bx * 0.18 + t * 1.4) * 0.35 + Math.cos(by * 0.16 + t * 1.1) * 0.30);
      }
      sPos.needsUpdate = true;

      particles.position.y = (t * 0.38) % 4.0;
      rays.forEach((r, idx) => {
        r.rotation.z = (idx - 3.5) * 0.07 + Math.sin(t * 0.6 + idx) * 0.03;
      });

      const beats = TIMELINE.beats;
      let activeBeat = beats[beats.length - 1];
      let beatIdx = beats.length - 1;
      for (let i = 0; i < beats.length; i++) {
        if (t >= beats[i].start && t < beats[i].end) {
          activeBeat = beats[i];
          beatIdx = i;
          break;
        }
        if (t < beats[0].start) {
          activeBeat = beats[0];
          beatIdx = 0;
          break;
        }
      }

      const bt = Math.max(0, t - activeBeat.start);
      const bDur = Math.max(0.5, activeBeat.end - activeBeat.start);
      const u = Math.min(1, bt / bDur);

      document.getElementById('beatTag').textContent = activeBeat.tag;
      const callout = document.getElementById('callout');
      if (activeBeat.headline) {
        document.getElementById('calloutHead').textContent = activeBeat.headline;
        document.getElementById('calloutSub').textContent = activeBeat.subline || '';
        callout.classList.add('visible');
      } else {
        callout.classList.remove('visible');
      }

      const capWrap = document.getElementById('captionWrap');
      if (t >= activeBeat.start && t <= activeBeat.voice_end + 0.35) {
        capWrap.style.opacity = '1';
        document.getElementById('captionsText').innerHTML = formatCaption(
          activeBeat.text,
          t - activeBeat.start,
          activeBeat.voice_end - activeBeat.start
        );
      } else {
        capWrap.style.opacity = '0.28';
      }

      actors.orcas.forEach((o) => (o.visible = true));
      actors.whale.visible = true;
      actors.shark.visible = false;
      actors.fishes.forEach((f) => (f.visible = false));
      sonarRings.forEach((r) => (r.material.opacity = 0));
      shockRing.material.opacity = 0;

      const swim = (idx) => Math.sin(t * 3.1 + idx * 1.4) * 0.14;

      if (beatIdx === 0) {
        // Beat 1: 3 Orcas charge forward as Great White Shark bolts past!
        actors.whale.visible = false;
        actors.orcas[0].position.set(0, 0.25 + swim(0), -4.2 + u * 5.2);
        actors.orcas[0].rotation.set(0, 0, Math.sin(t * 2) * 0.04);
        actors.orcas[1].position.set(-3.2, -0.5 + swim(1), -7.5 + u * 5.0);
        actors.orcas[1].rotation.set(0, 0.12, 0);
        actors.orcas[2].position.set(3.4, 0.8 + swim(2), -8.2 + u * 4.8);
        actors.orcas[2].rotation.set(0, -0.1, 0);
        actors.shark.visible = true;
        actors.shark.position.set(-2.2 + u * 7.8, -1.2, 2.0 + u * 3.2);
        actors.shark.rotation.set(0, Math.PI * 0.42, 0.1);
        camera.position.set(Math.sin(t * 1.1) * 0.35, 1.1 + u * 0.35, 7.4 - u * 1.6);
        camera.lookAt(0, 0.1, -1.4);
      } else if (beatIdx === 1) {
        // Beat 2: Giant Humpback rises ominously behind lead Orca
        actors.orcas[0].position.set(-1.3, -0.4 + swim(0), 1.8);
        actors.orcas[0].rotation.set(0, 0.65, 0);
        actors.orcas[1].visible = false;
        actors.orcas[2].visible = false;
        actors.whale.position.set(1.2, -3.5 + u * 4.4, -7.5);
        actors.whale.rotation.set(-0.18 + u * 0.16, -0.45, 0.06);
        camera.position.set(-1.8 + u * 1.2, 0.2, 9.2 - u * 1.4);
        camera.lookAt(0.2, 0.1, -3.5);
      } else if (beatIdx === 2) {
        // Beat 3: Clean Side-by-Side Scale Comparison (6T vs 40T)
        actors.orcas[0].position.set(-0.2, -3.2 + swim(0), 1.5);
        actors.orcas[0].rotation.set(0, Math.PI / 2, 0);
        actors.orcas[1].visible = false;
        actors.orcas[2].visible = false;
        actors.whale.position.set(0.0, 2.5 + swim(3) * 0.5, -2.5);
        actors.whale.rotation.set(0, Math.PI / 2, 0);
        camera.position.set(0.0, -0.1, 18.2 - u * 1.4);
        camera.lookAt(0, -0.1, -0.5);
      } else if (beatIdx === 3) {
        // Beat 4: 5M Pectoral Fin Slap + Water Shockwave Ring!
        actors.orcas.forEach((o) => (o.visible = false));
        const slap = Math.sin(u * Math.PI);
        actors.whale.position.set(-0.6, 0.4 + swim(0) * 0.4, 0);
        actors.whale.rotation.set(0.14, 0.55 + u * 0.35, -0.14 - slap * 0.18);
        shockRing.position.set(1.2, -0.6, 1.4);
        shockRing.rotation.set(0.5, 0.3, 0);
        shockRing.scale.setScalar(0.6 + u * 4.5);
        shockRing.material.opacity = Math.max(0, (1.0 - u) * 0.65);
        camera.position.set(4.8 - u * 1.8, -1.2 + u * 1.0, 9.2 - u * 1.4);
        camera.lookAt(0.8, -0.2, 0.2);
      } else if (beatIdx === 4) {
        // Beat 5: Sonar Pulses + 24-Fish Carousel Bait Ball + Shark
        actors.whale.position.set(0, 1.4, -8.5);
        actors.whale.rotation.set(0.1, 0.2, 0);
        actors.orcas[0].position.set(-2.8 + u * 1.5, -0.5, -1.5);
        actors.orcas[0].rotation.set(0, 0.9, 0);
        actors.orcas[1].position.set(3.1 - u * 1.5, 0.4, -2.0);
        actors.orcas[1].rotation.set(0, -0.9, 0);
        actors.orcas[2].visible = false;
        actors.shark.visible = true;
        actors.shark.position.set(-1.5 + u * 3.0, -3.2, 1.0);
        actors.shark.rotation.set(0, Math.PI / 2, 0);

        actors.fishes.forEach((f, idx) => {
          f.visible = true;
          const ang = t * 2.5 + (idx / 24) * Math.PI * 2;
          const rad = 2.0 + (idx % 3) * 0.58;
          f.position.set(Math.cos(ang) * rad, -0.5 + Math.sin(ang * 2) * 0.65, 1.5 + Math.sin(ang) * rad);
          f.rotation.set(0, -ang, 0);
        });

        sonarGroup.position.set(0, 1.2, -7.5);
        sonarRings.forEach((r, idx) => {
          const p = (t * 0.8 + idx * 0.33) % 1.0;
          r.scale.setScalar(1.0 + p * 12.0);
          r.material.opacity = (1.0 - p) * 0.65;
        });

        camera.position.set(Math.sin(t * 0.7) * 1.4, 2.4, 9.6);
        camera.lookAt(0, -0.2, -1.5);
      } else if (beatIdx === 5) {
        // Beat 6: Intervention Charge
        actors.whale.position.set(0, -0.5 + u * 1.1, -9.0 + u * 9.5);
        actors.whale.rotation.set(-0.15, 0, Math.sin(t * 6) * 0.04);
        actors.orcas[0].position.set(-2.2 - u * 1.8, 0.6, 0.5);
        actors.orcas[0].rotation.set(0, -0.7, 0.25);
        actors.orcas[1].position.set(2.3 + u * 1.8, -0.4, 0.2);
        actors.orcas[1].rotation.set(0, 0.7, -0.25);
        actors.orcas[2].visible = false;
        camera.position.set(Math.sin(t * 16) * 0.08, -0.6 + Math.cos(t * 13) * 0.07, 8.2 - u * 1.5);
        camera.lookAt(0, 0.1, -1.0);
      } else if (beatIdx === 6) {
        // Beat 7: Orcas Retreat into Deep Fog
        actors.whale.position.set(0.2, 0.2 + swim(0) * 0.4, 1.5);
        actors.whale.rotation.set(0.05, Math.PI * 0.82, 0);
        actors.orcas[0].position.set(-1.6 - u * 2.0, 1.4 + u * 1.4, -2.5 - u * 11.0);
        actors.orcas[0].rotation.set(-0.18, Math.PI - 0.35, 0.15);
        actors.orcas[1].position.set(1.8 + u * 2.2, -0.8 + u * 1.6, -3.0 - u * 11.5);
        actors.orcas[1].rotation.set(-0.18, Math.PI + 0.35, -0.15);
        actors.orcas[2].visible = false;
        camera.position.set(2.4 - u * 1.2, 2.2, 10.4);
        camera.lookAt(0, 0.4, -4.5);
      } else {
        // Beat 8: Hero Guardian Closer Rising Toward Snell's Window
        actors.orcas.forEach((o) => (o.visible = false));
        actors.whale.position.set(0, -1.0 + u * 3.0, -1.2);
        actors.whale.rotation.set(-0.26, -0.55 + u * 0.45, 0.06);
        camera.position.set(-4.2, 1.4 + u * 0.8, 11.2 - u * 1.4);
        camera.lookAt(0, 0.4 + u * 1.6, -1.2);
      }

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
