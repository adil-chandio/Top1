<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MONARCH Cinema 3D — EP01 The Largest Bear That Ever Hunted Humans</title>
<style>

  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

<script type="importmap">

<canvas id="hud" width="1920" height="1080"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1920, H = 1080;
const canvas = document.getElementById('gl');
canvas.width = W; canvas.height = H;
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');

// ------------------------------------------------------------------ RENDERER & POST
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030508);
scene.fog = new THREE.FogExp2(0x060a12, 0.028);

const camera = new THREE.PerspectiveCamera(42, W / H, 0.08, 160);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.44, 0.55, 0.76);
composer.addPass(bloomPass);

// Cinema Grade Shader: teal/amber split contrast, subtle edge CA, optical vignette, 35mm grain
const CinemaGradeShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0.0 },
    uBlackout: { value: 0.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uBlackout;
    varying vec2 vUv;
    float hash12(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    void main() {
      vec2 d = vUv - 0.5;
      float r2 = dot(d, d);
      // subtle optical edge chromatic aberration
      vec2 shift = d * r2 * 0.0028;
      float r = texture2D(tDiffuse, vUv + shift).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - shift).b;
      vec3 col = vec3(r, g, b);
      // documentary split grade: cool slate shadows, warm fire highlights
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col += mix(vec3(-0.008, 0.002, 0.014), vec3(0.022, 0.006, -0.010), smoothstep(0.08, 0.72, lum));
      // organic vignette
      float vig = smoothstep(0.92, 0.22, r2 * 1.45);
      col *= mix(0.28, 1.0, vig);
      // fine 35mm grain to eliminate banding in dark cave shadows
      float grain = (hash12(vUv * vec2(1920.0, 1080.0) + uTime * 37.0) - 0.5) * 0.024;
      col = clamp(col + grain, 0.0, 1.0) * (1.0 - uBlackout);
      gl_FragColor = vec4(col, 1.0);
    }
  `
};
const gradePass = new ShaderPass(CinemaGradeShader);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ------------------------------------------------------------------ PROCEDURAL PBR TEXTURES
function makeBoneTextures() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#c8b694'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) {
    const x = (Math.sin(i * 12.9898) * 43758.5453 % 1 + 1) % 1 * 512;
    const y = (Math.sin(i * 78.233) * 43758.5453 % 1 + 1) % 1 * 512;
    const rad = 4 + (i % 24);
    g.fillStyle = i % 3 === 0 ? 'rgba(82,62,40,0.10)' : 'rgba(235,222,195,0.08)';
    g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = 'rgba(48,34,20,0.34)'; g.lineWidth = 1.2;
  for (let i = 0; i < 65; i++) {
    let x = ((i * 73) % 512), y = ((i * 139) % 512);
    g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 5; s++) {
      x += Math.sin(i + s * 1.7) * 18;
      y += Math.cos(i * 1.3 + s) * 18;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function makeCaveFloorTextures() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const r = document.createElement('canvas'); r.width = 512; r.height = 512;
  const gc = c.getContext('2d'), gr = r.getContext('2d');
  gc.fillStyle = '#1d1c1e'; gc.fillRect(0, 0, 512, 512);
  gr.fillStyle = '#c8c8c8'; gr.fillRect(0, 0, 512, 512); // rough limestone
  for (let i = 0; i < 1200; i++) {
    const x = ((Math.sin(i * 19.31) * 9187.13) % 1 + 1) % 1 * 512;
    const y = ((Math.sin(i * 41.17) * 6311.71) % 1 + 1) % 1 * 512;
    const rad = 2 + (i % 14);
    gc.fillStyle = i % 2 ? 'rgba(54,49,44,0.22)' : 'rgba(12,13,16,0.28)';
    gc.beginPath(); gc.arc(x, y, rad, 0, Math.PI * 2); gc.fill();
  }
  // Shiny wet cave puddles (low roughness dark blobs)
  for (let p = 0; p < 14; p++) {
    const px = ((Math.sin(p * 7.1) * 999) % 1 + 1) % 1 * 512;
    const py = ((Math.cos(p * 3.7) * 999) % 1 + 1) % 1 * 512;
    const rx = 28 + (p % 4) * 16;
    const grad = gr.createRadialGradient(px, py, 4, px, py, rx);
    grad.addColorStop(0, '#181818'); // wet mirror-like puddle
    grad.addColorStop(0.7, '#323232');
    grad.addColorStop(1, 'rgba(200,200,200,0)');
    gr.fillStyle = grad;
    gr.beginPath(); gr.arc(px, py, rx, 0, Math.PI * 2); gr.fill();
    gc.fillStyle = 'rgba(8,10,14,0.45)';
    gc.beginPath(); gc.arc(px, py, rx * 0.8, 0, Math.PI * 2); gc.fill();
  }
  const map = new THREE.CanvasTexture(c); map.colorSpace = THREE.SRGBColorSpace;
  const rough = new THREE.CanvasTexture(r);
  map.wrapS = map.wrapT = rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  map.repeat.set(6, 10); rough.repeat.set(6, 10);
  return { map, rough };
}

function makeChauvetMuralTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  // Limestone rock base
  g.fillStyle = '#332c25'; g.fillRect(0, 0, 1024, 512);
  for (let i = 0; i < 1800; i++) {
    const x = (i * 97) % 1024, y = ((i * 53) ^ (i * 17)) % 512;
    g.fillStyle = i % 3 ? 'rgba(24,20,17,0.30)' : 'rgba(88,74,60,0.18)';
    g.fillRect(x, y, 6 + (i % 12), 4 + (i % 8));
  }
  // Paint 3 Paleolithic Red Ochre & Charcoal Cave Bears across rock relief!
  function drawOchreBear(cx, cy, sc, flip) {
    g.save();
    g.translate(cx, cy);
    g.scale(flip ? -sc : sc, sc);
    g.lineCap = 'round'; g.lineJoin = 'round';
    // Red ochre body wash
    g.fillStyle = 'rgba(156, 44, 24, 0.72)';
    g.beginPath();
    g.moveTo(-110, 20);
    g.bezierCurveTo(-105, -55, -35, -75, 10, -52); // massive cave bear shoulder hump!
    g.bezierCurveTo(45, -78, 82, -62, 118, -18);   // steep forehead & snout
    g.lineTo(126, 8); g.lineTo(95, 16);
    g.bezierCurveTo(78, 35, 62, 65, 58, 92);       // front leg
    g.lineTo(38, 92); g.lineTo(34, 34);
    g.bezierCurveTo(-5, 38, -42, 36, -66, 30);
    g.lineTo(-76, 92); g.lineTo(-98, 92);          // hind leg
    g.closePath();
    g.fill();
    // Charcoal outline (Chauvet style!)
    g.strokeStyle = 'rgba(18, 12, 10, 0.88)';
    g.lineWidth = 7;
    g.stroke();
    // Ear & eye dot
    g.beginPath(); g.arc(62, -55, 8, 0, Math.PI * 2); g.stroke();
    g.fillStyle = '#120c0a';
    g.beginPath(); g.arc(88, -32, 4, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  drawOchreBear(240, 260, 1.05, false);
  drawOchreBear(560, 235, 1.28, false);
  drawOchreBear(840, 280, 0.92, true);
  // Ancient red ochre hand stencil!
  g.fillStyle = 'rgba(164, 46, 24, 0.52)';
  g.beginPath(); g.arc(110, 130, 26, 0, Math.PI * 2); g.fill();
  for (let f = -2; f <= 2; f++) {
    g.save(); g.translate(110 + f * 9, 108); g.rotate(f * 0.14);
    g.fillRect(-3, -32, 6, 32); g.restore();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const boneTex = makeBoneTextures();
const floorTex = makeCaveFloorTextures();
const chauvetTex = makeChauvetMuralTexture();

// ------------------------------------------------------------------ PROCEDURAL 15k-TRI ANATOMICAL BEAR SKULL
function buildBearSkull(isCaveBear = true) {
  const grp = new THREE.Group();
  const boneMat = new THREE.MeshPhysicalMaterial({
    map: boneTex, bumpMap: boneTex, bumpScale: 0.012,
    color: isCaveBear ? 0xd9cbb0 : 0xc7b494,
    roughness: 0.56, metalness: 0.02, clearcoat: 0.12, clearcoatRoughness: 0.65,
  });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x0c0907, roughness: 0.95 });
  const toothMat = new THREE.MeshPhysicalMaterial({
    color: 0xe9dec3, roughness: 0.28, clearcoat: 0.35, clearcoatRoughness: 0.25,
  });

  // Cranium dome (steep forehead step for Ursus spelaeus!)
  const cranium = new THREE.Mesh(new THREE.SphereGeometry(0.145, 32, 24), boneMat);
  cranium.scale.set(0.92, isCaveBear ? 0.96 : 0.78, 1.18);
  cranium.position.set(0, isCaveBear ? 0.155 : 0.135, -0.08);
  cranium.castShadow = cranium.receiveShadow = true;

  // Steep Cave Bear Glabella Forehead Brow Ridge!
  const brow = new THREE.Mesh(new THREE.SphereGeometry(0.112, 26, 20), boneMat);
  brow.scale.set(0.94, isCaveBear ? 0.92 : 0.62, 0.92);
  brow.position.set(0, isCaveBear ? 0.168 : 0.128, 0.045);
  brow.rotation.x = isCaveBear ? 0.36 : 0.18;
  brow.castShadow = true;

  // Prominent Sagittal Crest along skull top
  const crest = new THREE.Mesh(new THREE.BoxGeometry(0.022, isCaveBear ? 0.055 : 0.028, 0.22), boneMat);
  crest.position.set(0, isCaveBear ? 0.255 : 0.208, -0.095);
  crest.rotation.x = -0.15;

  // Heavy Snout & Premaxilla
  const snout = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.095, 0.22, 24), boneMat);
  snout.rotation.x = Math.PI * 0.5;
  snout.scale.set(0.88, 1.0, 0.78);
  snout.position.set(0, 0.088, 0.17);
  snout.castShadow = true;

  // Nasal aperture & deep hollowed eye orbits
  const nasal = new THREE.Mesh(new THREE.SphereGeometry(0.036, 16, 14), darkMat);
  nasal.scale.set(0.95, 0.85, 1.3);
  nasal.position.set(0, 0.095, 0.265);

  for (const s of [-1, 1]) {
    // Deep recessed eye socket
    const orbit = new THREE.Mesh(new THREE.SphereGeometry(0.036, 18, 16), darkMat);
    orbit.scale.set(0.85, 0.92, 0.88);
    orbit.position.set(s * 0.068, 0.132, 0.078);
    // Sweeping Zygomatic Cheek Arch
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s * 0.072, 0.095, 0.085),
      new THREE.Vector3(s * 0.136, 0.092, -0.015),
      new THREE.Vector3(s * 0.105, 0.108, -0.115),
    ]);
    const arch = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, 0.019, 12, false), boneMat);
    arch.castShadow = true;
    // Curved Canines (upper + lower)
    const can = new THREE.Mesh(new THREE.ConeGeometry(0.011, 0.058, 14), toothMat);
    can.position.set(s * 0.036, 0.042, 0.242);
    can.rotation.x = Math.PI - 0.18;
    can.rotation.z = s * -0.08;
    grp.add(orbit, arch, can);
  }

  // Broad Flat Grinding Molars (signature cave bear trait!)
  for (const s of [-1, 1]) {
    for (let m = 0; m < 4; m++) {
      const molar = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.014, 0.024), toothMat);
      molar.position.set(s * 0.042, 0.052, 0.10 + m * 0.028);
      grp.add(molar);
    }
  }

  // Lower Mandible Jawbone
  for (const s of [-1, 1]) {
    const jawCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s * 0.098, 0.092, -0.105),
      new THREE.Vector3(s * 0.072, 0.018, 0.015),
      new THREE.Vector3(s * 0.038, 0.014, 0.215),
      new THREE.Vector3(0, 0.020, 0.258),
    ]);
    const jaw = new THREE.Mesh(new THREE.TubeGeometry(jawCurve, 20, 0.020, 12, false), boneMat);
    jaw.castShadow = true;
    grp.add(jaw);
  }

  grp.add(cranium, brow, crest, snout, nasal);
  return grp;
}

// ------------------------------------------------------------------ PROCEDURAL VERTEBRA FOR HOHLE FELS
function buildVertebra() {
  const g = new THREE.Group();
  const bMat = new THREE.MeshPhysicalMaterial({ map: boneTex, bumpMap: boneTex, bumpScale: 0.014, color: 0xc2b08d, roughness: 0.62 });
  const centrum = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.14, 24), bMat);
  centrum.rotation.x = Math.PI * 0.5;
  centrum.castShadow = centrum.receiveShadow = true;
  const spine = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.26, 0.09), bMat);
  spine.position.set(0, 0.16, -0.02);
  spine.rotation.x = -0.32;
  spine.castShadow = true;
  for (const s of [-1, 1]) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.035, 0.06), bMat);
    wing.position.set(s * 0.14, 0.04, 0);
    wing.rotation.z = s * -0.18;
    wing.castShadow = true;
    g.add(wing);
  }
  g.add(centrum, spine);
  return g;
}

// ------------------------------------------------------------------ VOLUMETRIC SHADERS (FIRE, GOD RAYS, BREATH, PARTICLES)
function makeGlowTexture(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,200,120,0.4)') {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, mid); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  return t;
}
const emberTex = makeGlowTexture('rgba(255,235,180,1)', 'rgba(255,110,20,0.55)');
const dustTex = makeGlowTexture('rgba(255,244,220,0.85)', 'rgba(220,210,190,0.18)');
const snowTex = makeGlowTexture('rgba(235,245,255,0.95)', 'rgba(180,210,245,0.28)');

// Volumetric Campfire Flame Plume Shader
const flameShaderMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0.0 }, uIntensity: { value: 1.0 } },
  vertexShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main() {
      vUv = uv;
      vec3 p = position;
      float sway = sin(uTime * 7.5 + p.y * 5.0) * 0.08 * uv.y + cos(uTime * 11.0 + p.y * 8.0) * 0.04 * uv.y;
      p.x += sway;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    uniform float uIntensity;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y);
    }
    void main() {
      float n = noise(vec2(vUv.x * 5.0, vUv.y * 4.5 - uTime * 4.2)) * 0.65
              + noise(vec2(vUv.x * 11.0, vUv.y * 9.0 - uTime * 7.5)) * 0.35;
      float cx = abs(vUv.x - 0.5) * 2.0;
      float shape = (1.0 - smoothstep(0.0, 0.85 * (1.0 - vUv.y * 0.68), cx)) * (1.0 - smoothstep(0.35, 1.0, vUv.y));
      float alpha = clamp((shape * (n * 1.45 + 0.15) - 0.18) * 1.8, 0.0, 1.0) * uIntensity;
      vec3 col = mix(vec3(1.0, 0.24, 0.02), vec3(1.0, 0.88, 0.35), smoothstep(0.2, 0.85, alpha * (1.0 - vUv.y * 0.5)));
      gl_FragColor = vec4(col * 1.6, alpha);
    }
  `
});

// Volumetric God-Ray Cone Shader (soft Fresnel edge so zero hard geometry lines!)
const godRayMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uColor: { value: new THREE.Color(0x8bb8e8) }, uOpacity: { value: 0.16 } },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      vUv = uv;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vNormal = normalize(normalMatrix * normal);
      vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vView;
    uniform vec3 uColor;
    uniform float uOpacity;
    void main() {
      float fres = pow(abs(dot(vNormal, vView)), 2.2);
      float fade = smoothstep(0.0, 0.25, vUv.y) * smoothstep(1.0, 0.08, vUv.y);
      gl_FragColor = vec4(uColor, fres * fade * uOpacity);
    }
  `
});

// ------------------------------------------------------------------ SCENE WORLD ARCHITECTURE
// 1. Wet Limestone Cave Floor (inside + icy snowy steppe outside)
const caveFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(36, 48, 48, 48),
  new THREE.MeshStandardMaterial({
    map: floorTex.map, roughnessMap: floorTex.rough, bumpMap: floorTex.rough, bumpScale: 0.04,
    roughness: 0.88, metalness: 0.05,
  })
);
caveFloor.rotation.x = -Math.PI * 0.5;
caveFloor.position.set(0, 0, -6);
caveFloor.receiveShadow = true;
scene.add(caveFloor);

// Snowy Ice-Age Exterior Ground (Z = +5 -> +65)
const snowPos = new THREE.PlaneGeometry(90, 70, 64, 48);
snowPos.rotateX(-Math.PI * 0.5);
const spAttr = snowPos.attributes.position;
for (let i = 0; i < spAttr.count; i++) {
  const x = spAttr.getX(i), z = spAttr.getZ(i);
  const h = Math.sin(x * 0.14) * Math.cos(z * 0.11) * 0.55 + Math.max(0, (Math.abs(x) - 10) * 0.18);
  spAttr.setY(i, h - 0.05);
}
snowPos.computeVertexNormals();
const snowGround = new THREE.Mesh(
  snowPos,
  new THREE.MeshStandardMaterial({ color: 0xcbd8e6, roughness: 0.72, metalness: 0.04 })
);
snowGround.position.set(0, 0, 36);
snowGround.receiveShadow = true;
scene.add(snowGround);

// Procedural Cave Shell Dome + Stalactites (completely encloses interior shots so zero black sky leaks inside!)
const caveGeo = new THREE.CylinderGeometry(7.2, 8.2, 24, 36, 16, true, -0.15, Math.PI + 0.3);
caveGeo.rotateZ(Math.PI * 0.5);
caveGeo.rotateY(Math.PI * 0.5);
const cgAttr = caveGeo.attributes.position;
for (let i = 0; i < cgAttr.count; i++) {
  const vx = cgAttr.getX(i), vy = cgAttr.getY(i), vz = cgAttr.getZ(i);
  const n = Math.sin(vx * 0.9 + vz * 0.7) * 0.55 + Math.cos(vy * 1.4 - vz * 0.5) * 0.38;
  cgAttr.setXYZ(i, vx * (1 + n * 0.12), Math.max(-0.5, vy * 0.78 + n * 0.45), vz);
}
caveGeo.computeVertexNormals();
const caveShell = new THREE.Mesh(
  caveGeo,
  new THREE.MeshStandardMaterial({
    map: floorTex.map, bumpMap: floorTex.rough, bumpScale: 0.08,
    color: 0x35302c, roughness: 0.92, side: THREE.BackSide,
  })
);
caveShell.position.set(0, 0.2, -5.8);
caveShell.receiveShadow = true;
scene.add(caveShell);

// Cave back dead-end wall (Z = -17.5)
const backWall = new THREE.Mesh(
  new THREE.SphereGeometry(9.5, 24, 18),
  new THREE.MeshStandardMaterial({ color: 0x1b1918, roughness: 0.95, side: THREE.BackSide })
);
backWall.position.set(0, 2.0, -14.0);
scene.add(backWall);

// Stalactites hanging from cave roof
const stalMat = new THREE.MeshStandardMaterial({ color: 0x2f2b28, roughness: 0.85, bumpMap: floorTex.rough, bumpScale: 0.03 });

const loader = new GLTFLoader();
function loadGLB(path) {
  return new Promise((resolve) => {
    loader.load(path, (gltf) => resolve(gltf), undefined, (err) => {
      console.warn('GLB missing:', path, err);
      resolve(null);
    });
  });
}

function normalizeAndGround(root, targetMaxDim, yFloor = 0, castsShadow = true) {
  const box = new THREE.Box3().setFromObject(root);
  const sz = new THREE.Vector3(); box.getSize(sz);
  const maxD = Math.max(sz.x, sz.y, sz.z, 0.001);
  const s = targetMaxDim / maxD;
  root.scale.multiplyScalar(s);
  root.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(root);
  const c2 = new THREE.Vector3(); b2.getCenter(c2);
  root.position.x -= c2.x;
  root.position.z -= c2.z;
  root.position.y += yFloor - b2.min.y;
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = castsShadow;
      o.receiveShadow = true;
      if (o.material) {
        o.material.envMapIntensity = 0.7;
      }
    }
  });
  return root;
}

const TIMELINE = await (await fetch('./timeline.json')).json();

function drawCinemaHUD(t) {
  ctx.clearRect(0, 0, W, H);
  // Subtle cinematic 2.35:1 ultra-thin bars (48px top/bottom) -> pure theatrical IMAX feel!
  ctx.fillStyle = 'rgba(0,0,0,0.92)';
  ctx.fillRect(0, 0, W, 42);
  ctx.fillRect(0, H - 42, W, 42);

  // Active beat & chapter label (tiny ultra-clean top-left tracker)
  const beat = TIMELINE.beats.find((b) => t >= b.beat_start && t < b.beat_end) || TIMELINE.beats[TIMELINE.beats.length - 1];
  if (beat && t > 0.4 && t < 99.6) {
    ctx.save();
    ctx.font = '600 15px "Inter", "Segoe UI", Arial, sans-serif';
    ctx.letterSpacing = '4px';
    ctx.fillStyle = 'rgba(226, 232, 240, 0.52)';
    ctx.textAlign = 'left';
    ctx.fillText(beat.chapter, 54, 74);
    ctx.restore();
  }

  // Active documentary story card (crisp serif title + subline, NO cheesy boxes!)
  if (beat && beat.cards) {
    for (const card of beat.cards) {
      if (t >= card.t0 && t <= card.t1) {
        const fade = Math.min(1, (t - card.t0) / 0.35) * Math.min(1, (card.t1 - t) / 0.35);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.90)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 3;
        ctx.font = '700 54px Georgia, "Times New Roman", serif';
        ctx.fillStyle = '#f8f5ef';
        ctx.fillText(card.text, W * 0.5, H - 108);
        if (card.sub) {
          ctx.font = '600 20px "Inter", "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = '#e2b675';
          ctx.fillText(card.sub, W * 0.5, H - 72);
        }
        ctx.restore();
      }
    }
  }
}

// ------------------------------------------------------------------ DETERMINISTIC ANIMATION DRIVER
function setActionAtTime(mixer, clips, regex, tSec, loopMode = THREE.LoopRepeat) {
  if (!mixer) return;
  const keys = Object.keys(clips);
  const k = keys.find((n) => regex.test(n)) || keys[0];
  if (!k) return;
  for (const name of keys) {
    if (name === k) {
      clips[name].enabled = true;
      clips[name].setEffectiveWeight(1);
      clips[name].setLoop(loopMode, Infinity);
      clips[name].play();
    } else {
      clips[name].stop();
    }
  }
  mixer.setTime(tSec);
}

function updateParticles(t) {
  // Campfire flicker
  const flick = 1.0 + Math.sin(t * 15.3) * 0.14 + Math.cos(t * 23.7) * 0.09 + Math.sin(t * 7.1) * 0.07;
  flameShaderMat.uniforms.uTime.value = t;
  const fireFade = t > 94.5 ? Math.max(0.08, 1.0 - (t - 94.5) / 5.0) : 1.0;
  flameShaderMat.uniforms.uIntensity.value = (t < 0.45 ? t / 0.45 : 1.0) * fireFade;
  fireLight.intensity = 6.2 * flick * fireFade * (t < 0.45 ? t / 0.45 : 1.0);
  if (actors.hunterTorchLight) actors.hunterTorchLight.intensity = 4.6 * flick;

  // Embers rising
  const eArr = emberGeo.attributes.position.array;
  for (let i = 0; i < EMBER_N; i++) {
    const life = ((t * (0.45 + (i % 5) * 0.08) + i * 0.17) % 1.0);
    eArr[i * 3 + 0] = Math.sin(t * 2.5 + i * 1.9) * (0.12 + life * 0.38);
    eArr[i * 3 + 1] = 0.12 + life * 2.4;
    eArr[i * 3 + 2] = Math.cos(t * 2.1 + i * 2.7) * (0.12 + life * 0.35);
  }
  emberGeo.attributes.position.needsUpdate = true;

  // Dust motes drifting in cave
  const dArr = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST_N; i++) {
    dArr[i * 3 + 0] = -4.0 + ((i * 0.73) % 8.0) + Math.sin(t * 0.35 + i) * 0.25;
    dArr[i * 3 + 1] = 0.2 + ((i * 0.41 + t * 0.04) % 3.6);
    dArr[i * 3 + 2] = -6.0 + ((i * 1.13) % 12.0) + Math.cos(t * 0.28 + i) * 0.22;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // Blizzard snow outside cave (Z = 6 -> 34)
  const sArr = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOW_N; i++) {
    const fall = ((i * 0.31 + t * (0.9 + (i % 4) * 0.25)) % 7.5);
    const drift = ((i * 0.91 + t * 2.4) % 24.0) - 12.0;
    sArr[i * 3 + 0] = drift;
    sArr[i * 3 + 1] = 7.2 - fall;
    sArr[i * 3 + 2] = 6.2 + (i % 28);
  }
  snowGeo.attributes.position.needsUpdate = true;

  // Steaming breath pouring from bear snout
  const bArr = breathGeo.attributes.position.array;
  const brCycle = (t * 0.42) % 1.0;
  for (let i = 0; i < BREATH_N; i++) {
    const ph = (brCycle + i * 0.012) % 1.0;
    bArr[i * 3 + 0] = actors.bear.position.x + Math.sin(i * 3.1 + t * 2.0) * 0.16 * ph;
    bArr[i * 3 + 1] = 1.02 + ph * 0.42 + Math.cos(i * 1.7) * 0.08 * ph;
    bArr[i * 3 + 2] = actors.bear.position.z - 0.95 - ph * 0.95;
  }
  breathGeo.attributes.position.needsUpdate = true;
}

const lerp = (a, b, u) => a + (b - a) * THREE.MathUtils.clamp(u, 0, 1);
const ease = (u) => { u = THREE.MathUtils.clamp(u, 0, 1); return u * u * (3 - 2 * u); };

function renderFrameAt(t) {
  gradePass.uniforms.uTime.value = t;
  updateParticles(t);

  // Default visibility
  altarGroup.visible = true;
  caveSkull.visible = true;
  caveSkull.position.set(0, 0.92, 0.05);
  caveSkull.rotation.set(0, 0.25, 0);
  brownSkull.visible = false;
  if (actors.molar) actors.molar.visible = false;
  actors.bear.visible = false;
  actors.wolf.visible = false;
  actors.hunter.visible = false;
  hohleGroup.visible = false;
  breathPts.visible = false;
  hearthGroup.visible = true;
  macroSpot.intensity = 0.0;
  moonDir.color.setHex(0x88b4eb);
  moonDir.intensity = 2.2;
  hemiLight.intensity = 0.38;
  rimLight.intensity = 5.5;
  fireLight.position.set(-1.75, 0.85, -1.05);
  godRayMat.uniforms.uOpacity.value = 0.16;
  gradePass.uniforms.uBlackout.value = t < 0.2 ? 1.0 - t / 0.2 : (t > 99.6 ? (t - 99.6) / 0.9 : 0.0);

  const look = new THREE.Vector3(0, 1.1, -2.5);
  const pos = new THREE.Vector3(0, 1.4, 0.5);
  camera.fov = 42;

  // ---------------- BEAT 1: COLD OPEN (0.00 - 12.22s)
  if (t < 12.22) {
    const u = ease(t / 12.22);
    // Slow ominous reveal from macro skull silhouette out to altar rock & firelight
    pos.set(lerp(-0.42, -1.25, u), lerp(1.24, 1.62, u), lerp(-1.55, 0.55, u));
    look.set(lerp(0.0, -0.15, u), lerp(1.12, 1.14, u), lerp(-2.45, -2.40, u));
    caveSkull.rotation.y = 0.22 + u * 0.14;
    macroSpot.intensity = lerp(0.4, 2.2, u);
    macroSpot.target.position.copy(caveSkull.getWorldPosition(new THREE.Vector3()));
  }
  // ---------------- BEAT 2: 600 KG DOORWAY REVEAL (12.22 - 24.11s)
  else if (t < 24.11) {
    const u = (t - 12.22) / (24.11 - 12.22);
    actors.bear.visible = true;
    breathPts.visible = true;
    // Giant Cave Bear lumbers in from snowy cave mouth (Z=8.8 -> Z=4.6), filling the only door!
    const zWalk = lerp(8.8, 4.6, ease(Math.min(1, u * 1.15)));
    const stepOsc = Math.sin(t * 4.2);
    actors.bear.position.set(Math.sin(t * 2.1) * 0.06, Math.abs(stepOsc) * 0.055, zWalk);
    actors.bear.rotation.set(Math.cos(t * 4.2) * 0.025, Math.PI + Math.sin(t * 1.2) * 0.08, stepOsc * 0.03);
    // Low-angle camera inside cave looking up at towering doorway bear!
    pos.set(lerp(-0.45, 0.28, ease(u)), lerp(1.05, 1.28, ease(u)), lerp(0.15, 1.65, ease(u)));
    look.set(0.0, lerp(1.18, 1.32, ease(u)), zWalk - 0.3);
    rimLight.position.set(0.8, 3.6, 8.5);
    rimLight.target.position.copy(actors.bear.position);
    godRayMat.uniforms.uOpacity.value = 0.24;
  }
  // ---------------- BEAT 3: ANATOMICAL FORENSICS (24.11 - 34.67s)
  else if (t < 34.67) {
    const u = (t - 24.11) / (34.67 - 24.11);
    macroSpot.intensity = 4.2;
    macroSpot.position.set(0.2, 2.7, -0.7);
    if (u < 0.56) {
      // Side-by-side Cave Bear Skull vs Modern Brown Bear Skull turntable!
      const tu = ease(u / 0.56);
      caveSkull.position.set(-0.42, 0.94, 0.08);
      brownSkull.visible = true;
      brownSkull.position.set(0.45, 0.90, 0.08);
      caveSkull.rotation.y = tu * Math.PI * 1.15;
      brownSkull.rotation.y = tu * Math.PI * 1.15;
      pos.set(lerp(-0.15, 0.12, tu), 1.32, lerp(-1.15, -1.38, tu));
      look.set(0.02, 1.08, -2.42);
      macroSpot.target.position.set(0.0, 1.05, -2.42);
    } else {
      // Macro Grinding Molar Tooth spotlight!
      const mu = ease((u - 0.56) / 0.44);
      caveSkull.visible = false;
      if (actors.molar) {
        actors.molar.visible = true;
        actors.molar.rotation.set(0.2, mu * 2.4, 0.08);
      }
      pos.set(lerp(-0.22, 0.18, mu), lerp(1.15, 1.06, mu), lerp(-1.55, -1.78, mu));
      look.set(0, 0.96, -2.15);
      macroSpot.target.position.set(0, 0.96, -2.15);
    }
  }
  // ---------------- BEAT 4: IT ATE PLANTS -> THE OPPOSITE (34.67 - 45.93s)
  else if (t < 45.93) {
    const u = (t - 34.67) / (45.93 - 34.67);
    actors.bear.visible = true;
    if (u < 0.72) {
      // Peaceful grazing outside in golden sunlit Ice Age meadow grass
      const gu = ease(u / 0.72);
      moonDir.color.setHex(0xffdfa8);
      moonDir.intensity = 3.2;
      hemiLight.intensity = 0.75;
      actors.bear.position.set(-0.8, 0, 12.2);
      actors.bear.rotation.set(0.22 + Math.sin(t * 3.0) * 0.05, 0.65, 0);
      pos.set(lerp(1.4, 0.5, gu), lerp(1.1, 0.85, gu), lerp(15.2, 14.3, gu));
      look.set(-0.7, 0.62, 12.2);
      camera.fov = 38;
    } else {
      // SNAP CUT ("THE OPPOSITE."): menacing close-up inside pitch-dark cave!
      const cu = ease((u - 0.72) / 0.28);
      moonDir.color.setHex(0x88b4eb);
      moonDir.intensity = 2.2;
      hemiLight.intensity = 0.38;
      breathPts.visible = true;
      actors.bear.position.set(0, 0, 1.5);
      actors.bear.rotation.set(0.08, Math.PI, 0);
      pos.set(lerp(0.18, -0.05, cu), lerp(1.12, 1.18, cu), lerp(-0.85, -0.52, cu));
      look.set(0, 1.06, 0.8);
      camera.fov = 34;
    }
  }
  // ---------------- BEAT 5: PREDATOR CALCULATION - WOLF VS BEAR (45.93 - 58.19s)
  else if (t < 58.19) {
    const u = (t - 45.93) / (58.19 - 45.93);
    moonDir.color.setHex(0x88b4eb);
    moonDir.intensity = 2.6;
    hemiLight.intensity = 0.52;
    if (u < 0.52) {
      // Animated Wolf stalking & calculating risk in falling snow, then backing off!
      const wu = u / 0.52;
      actors.wolf.visible = true;
      if (wu < 0.45) {
        setActionAtTime(actors.wolfMixer, actors.wolfClips, /walk/i, t * 1.15);
        actors.wolf.position.set(0.4, 0, lerp(16.8, 13.0, wu / 0.45));
        actors.wolf.rotation.y = Math.PI;
      } else if (wu < 0.72) {
        setActionAtTime(actors.wolfMixer, actors.wolfClips, /idle/i, t);
        actors.wolf.position.set(0.4, 0, 13.0);
        actors.wolf.rotation.y = Math.PI + Math.sin((wu - 0.45) * 8) * 0.18;
      } else {
        setActionAtTime(actors.wolfMixer, actors.wolfClips, /walk|run/i, t * 1.4);
        const ru = (wu - 0.72) / 0.28;
        actors.wolf.position.set(lerp(0.4, 3.2, ru), 0, lerp(13.0, 17.5, ru));
        actors.wolf.rotation.y = 0.55;
      }
      pos.set(-1.6, 1.05, lerp(16.2, 14.5, wu));
      look.copy(actors.wolf.position).add(new THREE.Vector3(0, 0.55, 0));
    } else {
      // Inside: Cave Bear immovable in its bedroom beside the roaring hearth!
      const bu = ease((u - 0.52) / 0.48);
      actors.bear.visible = true;
      breathPts.visible = true;
      actors.bear.position.set(0.25, Math.sin(t * 2.0) * 0.015, 0.65);
      actors.bear.rotation.set(0, Math.PI + 0.22, 0);
      pos.set(lerp(-1.45, -1.05, bu), lerp(1.08, 1.32, bu), lerp(-2.1, -1.3, bu));
      look.set(0.25, 1.08, 0.45);
    }
  }
  // ---------------- BEAT 6: SAME ADDRESS - HUNTER TORCH & ONE DOOR (58.19 - 72.15s)
  else if (t < 72.15) {
    const u = (t - 58.19) / (72.15 - 58.19);
    actors.hunter.visible = true;
    actors.bear.visible = true;
    breathPts.visible = true;
    if (u < 0.52) {
      // Hunter creeps down wet limestone tunnel holding flickering torch & spear!
      const hu = u / 0.52;
      setActionAtTime(actors.hunterMixer, actors.hunterClips, /walk/i, t * 0.95);
      actors.hunter.position.set(-0.35, 0, lerp(3.4, 0.35, hu));
      actors.hunter.rotation.y = Math.PI;
      actors.bear.position.set(0.15, 0, -4.8);
      actors.bear.rotation.y = 0.1;
      pos.set(-1.55 + Math.sin(t * 2.6) * 0.04, 1.38 + Math.cos(t * 3.1) * 0.03, lerp(2.6, -0.5, hu));
      look.set(-0.25, 1.25, lerp(1.8, -0.2, hu));
    } else {
      // POV behind hunter's flickering torch: Bear blocks the ONLY sunlit/moonlit cave doorway!
      const bu = ease((u - 0.52) / 0.48);
      setActionAtTime(actors.hunterMixer, actors.hunterClips, /idle/i, t);
      actors.hunter.position.set(-0.55, 0, 0.65);
      actors.hunter.rotation.y = 0.15;
      const bz = lerp(6.2, 4.35, bu);
      actors.bear.position.set(0.05, Math.abs(Math.sin(t * 4.5)) * 0.04, bz);
      actors.bear.rotation.y = Math.PI;
      pos.set(-0.15, lerp(1.22, 1.12, bu), lerp(-0.45, 0.35, bu));
      look.set(0.0, 1.28, bz);
      godRayMat.uniforms.uOpacity.value = 0.28;
    }
  }
  // ---------------- BEAT 7: HOHLE FELS FLINT & CHAUVET RED BEARS (72.15 - 86.43s)
  else if (t < 86.43) {
    const u = (t - 72.15) / (86.43 - 72.15);
    if (u < 0.52) {
      // Static slow macro push-in onto Flint Spear Point embedded in Cave Bear Vertebra!
      const fu = ease(u / 0.52);
      hohleGroup.visible = true;
      macroSpot.intensity = 4.6;
      macroSpot.position.set(1.4, 2.0, -2.5);
      macroSpot.target.position.set(2.15, 0.76, -3.7);
      pos.set(lerp(1.42, 1.72, fu), lerp(1.08, 0.94, fu), lerp(-2.75, -3.12, fu));
      look.set(2.15, 0.78, -3.7);
    } else {
      // Smooth lateral torchlight pan across the Chauvet Red-Ochre Cave Bear wall mural!
      const mu = ease((u - 0.52) / 0.48);
      pos.set(0.65, 1.78, lerp(-3.1, -6.9, mu));
      look.set(3.45, 1.85, lerp(-3.8, -6.5, mu));
      fireLight.position.set(1.6, 1.65, lerp(-3.2, -6.6, mu));
      fireLight.intensity = 7.5;
    }
  }
  // ---------------- BEAT 8: THE ROOM — NOT A BEAR'S ANYMORE (86.43 - 100.50s)
  else {
    const u = (t - 86.43) / (100.50 - 86.43);
    fireLight.position.set(-1.75, 0.85, -1.05);
    actors.hunter.visible = u < 0.62;
    if (actors.hunter.visible) {
      setActionAtTime(actors.hunterMixer, actors.hunterClips, /idle/i, t);
      actors.hunter.position.set(-1.15, 0, -2.25);
      actors.hunter.rotation.y = Math.PI * 0.42;
    }
    if (u < 0.55) {
      const pu = ease(u / 0.55);
      pos.set(lerp(0.95, 1.45, pu), lerp(1.42, 1.65, pu), lerp(-1.15, 0.35, pu));
      look.set(-0.25, 1.05, -2.45);
    } else {
      // Final chilling rim-lit skull alone on the rock in the dark!
      const fu = ease((u - 0.55) / 0.45);
      rimLight.position.set(1.8, 2.4, -4.5);
      rimLight.intensity = lerp(5.5, 8.5, fu);
      rimLight.target.position.set(0, 1.05, -2.5);
      pos.set(lerp(0.65, 0.22, fu), lerp(1.38, 1.24, fu), lerp(-0.95, -1.42, fu));
      look.set(0, 1.04, -2.5);
    }
  }

  camera.position.copy(pos);
  camera.lookAt(look);
  camera.updateProjectionMatrix();
  composer.render();
  drawCinemaHUD(t);
}

// ------------------------------------------------------------------ EXPORT FOR RENDERER
await initAssets();
window.__PANAMA_READY__ = true;
window.__RENDER_FRAME__ = (frameIdx) => {
  const t = frameIdx / TIMELINE.fps;
  renderFrameAt(t);
  return true;
};

// Preview frame 0 when opened manually in browser
renderFrameAt(1.5);
</script>
