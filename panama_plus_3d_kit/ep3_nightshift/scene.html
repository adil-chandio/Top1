<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MONARCH Night Shift EP01 — The Sandwich Heist</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #040710;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #flashOverlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 8;
      background: #ffffff; opacity: 0;
    }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 84px 50px 210px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(6, 9, 16, 0.80);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      padding: 12px 24px; border-radius: 999px;
      font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .pill.amber { border-color: rgba(245, 158, 11, 0.65); color: #fbbf24; }
    .captions-wrap {
      align-self: center; text-align: center; max-width: 930px;
      padding: 18px 28px; border-radius: 18px;
      background: rgba(6, 9, 16, 0.82);
      border: 1px solid rgba(245, 158, 11, 0.30);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.72);
    }
    .captions-text {
      color: #ffffff; font-size: 40px; font-weight: 900; line-height: 1.24;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.95);
    }
    .captions-text .hi { color: #fbbf24; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="flashOverlay"></div>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">NIGHT SHIFT · EP01</div>
      <div class="pill amber" id="beatTag">03:00 AM · THE TARGET</div>
    </div>
    <div class="captions-wrap" id="captionWrap">
      <div class="captions-text" id="captionsText"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const W = 1080, H = 1920;
    const canvas = document.getElementById('stage');
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = false;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050914);
    scene.fog = new THREE.FogExp2(0x060b17, 0.024);

    const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.30, 0.45, 0.82);
    composer.addPass(bloomPass);

    const NightCinemaShader = {
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0.0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec2 vUv;
        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        void main() {
          vec2 d = vUv - 0.5;
          float r2 = dot(d, d);
          vec2 shift = d * r2 * 0.0020;
          float r = texture2D(tDiffuse, vUv + shift).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - shift).b;
          vec3 col = vec3(r, g, b);
          float lum = dot(col, vec3(0.299, 0.587, 0.114));
          col += mix(vec3(-0.006, 0.004, 0.022), vec3(0.026, 0.012, -0.012), smoothstep(0.10, 0.72, lum));
          float vig = smoothstep(0.96, 0.24, r2 * 1.38);
          col *= mix(0.36, 1.0, vig);
          float grain = (hash12(vUv * vec2(1080.0, 1920.0) + uTime * 31.0) - 0.5) * 0.018;
          gl_FragColor = vec4(clamp(col + grain, 0.0, 1.0), 1.0);
        }
      `,
    };
    const gradePass = new ShaderPass(NightCinemaShader);
    composer.addPass(gradePass);
    composer.addPass(new OutputPass());

    // Moonlit Suburban Sky + Moon Sphere + Starfield
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(2.8, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xfff8e7 })
    );
    moon.position.set(-14, 24, -48);
    scene.add(moon);

    const starCount = 450;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      starPos[i * 3] = Math.sin(i * 41.3) * 65;
      starPos[i * 3 + 1] = 10 + ((i % 35) / 35) * 35;
      starPos[i * 3 + 2] = -25 - ((i % 20) * 2.5);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.16, transparent: true, opacity: 0.78 })));

    // Lighting: Cool Moonlight + Warm Sodium Streetlights + Truck Dome Light
    scene.add(new THREE.HemisphereLight(0x64748b, 0x0f172a, 1.25));
    const moonLight = new THREE.DirectionalLight(0xbae6fd, 2.2);
    moonLight.position.set(-10, 18, -12);
    scene.add(moonLight);

    const streetGlowA = new THREE.PointLight(0xf59e0b, 18, 22);
    streetGlowA.position.set(-4.2, 5.2, 3.8);
    const streetGlowB = new THREE.PointLight(0xf59e0b, 15, 22);
    streetGlowB.position.set(5.5, 5.2, -7.5);
    const truckDomeLight = new THREE.PointLight(0xfef08a, 10, 9);
    truckDomeLight.position.set(0, 2.4, 0.2);
    scene.add(streetGlowA, streetGlowB, truckDomeLight);

    // Asphalt Driveway + Suburban Lawn
    function makeAsphaltTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#181c24'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 4200; i++) {
        g.fillStyle = i % 2 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.16)';
        g.fillRect((i * 73) % 512, (i * 139) % 512, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 12);
      return tex;
    }

    const lawn = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 90),
      new THREE.MeshStandardMaterial({ color: 0x0f2418, roughness: 0.92 })
    );
    lawn.rotation.x = -Math.PI / 2;
    scene.add(lawn);

    const driveway = new THREE.Mesh(
      new THREE.PlaneGeometry(7.2, 40),
      new THREE.MeshStandardMaterial({ map: makeAsphaltTex(), roughness: 0.58, metalness: 0.15 })
    );
    driveway.rotation.x = -Math.PI / 2;
    driveway.position.y = 0.02;
    scene.add(driveway);

    // Load Real CC0 Assets (Realistic Bear + Rigged Human + Pickup Truck + House + Trees + Streetlight)
    const loader = new GLTFLoader();
    const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));
    const TIMELINE = await (await fetch('./timeline.json')).json();

    function fitBottom(gltfScene, targetMax) {
      const root = new THREE.Group();
      const inner = SkeletonUtils.clone(gltfScene);
      const box = new THREE.Box3().setFromObject(inner);
      const sz = new THREE.Vector3(), ct = new THREE.Vector3();
      box.getSize(sz); box.getCenter(ct);
      const s = targetMax / Math.max(sz.x, sz.y, sz.z, 0.001);
      inner.scale.setScalar(s);
      inner.position.set(-ct.x * s, -box.min.y * s, -ct.z * s);
      root.add(inner);
      return { root, inner };
    }

    const [bearGltf, humanGltf, truckGltf, houseGltf, pineGltf, lampGltf] = await Promise.all([
      loadGLTF('/assets/bear.glb'),
      loadGLTF('/assets/casual_hoodie.glb'),
      loadGLTF('/assets/pickup.glb'),
      loadGLTF('/assets/house.glb'),
      loadGLTF('/assets/pine_tree.glb'),
      loadGLTF('/assets/streetlight.glb'),
    ]);

    // Suburban House & Yard Props
    const { root: house } = fitBottom(houseGltf.scene, 11.5);
    house.position.set(0, 0, -13.5);
    scene.add(house);

    for (const [px, pz, sc] of [[-7.5, -5.0, 6.2], [7.8, -6.2, 6.8], [-9.2, 4.5, 5.5], [8.5, 3.8, 6.0]]) {
      const { root: p } = fitBottom(pineGltf.scene, sc);
      p.position.set(px, 0, pz);
      scene.add(p);
    }

    const { root: lampA } = fitBottom(lampGltf.scene, 6.0);
    lampA.position.set(-4.3, 0, 3.8);
    lampA.rotation.y = Math.PI * 0.45;
    const { root: lampB } = fitBottom(lampGltf.scene, 6.0);
    lampB.position.set(5.4, 0, -7.2);
    lampB.rotation.y = -Math.PI * 0.45;
    scene.add(lampA, lampB);

    // Pickup Truck parked on the driveway
    const { root: truck } = fitBottom(truckGltf.scene, 5.2);
    truck.position.set(0, 0.02, 0);
    truck.rotation.y = 0.08;
    scene.add(truck);

    // Hero Snack Trio (3D Club Sandwich + Chips Bag + Chocolate Chip Cookie!) — NO giant paw sphere!
    const snackGroup = new THREE.Group();
    const breadMat = new THREE.MeshStandardMaterial({ color: 0xe6b87d, roughness: 0.72 });
    const lettuceMat = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.60 });
    const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.50 });
    const pattyMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.78 });
    const sw = new THREE.Group();
    sw.add(
      new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.08, 0.46), breadMat),
      Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 0.48), lettuceMat), { position: new THREE.Vector3(0, 0.06, 0) }),
      Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.07, 0.45), pattyMat), { position: new THREE.Vector3(0, 0.11, 0) }),
      Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.47, 0.03, 0.47), cheeseMat), { position: new THREE.Vector3(0, 0.16, 0) }),
      Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.08, 0.46), breadMat), { position: new THREE.Vector3(0, 0.21, 0) })
    );
    const chipsBag = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.44, 0.12),
      new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.35, metalness: 0.25 })
    );
    chipsBag.position.set(-0.55, 0.22, -0.05);
    chipsBag.rotation.z = 0.18;
    const cookie = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.18, 0.05, 24),
      new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.78 })
    );
    cookie.position.set(0.50, 0.04, 0.12);
    snackGroup.add(sw, chipsBag, cookie);
    snackGroup.position.set(0.0, 1.38, 1.8);
    scene.add(snackGroup);

    // Hero Bear (Realistic CC0 bear.glb — consistent across EVERY shot, zero cartoon swap!)
    const { root: bear, inner: bearInner } = fitBottom(bearGltf.scene, 2.35);
    let bearMixer = null;
    if (bearGltf.animations && bearGltf.animations.length > 0) {
      bearMixer = new THREE.AnimationMixer(bearInner);
      bearMixer.clipAction(bearGltf.animations[0]).play();
    }
    scene.add(bear);

    // Homeowner Human (Rigged casual_hoodie.glb with real Idle/Walk/Interact animations + Phone & Wood Plank!)
    const { root: human, inner: humanInner } = fitBottom(humanGltf.scene, 1.88);
    const humanMixer = new THREE.AnimationMixer(humanInner);
    const hIdle = humanMixer.clipAction(THREE.AnimationClip.findByName(humanGltf.animations, 'Idle') || humanGltf.animations[0]);
    const hWalk = humanMixer.clipAction(THREE.AnimationClip.findByName(humanGltf.animations, 'Walk') || humanGltf.animations[0]);
    const hInteract = humanMixer.clipAction(THREE.AnimationClip.findByName(humanGltf.animations, 'Interact') || humanGltf.animations[0]);
    hIdle.play();

    // Attach Phone + Wood Plank cleanly to human's Right Hand bone so zero truck clipping!
    let rHand = null;
    humanInner.traverse((o) => {
      if (o.isBone && (o.name === 'Wrist.R' || o.name === 'Hand.R' || o.name === 'LowerArm.R')) rHand = o;
    });
    const phoneProp = new THREE.Mesh(
      new THREE.BoxGeometry(0.10, 0.18, 0.02),
      new THREE.MeshStandardMaterial({ color: 0x0f172a, emissive: 0x38bdf8, emissiveIntensity: 0.9 })
    );
    const plankProp = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 1.15, 0.06),
      new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.85 })
    );
    if (rHand) {
      phoneProp.position.set(0, 0.12, 0.04);
      plankProp.position.set(0, 0.45, 0.08);
      rHand.add(phoneProp, plankProp);
    }
    scene.add(human);

    function setHumanPose(mode, t) {
      hIdle.enabled = mode === 'idle';
      hWalk.enabled = mode === 'walk';
      hInteract.enabled = mode === 'interact';
      hIdle.setEffectiveWeight(mode === 'idle' ? 1 : 0);
      hWalk.setEffectiveWeight(mode === 'walk' ? 1 : 0);
      hInteract.setEffectiveWeight(mode === 'interact' ? 1 : 0);
      humanMixer.setTime(t);
    }

    function formatCaption(text, tLocal, dur) {
      const words = text.split(' ');
      const progress = Math.min(1, Math.max(0, tLocal / Math.max(dur * 0.90, 0.2)));
      const activeIdx = Math.min(words.length - 1, Math.floor(progress * words.length));
      const winStart = Math.max(0, Math.floor(activeIdx / 6) * 6);
      return words.slice(winStart, winStart + 6).map((w, i) => (winStart + i <= activeIdx ? `<span class="hi">${w}</span>` : w)).join(' ');
    }

    const flashEl = document.getElementById('flashOverlay');

    window.__MONARCH_FRAME__ = (f) => {
      const fps = TIMELINE.fps || 30;
      const t = f / fps;
      gradePass.uniforms.uTime.value = t;
      if (bearMixer) bearMixer.setTime(t % 2.4);

      const beats = TIMELINE.beats;
      let b = beats[0];
      for (let i = 0; i < beats.length; i++) {
        if (t >= beats[i].start && t < beats[i].end) { b = beats[i]; break; }
        if (t >= beats[beats.length - 1].start) b = beats[beats.length - 1];
      }
      const u = Math.min(1, Math.max(0, t - b.start) / Math.max(0.5, b.end - b.start));

      document.getElementById('beatTag').textContent = b.tag;
      document.getElementById('captionsText').innerHTML = formatCaption(b.text, Math.max(0, t - b.start), Math.max(0.5, b.voice_end - b.start));

      flashEl.style.opacity = '0';
      phoneProp.visible = false;
      plankProp.visible = false;

      if (b.id === 'prize_ecu') {
        // Beat 1: Hero ECU on realistic 3D Sandwich, Chips & Cookie inside warm glow!
        snackGroup.visible = true;
        snackGroup.position.set(0, 1.38 + Math.sin(t * 2.5) * 0.03, 1.8);
        snackGroup.rotation.y = Math.sin(t * 0.7) * 0.28;
        bear.position.set(-1.3, 0.02, 2.2);
        bear.rotation.y = 0.75;
        human.visible = false;
        camera.position.set(0.35 - u * 0.55, 1.82, 3.65 - u * 0.35);
        camera.lookAt(0, 1.50, 1.8);
      } else if (b.id === 'driveway_entry') {
        // Beat 2: Bear prowls down the moonlit driveway to the pickup truck door
        snackGroup.visible = false;
        human.visible = false;
        bear.position.set(1.65 - u * 0.45, 0.02, 5.2 - u * 4.5);
        bear.rotation.y = Math.PI * 0.95;
        bear.position.y = 0.02 + Math.abs(Math.sin(t * 6.0)) * 0.06;
        camera.position.set(3.8 - u * 1.1, 1.85, 6.2 - u * 3.8);
        camera.lookAt(0.5, 1.05, 0.4);
      } else if (b.id === 'jackpot_freeze') {
        // Beat 3: Bear dining inside cab / side of truck; Homeowner steps onto porch & freezes!
        snackGroup.visible = true;
        snackGroup.position.set(0.85, 1.20, 0.4);
        bear.position.set(1.35, 0.02, 0.5);
        bear.rotation.y = -0.9;
        human.visible = true;
        human.position.set(-1.9, 0.02, -4.5 + u * 3.8);
        human.rotation.y = 0.35;
        setHumanPose(u < 0.55 ? 'walk' : 'idle', t);
        camera.position.set(-3.2 + u * 0.6, 1.78, 4.2);
        camera.lookAt(0.1, 1.25, -0.3);
      } else if (b.id === 'flash_plank') {
        // Beat 4: Homeowner snaps a bright flash photo, then swings a wood plank (zero truck clipping!)
        snackGroup.visible = true;
        snackGroup.position.set(0.85, 1.20, 0.4);
        bear.position.set(1.45, 0.02, 0.5);
        bear.rotation.y = -0.8;
        human.visible = true;
        human.position.set(-2.35, 0.02, 0.6);
        human.rotation.y = Math.PI * 0.48;
        phoneProp.visible = u < 0.52;
        plankProp.visible = u >= 0.52;
        setHumanPose('interact', t);
        if (u > 0.16 && u < 0.25) flashEl.style.opacity = String(Math.sin(((u - 0.16) / 0.09) * Math.PI) * 0.88);
        camera.position.set(-0.6, 1.65, 5.2 - u * 0.6);
        camera.lookAt(-0.4, 1.25, 0.5);
      } else if (b.id === 'dignity_exit') {
        // Beat 5: Bear casually backs out the driver's side with full dignity!
        snackGroup.visible = false;
        human.visible = true;
        human.position.set(-2.45, 0.02, 0.6);
        human.rotation.y = Math.PI * 0.48;
        plankProp.visible = true;
        setHumanPose('idle', t);
        bear.position.set(1.4 + u * 1.4, 0.02 + Math.abs(Math.sin(t * 5.2)) * 0.05, 0.8 + u * 4.2);
        bear.rotation.y = 0.25;
        camera.position.set(3.2, 1.70, 7.6 - u * 1.0);
        camera.lookAt(bear.position.x, 1.0, bear.position.z);
      } else if (b.id === 'worth_it') {
        // Beat 6: Hero close-up on the bear winking/nodding under warm sodium streetlight!
        snackGroup.visible = false;
        human.visible = false;
        bear.position.set(-1.6, 0.02, 4.8);
        bear.rotation.y = 0.55;
        camera.position.set(0.4, 1.55, 7.4 - u * 0.7);
        camera.lookAt(-1.4, 1.05, 4.8);
      } else {
        // Beat 7: Cinematic Suburban Night Crane-Out past house, trees & moon!
        snackGroup.visible = false;
        human.visible = false;
        bear.position.set(-1.6, 0.02, 5.2 + u * 1.4);
        bear.rotation.y = 0.2;
        camera.position.set(0.0, 2.2 + u * 7.5, 9.5 + u * 6.5);
        camera.lookAt(0, 1.8 + u * 1.5, -2.0);
      }

      composer.render();
    };

    window.__MONARCH_READY__ = true;
  </script>
</body>
</html>
