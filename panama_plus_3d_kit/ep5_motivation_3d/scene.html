<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MONARCH® Cinema 3D V3 — Main Abhi Bhi Apni Taraf Hoon (Tabahi Edition)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #070a12;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 78px 48px 190px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(10, 13, 20, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      padding: 11px 22px; border-radius: 999px;
      font-size: 18px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.50);
    }
    .pill.crimson { border-color: rgba(239, 68, 68, 0.65); color: #fca5a5; }
    .pill.amber { border-color: rgba(245, 158, 11, 0.75); color: #fde68a; }
    .bottom-stack { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .cta-banner {
      align-self: center; text-align: center;
      opacity: 0; transform: translateY(12px);
      background: rgba(12, 9, 14, 0.86);
      border: 1px solid rgba(245, 158, 11, 0.58);
      padding: 12px 26px; border-radius: 14px;
      color: #f8fafc; font-size: 24px; font-weight: 900; letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
    }
    .cta-banner.visible { opacity: 1; transform: translateY(0); }
    .cta-banner span { color: #fbbf24; }
    .captions-wrap {
      align-self: center; text-align: center; max-width: 940px;
      padding: 16px 28px; border-radius: 18px;
      background: rgba(7, 10, 17, 0.80);
      border: 1px solid rgba(245, 158, 11, 0.36);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.70);
    }
    .captions-text {
      color: #f8fafc; font-size: 42px; font-weight: 900; line-height: 1.24;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.96);
    }
    .captions-text .hi { color: #fbbf24; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">MONARCH® 3D</div>
      <div class="pill crimson" id="beatTag">HAAR NAHI</div>
    </div>
    <div class="bottom-stack">
      <div class="cta-banner" id="ctaBanner">MAIN ABHI BHI <span>APNI TARAF HOON</span></div>
      <div class="captions-wrap" id="captionWrap">
        <div class="captions-text" id="captionsText"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const W = 1080, H = 1920;
    const canvas = document.getElementById('stage');
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b101b);
    scene.fog = new THREE.FogExp2(0x0b101b, 0.026);

    // PMREM IBL Environment Reflections — removes flat plastic look on metal/glass/skin
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;
    scene.environmentIntensity = 0.56;

    const camera = new THREE.PerspectiveCamera(42, W / H, 0.08, 120);

    // ---------------------------------------------------------------- POST-PROCESSING CINEMA PIPELINE
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.26, 0.46, 0.88);
    composer.addPass(bloomPass);

    const CinemaGradeShader = {
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0.0 }, uWarmth: { value: 0.0 }, uFlash: { value: 0.0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uWarmth;
        uniform float uFlash;
        varying vec2 vUv;
        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        void main() {
          vec2 d = vUv - 0.5;
          float r2 = dot(d, d);
          vec2 shift = d * r2 * 0.0018;
          float r = texture2D(tDiffuse, vUv + shift).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - shift).b;
          vec3 col = vec3(r, g, b);
          // Lifted film blacks (~3.2%) + warm highlight / cool shadow split
          float lum = dot(col, vec3(0.299, 0.587, 0.114));
          vec3 coolSh = vec3(0.012, 0.016, 0.032);
          vec3 warmHi = mix(vec3(0.020, 0.008, -0.004), vec3(0.032, 0.016, -0.010), uWarmth);
          col = col * 0.98 + mix(coolSh, warmHi, smoothstep(0.08, 0.72, lum));
          col += vec3(1.0, 0.95, 0.88) * uFlash;
          float vig = smoothstep(1.02, 0.28, r2 * 1.32);
          col *= mix(0.42, 1.0, vig);
          float grain = (hash12(vUv * vec2(1080.0, 1920.0) + uTime * 29.0) - 0.5) * 0.018;
          gl_FragColor = vec4(clamp(col + grain, 0.0, 1.0), 1.0);
        }
      `,
    };
    const gradePass = new ShaderPass(CinemaGradeShader);
    composer.addPass(gradePass);
    composer.addPass(new OutputPass());

    // ---------------------------------------------------------------- PROCEDURAL HIGH-RES TEXTURES
    function makeTurtleneckKnitTex() {
      const c = document.createElement('canvas'); c.width = 256; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#0d1018'; g.fillRect(0, 0, 256, 256);
      for (let x = 0; x < 256; x += 6) {
        g.fillStyle = x % 12 === 0 ? '#1b202c' : '#090b10';
        g.fillRect(x, 0, 3, 256);
      }
      for (let y = 0; y < 256; y += 8) {
        g.fillStyle = 'rgba(255,255,255,0.03)';
        g.fillRect(0, y, 256, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      return tex;
    }

    function makeFaceSkinBeardTex() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 1024;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0.0, '#bb8865');
      grad.addColorStop(0.55, '#c99572');
      grad.addColorStop(1.0, '#a37152');
      g.fillStyle = grad;
      g.fillRect(0, 0, 1024, 1024);

      // Subtle cheekbone contour & under-eye shadow
      g.fillStyle = 'rgba(85, 52, 34, 0.18)';
      g.beginPath(); g.ellipse(396, 510, 56, 84, 0.2, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(628, 510, 56, 84, -0.2, 0, Math.PI * 2); g.fill();

      // Groomed Short Beard & Jawline Stubble
      const beardGrad = g.createRadialGradient(512, 730, 50, 512, 730, 260);
      beardGrad.addColorStop(0.0, 'rgba(18, 16, 18, 0.94)');
      beardGrad.addColorStop(0.68, 'rgba(22, 19, 20, 0.86)');
      beardGrad.addColorStop(1.0, 'rgba(22, 19, 20, 0.0)');
      g.fillStyle = beardGrad;
      g.beginPath();
      g.moveTo(310, 580);
      g.quadraticCurveTo(350, 870, 512, 910);
      g.quadraticCurveTo(674, 870, 714, 580);
      g.quadraticCurveTo(640, 680, 512, 672);
      g.quadraticCurveTo(384, 680, 310, 580);
      g.fill();

      // Mustache & Soul Patch
      g.fillStyle = 'rgba(14, 13, 16, 0.95)';
      g.beginPath();
      g.moveTo(428, 664);
      g.quadraticCurveTo(512, 628, 596, 664);
      g.quadraticCurveTo(556, 696, 512, 684);
      g.quadraticCurveTo(468, 696, 428, 664);
      g.fill();

      g.fillStyle = '#925a4c';
      g.beginPath(); g.ellipse(512, 700, 44, 15, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(14, 13, 16, 0.92)';
      g.beginPath(); g.ellipse(512, 744, 22, 26, 0, 0, Math.PI * 2); g.fill();

      for (let i = 0; i < 2400; i++) {
        const rx = 330 + ((Math.sin(i * 17.3) * 999) % 1 + 1) % 1 * 364;
        const ry = 580 + ((Math.cos(i * 31.7) * 999) % 1 + 1) % 1 * 290;
        g.fillStyle = 'rgba(12,11,14,0.34)';
        g.fillRect(rx, ry, 2.5, 3.5);
      }

      // Eyebrows
      g.fillStyle = '#121114';
      g.beginPath(); g.ellipse(432, 412, 52, 11, -0.08, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(592, 412, 52, 11, 0.08, 0, Math.PI * 2); g.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeVenetianFiligreeMaskTextures() {
      const c = document.createElement('canvas'); c.width = 1024; c.height = 512;
      const a = document.createElement('canvas'); a.width = 1024; a.height = 512;
      const gc = c.getContext('2d'), ga = a.getContext('2d');
      gc.fillStyle = '#12141c'; gc.fillRect(0, 0, 1024, 512);
      ga.fillStyle = '#000000'; ga.fillRect(0, 0, 1024, 512);

      const drawHalf = (ctx, color, isAlpha) => {
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(512, 68); ctx.quadraticCurveTo(468, 140, 512, 236);
        ctx.quadraticCurveTo(512, 304, 480, 348);
        ctx.stroke();

        ctx.lineWidth = 16;
        ctx.beginPath();
        ctx.moveTo(512, 128);
        ctx.bezierCurveTo(430, 104, 290, 116, 184, 184);
        ctx.bezierCurveTo(128, 224, 148, 308, 236, 348);
        ctx.bezierCurveTo(330, 390, 448, 360, 492, 304);
        ctx.stroke();

        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.ellipse(348, 244, 96, 50, -0.06, 0, Math.PI * 2);
        ctx.stroke();

        ctx.lineWidth = 10;
        const curls = [
          [464, 120, 412, 72, 372, 112],
          [380, 124, 320, 76, 268, 132],
          [270, 152, 196, 124, 164, 196],
          [196, 296, 172, 364, 232, 388],
          [296, 360, 288, 424, 352, 408],
          [404, 352, 424, 408, 476, 384],
        ];
        for (const [x1, y1, cx, cy, x2, y2] of curls) {
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
          ctx.beginPath(); ctx.arc(x2, y2, 12, 0, Math.PI * 2); ctx.fill();
        }
        if (!isAlpha) {
          ctx.fillStyle = '#f1f5f9';
          for (const [gx, gy] of [[512, 216], [440, 124], [296, 144], [204, 224]]) {
            ctx.beginPath(); ctx.arc(gx, gy, 7, 0, Math.PI * 2); ctx.fill();
          }
        }
      };

      drawHalf(gc, '#1a1d28', false);
      drawHalf(ga, '#ffffff', true);
      gc.save(); gc.translate(1024, 0); gc.scale(-1, 1); drawHalf(gc, '#1a1d28', false); gc.restore();
      ga.save(); ga.translate(1024, 0); ga.scale(-1, 1); drawHalf(ga, '#ffffff', true); ga.restore();

      ga.fillStyle = '#000000';
      ga.beginPath(); ga.ellipse(348, 244, 82, 38, -0.06, 0, Math.PI * 2); ga.fill();
      ga.beginPath(); ga.ellipse(676, 244, 82, 38, 0.06, 0, Math.PI * 2); ga.fill();

      const colTex = new THREE.CanvasTexture(c); colTex.colorSpace = THREE.SRGBColorSpace;
      const alphaTex = new THREE.CanvasTexture(a);
      return { colTex, alphaTex };
    }

    function makeAsphaltTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#121824'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 2400; i++) {
        const x = ((Math.sin(i * 19.3) * 9187) % 1 + 1) % 1 * 512;
        const y = ((Math.cos(i * 41.7) * 6311) % 1 + 1) % 1 * 512;
        g.fillStyle = i % 2 === 0 ? 'rgba(48,62,88,0.28)' : 'rgba(8,12,18,0.34)';
        g.fillRect(x, y, 4 + (i % 12), 4 + (i % 8));
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 8);
      return tex;
    }

    function makeTenMinCanvasTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#c4a87e'; g.fillRect(0, 0, 512, 256);
      // Subtle ruled notebook lines
      g.strokeStyle = 'rgba(92, 64, 38, 0.22)'; g.lineWidth = 2;
      for (let y = 36; y < 240; y += 28) {
        g.beginPath(); g.moveTo(24, y); g.lineTo(488, y); g.stroke();
      }
      // Bold gold-amber underline arc + high-contrast 10:00 ink
      g.strokeStyle = '#92400e'; g.lineWidth = 10; g.lineCap = 'round';
      g.beginPath(); g.moveTo(56, 186); g.quadraticCurveTo(256, 154, 456, 186); g.stroke();
      g.fillStyle = '#1e1b18'; g.font = '900 106px Inter, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('10:00', 256, 108);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeSlabTex(line, accent = '#ef4444') {
      const c = document.createElement('canvas'); c.width = 512; c.height = 192;
      const g = c.getContext('2d');
      g.fillStyle = '#111622'; g.fillRect(0, 0, 512, 192);
      g.strokeStyle = accent; g.lineWidth = 8; g.strokeRect(8, 8, 496, 176);
      g.fillStyle = '#f8fafc'; g.font = '900 38px Inter, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(line, 256, 96);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const knitTex = makeTurtleneckKnitTex();
    const faceTex = makeFaceSkinBeardTex();
    const maskTexs = makeVenetianFiligreeMaskTextures();
    const asphaltTex = makeAsphaltTex();
    const tenMinTex = makeTenMinCanvasTex();

    // ---------------------------------------------------------------- CINEMA LIGHTING RIG (KEY + FILL + DEDICATED RIM)
    const hemi = new THREE.HemisphereLight(0x93c5fd, 0x101624, 0.85);
    scene.add(hemi);

    const keyLight = new THREE.SpotLight(0xffdfb0, 16, 26, Math.PI * 0.34, 0.55, 1.15);
    keyLight.position.set(1.8, 4.2, 3.6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x60a5fa, 2.8);
    rimLight.position.set(-3.2, 3.6, -4.0);
    scene.add(rimLight);

    const crimsonRimLight = new THREE.PointLight(0xff3838, 0.0, 9.0);
    crimsonRimLight.position.set(0, 1.65, -0.8);
    scene.add(crimsonRimLight);

    // ---------------------------------------------------------------- LOAD TIMELINE + VERIFIED CC0 ASSETS
    const loader = new GLTFLoader();
    const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

    let TIMELINE;
    try {
      TIMELINE = await (await fetch('./timeline_synced.json')).json();
    } catch {
      TIMELINE = await (await fetch('./timeline.json')).json();
    }

    const [humanGltf, streetLightGltf, lampGltf, chairGltf, booksGltf] = await Promise.all([
      loadGLTF('/assets/suit.glb'),
      loadGLTF('/assets/streetlight.glb'),
      loadGLTF('/assets/lamp_table.glb'),
      loadGLTF('/assets/armchair_pillows.glb'),
      loadGLTF('/assets/book_set.glb'),
    ]);

    // ---------------------------------------------------------------- BUILD CLEANED & SMOOTHED MASKED MONARCH HERO
    function buildMonarchHero(gltf) {
      const root = new THREE.Group();
      const inner = SkeletonUtils.clone(gltf.scene);
      const box = new THREE.Box3().setFromObject(inner);
      const sz = new THREE.Vector3(), ct = new THREE.Vector3();
      box.getSize(sz); box.getCenter(ct);
      const s = 1.80 / Math.max(sz.y, 0.001);
      inner.scale.setScalar(s);
      inner.position.set(-ct.x * s, -box.min.y * s, -ct.z * s);
      root.add(inner);

      const turtleneckMat = new THREE.MeshStandardMaterial({
        map: knitTex, bumpMap: knitTex, bumpScale: 0.014,
        color: 0x0d1018, roughness: 0.84, metalness: 0.06,
      });
      const xrayChestMat = new THREE.MeshPhysicalMaterial({
        color: 0x0f172a, roughness: 0.25, metalness: 0.1,
        transparent: true, opacity: 0.24, depthWrite: false,
      });
      const trousersMat = new THREE.MeshStandardMaterial({ color: 0x111622, roughness: 0.78 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xc28f6c, roughness: 0.54 });

      let headBone = null;
      let neckBone = null;
      let chestBone = null;
      const bodyMeshes = [];
      const strippedNames = [];

      inner.traverse((o) => {
        if (o.isBone) {
          if (o.name === 'Head') headBone = o;
          if (o.name === 'Neck') neckBone = o;
          if (o.name === 'Chest') chestBone = o;
          return;
        }
        const selfOrParent = `${o.name || ''} ${o.parent?.name || ''}`;
        if (/pistol|gun|weapon|briefcase|bag|holster|suit_head|cube\.?204|cube\.?006/i.test(selfOrParent)) {
          o.visible = false;
          if (o.isMesh) strippedNames.push(`${o.parent?.name || ''}/${o.name}`);
          return;
        }
        if (o.isMesh) {
          o.castShadow = true; o.receiveShadow = true;
          if (o.geometry) o.geometry.computeVertexNormals();
          if (o.material) {
            const mName = o.material.name || '';
            if (mName === 'Skin') o.material = skinMat;
            else if (mName === 'Black') o.material = trousersMat;
            else {
              o.material = turtleneckMat;
              bodyMeshes.push(o);
            }
          }
        }
      });

      const invS = 1 / s;
      if (neckBone) {
        const collar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.088 * invS, 0.096 * invS, 0.11 * invS, 28),
          turtleneckMat
        );
        collar.position.set(0, 0.04 * invS, 0.005 * invS);
        neckBone.add(collar);
      }

      // Bespoke High-Resolution Smooth Sculpted Masked MONARCH Head
      const monarchHead = new THREE.Group();
      monarchHead.scale.setScalar(invS);
      if (headBone) headBone.add(monarchHead);
      else root.add(monarchHead);

      const headGeo = new THREE.SphereGeometry(0.112, 48, 36);
      headGeo.scale(0.88, 1.12, 0.96);
      headGeo.computeVertexNormals();
      const headMesh = new THREE.Mesh(
        headGeo,
        new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.50, metalness: 0.04 })
      );
      headMesh.rotation.y = -Math.PI / 2;
      headMesh.position.set(0, 0.115, 0.008);
      headMesh.castShadow = true;
      monarchHead.add(headMesh);

      // Smooth organic sculpted nose (CapsuleGeometry instead of blocky box!)
      const noseGeo = new THREE.CapsuleGeometry(0.011, 0.032, 8, 16);
      const nose = new THREE.Mesh(noseGeo, new THREE.MeshStandardMaterial({ color: 0xbf8a68, roughness: 0.52 }));
      nose.position.set(0, 0.112, 0.105);
      nose.rotation.x = -0.24;
      monarchHead.add(nose);

      // Eyes + Crimson Lens Visor + Animated Eyelid Blinkers
      const crimsonEyeMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.56 });
      const eyelids = [];
      for (const sx of [-1, 1]) {
        const glowLens = new THREE.Mesh(new THREE.PlaneGeometry(0.042, 0.022), crimsonEyeMat);
        glowLens.position.set(sx * 0.036, 0.132, 0.107);
        glowLens.rotation.y = sx * 0.18;
        monarchHead.add(glowLens);

        const iris = new THREE.Mesh(
          new THREE.SphereGeometry(0.011, 16, 16),
          new THREE.MeshStandardMaterial({ color: 0x160505, roughness: 0.08, emissive: 0x7f1d1d, emissiveIntensity: 0.8 })
        );
        iris.position.set(sx * 0.036, 0.132, 0.099);
        monarchHead.add(iris);

        const catchlight = new THREE.Mesh(
          new THREE.SphereGeometry(0.0028, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xfef2f2 })
        );
        catchlight.position.set(sx * 0.036 + 0.004, 0.135, 0.108);
        monarchHead.add(catchlight);

        const lid = new THREE.Mesh(
          new THREE.PlaneGeometry(0.046, 0.024),
          new THREE.MeshStandardMaterial({ color: 0x9c6c4e, roughness: 0.55 })
        );
        lid.position.set(sx * 0.036, 0.132, 0.1085);
        lid.rotation.y = sx * 0.18;

        crimsonRimLight.position.set(0, 1.65, hero.root.position.z - 0.9);
        camera.position.set(lerp(-0.42, 0.16, easeOutCubic(uLocal)), lerp(1.32, 1.54, uLocal), lerp(2.55, 1.65, easeOutCubic(uLocal)));

        // BEAT 1: OBSIDIAN GALLERY — EYES/HEAD LEAD TURN AWAY FROM KHWAAB CORE
        galleryGroup.visible = true;
        crimsonBar.visible = true;
        crimsonBar.position.set(0, 1.56, -2.5);
        scene.background.setHex(0x0b0e18);
        scene.fog.color.setHex(0x0b0e18);
        setAnimWeights(0, 1, 0, 0);
        // Eye/head leads body turn by 0.18s!
        const headTurn = smoothstep(0.18, 0.85, uLocal);
        const bodyTurn = smoothstep(0.28, 0.95, uLocal);
        hero.root.position.set(-0.20, 0, 0.20);
        hero.root.rotation.set(0, lerp(0.08, -0.58, bodyTurn), 0);
        if (hero.headBone) hero.headBone.rotation.y = lerp(0, -0.42, headTurn);

        const shrink = smoothstep(0.32, 0.95, uLocal);
        khwaabOrb.scale.setScalar(lerp(1.05, 0.24, shrink));
        khwaabOrb.rotation.y = t * 1.6;
        khwaabOrb.position.set(lerp(0.32, 0.66, shrink), lerp(1.50, 1.28, shrink), lerp(0.28, -0.32, shrink));
        crystalCage.material.opacity = shrink * 0.85;
        crystalCage.scale.setScalar(lerp(2.4, 1.15, shrink));

        keyLight.color.setHex(0xfde68a); keyLight.intensity = 15;
        keyLight.position.set(1.4, 2.8, 2.2);
        crimsonRimLight.intensity = 6.5;
        crimsonRimLight.position.set(0, 1.6, -1.2);
        camera.position.set(lerp(-0.68, 0.48, uLocal), 1.52, lerp(2.28, 1.76, uLocal));
        camera.lookAt(lerp(0.02, -0.10, uLocal), 1.46, 0.18);
      } else if (bIdx === 2) {
        // BEAT 2: 3 EXCUSE MONOLITHS SLAM ON EXACT SPOKEN PHRASE FRAMES!
        monolithGroup.visible = true;
        scene.background.setHex(0x0d0b14);
        scene.fog.color.setHex(0x0d0b14);
        const drops = b.slam_frames || [b.start_frame + 26, b.start_frame + 64, b.start_frame + 130];
        let shake = 0;
        let hitW = 0;
        monoliths.forEach((m, idx) => {
          const df = drops[idx];
          const du = smoothstep(df - 10, df, f);
          const xPos = (idx - 1) * 0.90;
          const zPos = idx === 1 ? -1.12 : -0.42;
          m.position.set(xPos, lerp(7.2, 0.82 + idx * 0.34, du), zPos);
          if (f >= df && f < df + 12) {
            const p = (f - df) / 12;
            shake = Math.sin(p * Math.PI * 5) * (1 - p) * 0.085;
            hitW = (1 - p) * 0.45;
            shockRing.position.set(xPos, 0.03, zPos);
            shockRing.scale.setScalar(1.0 + p * 4.5);
            shockRing.material.opacity = (1 - p) * 0.72;
          }
        });
        setAnimWeights(0, 1 - hitW, 0, 0, hitW);
        hero.root.position.set(0, 0, 0.58);
        hero.root.rotation.set(0, 0, 0);
        keyLight.color.setHex(0xfca5a5); keyLight.intensity = 17;
        keyLight.position.set(1.2, 4.2, 3.5);
        rimLight.color.setHex(0xef4444); rimLight.intensity = 2.6;
        camera.position.set(shake, 1.26 + shake * 0.5, lerp(3.95, 3.65, uLocal));
        camera.lookAt(0, 1.15, -0.32);
      } else if (bIdx === 3) {
        // BEAT 3: PENTHOUSE RAIN WINDOW + COLD BLUE COMFORT CAGE
        penthouseGroup.visible = true;
        cageShards.forEach((bar) => {
          const a = bar.userData.angle;
          bar.position.set(0.25 + Math.cos(a) * 0.85, 1.05, 0.15 + Math.sin(a) * 0.85);
          bar.rotation.set(0, 0, 0);
        });
        cageMat.opacity = smoothstep(0.0, 0.35, uLocal) * 0.50;
        scene.background.setHex(0x0b1526);
        scene.fog.color.setHex(0x0b1526);
        setAnimWeights(0, 1, 0, 0);
        hero.root.position.set(0.25, 0, 0.15);
        hero.root.rotation.set(0, -0.72, 0);
        if (hero.headBone) hero.headBone.rotation.x = 0.16;
        keyLight.color.setHex(0x93c5fd); keyLight.intensity = 13.5;
        keyLight.position.set(-1.5, 3.2, 2.5);
        rimLight.color.setHex(0x38bdf8); rimLight.intensity = 2.8;
        camera.position.set(lerp(-1.12, 0.92, uLocal), 1.48, lerp(2.45, 2.05, uLocal));
        camera.lookAt(0.08, 1.32, -0.18);
      } else if (bIdx === 4) {
        // BEAT 4: ZACK-D X-RAY CUTAWAY — CHEST HEART IGNITES & SHATTERS COMFORT CAGE!
        penthouseGroup.visible = true;
        const shatterU = smoothstep(0.45, 0.95, uLocal);
        setXrayChest(true, smoothstep(0.15, 0.65, uLocal));
        gradePass.uniforms.uWarmth.value = shatterU;
        embers.material.opacity = shatterU * 0.85;
        embers.position.y = (t * 0.65) % 1.4;
        if (shatterU > 0.02 && shatterU < 0.15) gradePass.uniforms.uFlash.value = 0.16 * (1 - shatterU / 0.15);

        cageShards.forEach((bar, i) => {
          const a = bar.userData.angle;
          const fly = easeOutCubic(shatterU);
          bar.position.set(
            0.25 + Math.cos(a) * (0.85 + fly * 2.8),
            1.05 + fly * (0.6 + (i % 3) * 0.4),
            0.15 + Math.sin(a) * (0.85 + fly * 2.8)
          );
          bar.rotation.set(fly * 2.5, fly * 1.8, fly * 3.0);
        });
        cageMat.opacity = lerp(0.55, 0.0, shatterU);

        scene.background.setHex(0x0c1322);
        scene.fog.color.setHex(0x0c1322);
        setAnimWeights(0, 0, 0, 1);
        hero.root.position.set(0.25, 0, 0.15);
        hero.root.rotation.set(0, lerp(-0.72, 0.0, smoothstep(0.0, 0.4, uLocal)), 0);
        keyLight.color.setHex(shatterU > 0.35 ? 0xfde68a : 0x93c5fd);
        keyLight.intensity = lerp(14, 20, shatterU);
        camera.fov = lerp(42, 36, smoothstep(0.0, 0.45, uLocal));
        camera.position.set(lerp(0.85, 0.25, smoothstep(0.0, 0.45, uLocal)), 1.38, lerp(2.05, 1.44, smoothstep(0.0, 0.45, uLocal)));
        camera.lookAt(0.25, 1.24, 0.15);
      } else if (bIdx === 5) {
        // BEAT 5: OBSIDIAN DESK — LAMP SNAPS ON WITH WARM VOLUMETRIC AMBER LIGHT
        deskGroup.visible = true;
        gradePass.uniforms.uWarmth.value = 0.85;
        scene.background.setHex(0x0d1018);
        scene.fog.color.setHex(0x0d1018);
        rightPivot.rotation.z = lerp(Math.PI, 0, smoothstep(0.1, 0.5, uLocal));
        tenMinPlane.material.opacity = 0;
        phoneGroup.rotation.z = 0;
        phoneGroup.position.y = 0.92;
        pScrMat.color.setHex(0x38bdf8);
        setAnimWeights(0, 0, 0.72, 0.28);
        hero.root.position.set(-0.05, 0, -0.15);
        hero.root.rotation.set(0, 0.08, 0);
        keyLight.color.setHex(0xffdfb0); keyLight.intensity = 10.5;
        keyLight.position.set(0.8, 3.2, 2.4);
        rimLight.color.setHex(0xf59e0b); rimLight.intensity = 2.6;
        camera.position.set(lerp(-0.88, 0.36, uLocal), lerp(1.78, 1.54, uLocal), lerp(2.68, 1.92, uLocal));
        camera.lookAt(-0.02, 1.16, 0.38);
      } else if (bIdx === 6) {
        // BEAT 6: HYPER-LITERAL DESK ACTION — PHONE FLIPS FACE-DOWN + JOURNAL + 10:00 INK!
        deskGroup.visible = true;
        gradePass.uniforms.uWarmth.value = 1.0;
        scene.background.setHex(0x0e111a);
        scene.fog.color.setHex(0x0e111a);
        setAnimWeights(0, 0, 1, 0);
        hero.root.position.set(-0.05, 0, -0.15);
        rightPivot.rotation.z = 0;
        const df = b.desk_frames || [b.start_frame + 16, b.start_frame + 52, b.start_frame + 88];
        const flipU = smoothstep(df[0] - 8, df[0] + 6, f);
        phoneGroup.rotation.z = lerp(0, Math.PI, flipU);
        phoneGroup.position.y = 0.92 + Math.sin(flipU * Math.PI) * 0.14;
        pScrMat.color.setHex(flipU > 0.5 ? 0x0f172a : 0x38bdf8);

        const inkU = smoothstep(df[2] - 8, b.end_frame - 6, f);
        tenMinPlane.material.opacity = Math.max(0.15, inkU);
        pen.position.set(-0.14 + inkU * 0.22, 0.98, 0.58 + Math.sin(inkU * 12) * 0.015);
        keyLight.color.setHex(0xfde68a); keyLight.intensity = 9.5;
        rimLight.color.setHex(0xfbbf24); rimLight.intensity = 2.8;
        camera.position.set(lerp(0.54, 0.04, uLocal), lerp(1.56, 1.48, uLocal), lerp(1.62, 1.38, uLocal));
        camera.lookAt(lerp(0.20, 0.04, uLocal), 0.94, 0.60);
      } else if (bIdx === 7) {
        // BEAT 7: HERO ASCENDING 5 GOLDEN STAIRS + RISING AMBER EMBERS
        stairGroup.visible = true;
        embers.material.opacity = 0.90;
        embers.position.y = (t * 0.72) % 1.6;
        gradePass.uniforms.uWarmth.value = 1.0;
        scene.background.setHex(0x0f111c);
        scene.fog.color.setHex(0x0f111c);
        stairEdges.forEach((em, idx) => {
          const lit = smoothstep(idx * 0.18, idx * 0.18 + 0.16, uLocal);
          em.color.setHex(lit > 0.1 ? 0xfbbf24 : 0x64748b);
          em.emissive.setHex(0xf59e0b);
          em.emissiveIntensity = lit * 1.45;
        });
        setAnimWeights(0, 0, 0, 1);
        hero.root.position.set(0, lerp(0.24, 0.84, easeOutCubic(uLocal)), lerp(-0.65, -1.65, easeOutCubic(uLocal)));
        hero.root.rotation.set(0, lerp(0.65, 0.0, uLocal), 0);
        keyLight.color.setHex(0xffdfb0); keyLight.intensity = 19;
        keyLight.position.set(1.6, 4.4, 2.2);
        rimLight.color.setHex(0xf59e0b); rimLight.intensity = 3.2;
        crimsonRimLight.intensity = 6.0;
        crimsonRimLight.position.set(0, 2.45, -2.6);
        camera.position.set(lerp(1.42, 0.0, uLocal), lerp(1.55, 2.38, uLocal), lerp(1.85, 0.92, uLocal));
        camera.lookAt(0, lerp(1.75, 2.35, uLocal), hero.root.position.z);
      } else {
        // BEAT 8 & 9: SIGNATURE ICONIC MASKED MONARCH PORTRAIT + LOOP EYE PUSH-IN
        ground.visible = false;
        crimsonWall.visible = true;
        crimsonBar.visible = true;
        crimsonWall.position.set(0, 1.5, -1.1);
        crimsonBar.position.set(0, 1.62, -1.02);
        embers.material.opacity = 0.55;
        embers.position.y = (t * 0.45) % 1.4;
        scene.background.setHex(0x161924);
        scene.fog.color.setHex(0x161924);
        setAnimWeights(0, 0, 0, 1);
        hero.root.position.set(0, 0, 0);
        hero.root.rotation.set(0, 0, 0);
        keyLight.color.setHex(0xffffff); keyLight.intensity = 12.5;
        keyLight.position.set(0.38, 2.15, 2.4);
        rimLight.color.setHex(0xef4444); rimLight.intensity = 3.2;
        crimsonRimLight.intensity = 10.5;
        crimsonRimLight.position.set(0, 1.62, -0.62);

        if (bIdx === 8) {
          camera.fov = 34;
          camera.position.set(0, lerp(1.56, 1.60, uLocal), lerp(1.45, 1.12, uLocal));
          camera.lookAt(0, 1.56, 0.0);
        } else {
          camera.fov = lerp(34, 28, uLocal);
          camera.position.set(0, lerp(1.60, 1.63, uLocal), lerp(1.12, 0.80, easeOutCubic(uLocal)));
          camera.lookAt(0, 1.60, 0.0);
        }
      }

      camera.updateProjectionMatrix();
      composer.render();
    };

    // ---------------------------------------------------------------- AUTOMATED PRE-FLIGHT SIGHT-LINE & LUMINANCE QC
    window.__MONARCH_AUDIT__ = () => {
      const issues = [];
      // 1. Verify Pistol/Weapon AND Suit_Head stripped!
      if (hero.strippedNames.length < 4) {
        issues.push(`CRITICAL: Expected Pistol + Suit_Head stripped, got only ${hero.strippedNames.length}`);
      }
      let pistolVisible = false;
      hero.inner.traverse((o) => {
        const nm = `${o.name || ''} ${o.parent?.name || ''}`;
        if (o.isMesh && /pistol|gun|weapon|briefcase|suit_head|cube\.?204|cube\.?006/i.test(nm) && o.visible) pistolVisible = true;
      });
      if (pistolVisible) issues.push('CRITICAL: Unwanted weapon/pistol/Suit_Head mesh is visible on hero rig!');

      // 2. Check hero sight-line + non-black pixel luminance at midpoint of EVERY beat
      const testFrames = beats.map((bt) => Math.floor((bt.start_frame + bt.end_frame) * 0.5));
      testFrames.unshift(0);
      const gl = renderer.getContext();
      const px = new Uint8Array(64 * 64 * 4);
      const smallTarget = new THREE.WebGLRenderTarget(64, 64);

      const report = [];
      for (const fIdx of testFrames) {
        window.__MONARCH_FRAME__(fIdx);
        // Check camera isn't inside ground or clipped inside hero bbox
        const heroCenter = hero.root.position.clone().add(new THREE.Vector3(0, 1.05, 0));
        const camDist = camera.position.distanceTo(heroCenter);
        if (camDist < 0.35) issues.push(`Frame ${fIdx}: camera clipped too close (${camDist.toFixed(2)}m)`);
        if (camera.position.y < 0.15) issues.push(`Frame ${fIdx}: camera below floor`);

        renderer.setRenderTarget(smallTarget);
        renderer.render(scene, camera);
        renderer.readRenderTargetPixels(smallTarget, 0, 0, 64, 64, px);
        renderer.setRenderTarget(null);

        let sumLum = 0;
        for (let i = 0; i < px.length; i += 4) {
          const lr = Math.pow(px[i] / 255, 1 / 2.2);
          const lg = Math.pow(px[i + 1] / 255, 1 / 2.2);
          const lb = Math.pow(px[i + 2] / 255, 1 / 2.2);
          sumLum += 0.299 * lr + 0.587 * lg + 0.114 * lb;
        }
        const meanLum = +(sumLum / (64 * 64)).toFixed(3);
        if (meanLum < 0.06) issues.push(`Frame ${fIdx}: crushed dark frame (srgbLum=${meanLum})`);
        report.push({ frame: fIdx, camDist: +camDist.toFixed(2), srgbLum: meanLum });
      }
      smallTarget.dispose();
      window.__MONARCH_FRAME__(0);
      return { ok: issues.length === 0, issues, report, stripped: hero.strippedNames };
    };

    window.__MONARCH_READY__ = true;
  </script>
