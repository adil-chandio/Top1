<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MONARCH® 3D — Main Abhi Bhi Apni Taraf Hoon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #0e131b;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 42%, transparent 48%, rgba(6, 9, 14, 0.72) 100%);
    }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 88px 56px 210px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(15, 22, 32, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e2e8f0;
      padding: 10px 22px; border-radius: 999px;
      font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .pill.amber { border-color: rgba(245, 158, 11, 0.55); color: #fbbf24; }
    .captions-wrap {
      align-self: center; text-align: center; max-width: 920px;
      padding: 18px 28px; border-radius: 18px;
      background: rgba(10, 14, 21, 0.74);
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.55);
    }
    .captions-text {
      color: #f8fafc; font-size: 42px; font-weight: 900; line-height: 1.24;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.92);
    }
    .captions-text .hi { color: #fbbf24; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">MONARCH® 3D</div>
      <div class="pill amber" id="beatTag">KHWAAB</div>
    </div>
    <div class="captions-wrap" id="captionWrap">
      <div class="captions-text" id="captionsText"></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.20;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x131924);
    scene.fog = new THREE.FogExp2(0x131924, 0.042);

    const camera = new THREE.PerspectiveCamera(42, 1080 / 1920, 0.1, 100);

    // Monochrome Slate Studio + Warm Copper-Amber Key Light
    scene.add(new THREE.HemisphereLight(0x94a3b8, 0x0f172a, 0.85));
    const keySpot = new THREE.SpotLight(0xffdfb0, 42, 26, Math.PI * 0.28, 0.45, 1.4);
    keySpot.position.set(2.8, 6.2, 3.8);
    keySpot.castShadow = true;
    keySpot.shadow.mapSize.set(1024, 1024);
    scene.add(keySpot);

    const rimCool = new THREE.DirectionalLight(0x60a5fa, 2.2);
    rimCool.position.set(-4.5, 4.0, -3.5);
    scene.add(rimCool);

    const warmDeskLight = new THREE.PointLight(0xf59e0b, 4.5, 6.0);
    warmDeskLight.position.set(0.0, 1.85, 0.6);
    scene.add(warmDeskLight);

    // Slate Studio Floor, Back Wall & Timber Desk
    const slateMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.78, metalness: 0.12 });
    const darkSlateMat = new THREE.MeshStandardMaterial({ color: 0x141b26, roughness: 0.85 });
    const deskMat = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.62, metalness: 0.06 });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), darkSlateMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 14), slateMat);
    backWall.position.set(0, 6.5, -5.2);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const deskTop = new THREE.Mesh(new THREE.BoxGeometry(5.8, 0.18, 2.8), deskMat);
    deskTop.position.set(0, 0.92, 0.15);
    deskTop.castShadow = true;
    deskTop.receiveShadow = true;
    scene.add(deskTop);

    // --- HERO: ARTICULATED COPPER-ORANGE MARIONETTE ---
    const copperMat = new THREE.MeshStandardMaterial({ color: 0xe66c2c, roughness: 0.42, metalness: 0.18 });
    const woodFaceMat = new THREE.MeshStandardMaterial({ color: 0xf1b27e, roughness: 0.52 });
    const jointMat = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, roughness: 0.35, metalness: 0.3 });
    const darkSuitMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.65 });

    const puppet = new THREE.Group();
    scene.add(puppet);

    const pelvis = new THREE.Group();
    puppet.add(pelvis);
    const hipMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.20, 16), copperMat);
    hipMesh.castShadow = true;
    pelvis.add(hipMesh);

    const torso = new THREE.Group();
    torso.position.y = 0.12;
    pelvis.add(torso);
    const chestMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.15, 0.46, 18), copperMat);
    chestMesh.position.y = 0.24;
    chestMesh.castShadow = true;
    torso.add(chestMesh);

    // Articulated Head + Eyes
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.56;
    torso.add(headGroup);
    const headSphere = new THREE.Mesh(new THREE.SphereGeometry(0.175, 22, 18), woodFaceMat);
    headSphere.castShadow = true;
    headGroup.add(headSphere);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 10), eyeMat);
    eyeL.position.set(0.06, 0.02, 0.155);
    const eyeR = eyeL.clone();
    eyeR.position.x = -0.06;
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.48), darkSuitMat);
    cap.position.y = 0.02;
    headGroup.add(eyeL, eyeR, cap);

    function makeLimb(len, rad) {
      const g = new THREE.Group();
      const j = new THREE.Mesh(new THREE.SphereGeometry(rad * 1.15, 12, 12), jointMat);
      const seg = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad * 0.85, len, 14), copperMat);
      seg.position.y = -len / 2;
      seg.castShadow = true;
      g.add(j, seg);
      return g;
    }

    const armL = makeLimb(0.32, 0.048);
    armL.position.set(0.24, 0.44, 0);
    const foreL = makeLimb(0.28, 0.042);
    foreL.position.y = -0.32;
    armL.add(foreL);

    const armR = makeLimb(0.32, 0.048);
    armR.position.set(-0.24, 0.44, 0);
    const foreR = makeLimb(0.28, 0.042);
    foreR.position.y = -0.32;
    armR.add(foreR);
    torso.add(armL, armR);

    const legL = makeLimb(0.38, 0.058);
    legL.position.set(0.10, -0.06, 0);
    const shinL = makeLimb(0.36, 0.048);
    shinL.position.y = -0.38;
    legL.add(shinL);

    const legR = makeLimb(0.38, 0.058);
    legR.position.set(-0.10, -0.06, 0);
    const shinR = makeLimb(0.36, 0.048);
    shinR.position.y = -0.38;
    legR.add(shinR);
    pelvis.add(legL, legR);

    // Control Cross-Bar & Marionette Strings
    const controlGroup = new THREE.Group();
    scene.add(controlGroup);
    const crossA = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.035, 0.05), deskMat);
    const crossB = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.035, 0.65), deskMat);
    controlGroup.add(crossA, crossB);
    controlGroup.position.set(-0.85, 3.25, 0.15);

    const stringMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.72 });
    const strings = [];
    for (let i = 0; i < 4; i++) {
      const s = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 2.0, 6), stringMat);
      s.position.set((i - 1.5) * 0.24, 2.35, 0.15);
      controlGroup.add(s);
      strings.push(s);
    }

    // --- 3 SLATE MONOLITH BLOCKS -> 5 ASCENDING AMBER-LIT STAIR STEPS ---
    function makeLabelTex(line) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 192;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#253142';
      ctx.fillRect(0, 0, 512, 192);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 6;
      ctx.strokeRect(8, 8, 496, 176);
      ctx.fillStyle = '#f8fafc';
      ctx.font = '900 32px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(line, 256, 96);
      return new THREE.CanvasTexture(c);
    }

    const blockLabels = ['KAL SE', 'MERE BAS KA NAHI', 'ZIKR BAND'];
    const blocks = blockLabels.map((lbl, idx) => {
      const mat = new THREE.MeshStandardMaterial({ map: makeLabelTex(lbl), roughness: 0.65 });
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.42, 0.62), mat);
      m.position.set(0.95, 5.0, -0.35 + idx * 0.05);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      return m;
    });

    const stairGroup = new THREE.Group();
    stairGroup.visible = false;
    scene.add(stairGroup);
    const stairTreads = [];
    const stairEdges = [];
    for (let i = 0; i < 5; i++) {
      const stepMat = new THREE.MeshStandardMaterial({ color: 0x243041, roughness: 0.55 });
      const step = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.22, 0.48), stepMat);
      step.position.set(0.95, 1.12 + i * 0.26, 0.45 - i * 0.42);
      step.castShadow = true;
      step.receiveShadow = true;
      const edgeMat = new THREE.MeshStandardMaterial({ color: 0x475569, emissive: 0x000000, emissiveIntensity: 0 });
      const edge = new THREE.Mesh(new THREE.BoxGeometry(1.26, 0.04, 0.05), edgeMat);
      edge.position.set(0.95, 1.22 + i * 0.26, 0.68 - i * 0.42);
      stairGroup.add(step, edge);
      stairTreads.push(step);
      stairEdges.push(edgeMat);
    }

    // --- DESK PROPS: NOTEBOOK + AMBER INK LINE + PEN + FLIPPING PHONE ---
    const notebookGroup = new THREE.Group();
    notebookGroup.position.set(-0.05, 1.03, 0.55);
    scene.add(notebookGroup);
    const coverL = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.56), new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.6 }));
    coverL.position.x = -0.21;
    const pageMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.85 });
    const pageL = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.025, 0.52), pageMat);
    pageL.position.set(-0.20, 0.02, 0);
    const rightCoverPivot = new THREE.Group();
    const coverR = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.56), new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.6 }));
    coverR.position.x = 0.21;
    const pageR = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.025, 0.52), pageMat);
    pageR.position.set(0.20, 0.02, 0);
    rightCoverPivot.add(coverR, pageR);
    notebookGroup.add(coverL, pageL, rightCoverPivot);

    // Amber writing stroke across right page
    const inkLine = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.008, 0.022),
      new THREE.MeshBasicMaterial({ color: 0xf59e0b })
    );
    inkLine.position.set(0.20, 1.068, 0.52);
    inkLine.scale.x = 0.001;
    inkLine.visible = false;
    scene.add(inkLine);

    const pen = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.008, 0.24, 10),
      new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.7, roughness: 0.2 })
    );
    pen.rotation.z = Math.PI / 3;
    pen.position.set(0.35, 1.07, 0.60);
    scene.add(pen);

    // Smartphone with glowing screen (flips screen-down on frame 844!)
    const phoneGroup = new THREE.Group();
    phoneGroup.position.set(0.55, 1.04, 0.55);
    const phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.024, 0.42), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.6 }));
    const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.37), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    phoneScreen.rotation.x = -Math.PI / 2;
    phoneScreen.position.y = 0.013;
    phoneGroup.add(phoneBody, phoneScreen);
    scene.add(phoneGroup);

    // Floating dust motes
    const mCount = 180;
    const mGeo = new THREE.BufferGeometry();
    const mArr = new Float32Array(mCount * 3);
    for (let i = 0; i < mCount; i++) {
      mArr[i * 3] = Math.sin(i * 19.1) * 4.5;
      mArr[i * 3 + 1] = 0.4 + ((i % 30) / 30) * 4.2;
      mArr[i * 3 + 2] = Math.cos(i * 43.7) * 3.5;
    }
    mGeo.setAttribute('position', new THREE.BufferAttribute(mArr, 3));
    const motes = new THREE.Points(mGeo, new THREE.PointsMaterial({ color: 0xfde68a, size: 0.025, transparent: true, opacity: 0.48 }));
    scene.add(motes);

    const lerp = (a, b, u) => a + (b - a) * Math.min(1, Math.max(0, u));
    const smoothstep = (e0, e1, x) => {
      const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
      return u * u * (3 - 2 * u);
    };

    function formatCaption(text, tLocal, dur) {
      const words = text.split(' ');
      const progress = Math.min(1, Math.max(0, tLocal / Math.max(dur * 0.90, 0.2)));
      const activeIdx = Math.min(words.length - 1, Math.floor(progress * words.length));
      const winStart = Math.max(0, Math.floor(activeIdx / 6) * 6);
      return words.slice(winStart, winStart + 6).map((w, i) => (winStart + i <= activeIdx ? `<span class="hi">${w}</span>` : w)).join(' ');
    }

    let TIMELINE = null;
    window.__MONARCH_INIT__ = async (timeline) => {
      TIMELINE = timeline;
      renderer.setSize(1080, 1920, false);
      renderer.render(scene, camera);
    };

    window.__MONARCH_FRAME__ = (f) => {
      const fps = TIMELINE.fps || 30;
      const t = f / fps;
      motes.position.y = Math.sin(t * 0.4) * 0.12;

      const beats = TIMELINE.beats;
      let b = beats[beats.length - 1];
      for (let i = 0; i < beats.length; i++) {
        if (t >= beats[i].start && t < beats[i].end) { b = beats[i]; break; }
      }
      document.getElementById('beatTag').textContent = b.tag;
      document.getElementById('captionsText').innerHTML = formatCaption(b.text || b.caption, t - b.start, b.end - b.start);

      // Puppet state: slumped suspended until f=963, then rises to proud stance by f=1060!
      const riseU = smoothstep(963, 1060, f);
      const slump = 1 - riseU;
      puppet.position.set(-0.85, lerp(1.58, 1.78, riseU) + Math.sin(t * 2.1) * 0.015 * slump, 0.15);
      puppet.rotation.y = lerp(0.32, 0.08, riseU);
      torso.rotation.x = lerp(0.34, 0.0, riseU);
      headGroup.rotation.x = lerp(0.45, -0.05, riseU);
      armL.rotation.set(lerp(0.2, 0.08, riseU), 0, lerp(-0.18, -0.08, riseU));
      armR.rotation.set(lerp(0.2, 0.08, riseU), 0, lerp(0.18, 0.08, riseU));
      legL.rotation.x = lerp(-0.85, 0.0, riseU);
      legR.rotation.x = lerp(-0.85, 0.0, riseU);
      shinL.rotation.x = lerp(1.15, 0.0, riseU);
      shinR.rotation.x = lerp(1.15, 0.0, riseU);

      // Control strings fade out after f=963
      stringMat.opacity = 0.72 * (1 - smoothstep(963, 1015, f));
      controlGroup.position.y = lerp(3.25, 4.4, smoothstep(963, 1020, f));

      // Slate blocks slam down at f=279, f=314, f=363, then unfold into 5 glowing stairs at f=546!
      const showStairs = f >= 546;
      blocks.forEach((blk, i) => { blk.visible = !showStairs; });
      stairGroup.visible = showStairs;

      if (!showStairs) {
        const dropFrames = [279, 314, 363];
        const targetY = [1.22, 1.65, 2.08];
        blocks.forEach((blk, idx) => {
          const df = dropFrames[idx];
          if (f < df - 12) {
            blk.position.y = 6.5;
          } else {
            const du = smoothstep(df - 12, df, f);
            const bounce = f >= df && f < df + 8 ? Math.sin(((f - df) / 8) * Math.PI) * 0.06 : 0;
            blk.position.set(0.95, lerp(5.2, targetY[idx], du) + bounce, 0.15);
          }
        });
      } else {
        const stepFrames = [662, 674, 687, 700, 712];
        stairEdges.forEach((em, idx) => {
          const lit = smoothstep(stepFrames[idx] - 2, stepFrames[idx] + 4, f);
          em.color.setHex(lit > 0.1 ? 0xfbbf24 : 0x475569);
          em.emissive.setHex(0xf59e0b);
          em.emissiveIntensity = lit * 1.8;
        });
      }

      // Notebook opens at f=675
      const openU = smoothstep(665, 690, f);
      rightCoverPivot.rotation.z = lerp(Math.PI, 0, openU);

      // Phone flips screen-down on f=833..844
      const flipU = smoothstep(833, 845, f);
      phoneGroup.rotation.z = lerp(0, Math.PI, flipU);
      phoneGroup.position.y = 1.04 + Math.sin(flipU * Math.PI) * 0.14;

      // Amber ink writes across page on f=933..975
      if (f >= 933) {
        inkLine.visible = true;
        const wU = smoothstep(933, 975, f);
        inkLine.scale.x = Math.max(0.01, wU);
        pen.position.set(0.08 + wU * 0.26, 1.15, 0.52);
      } else {
        inkLine.visible = false;
        pen.position.set(0.35, 1.07, 0.60);
      }

      // 8-Beat Camera Choreography
      if (f < 267) {
        const u = smoothstep(0, 267, f);
        camera.position.set(lerp(-0.4, -0.7, u), lerp(2.15, 1.95, u), lerp(4.2, 3.0, u));
        camera.lookAt(-0.75, 1.75, 0.15);
      } else if (f < 398) {
        const u = smoothstep(267, 398, f);
        camera.position.set(lerp(0.2, 0.55, u), 2.15, lerp(4.1, 3.7, u));
        camera.lookAt(0.25, 1.65, 0.15);
      } else if (f < 537) {
        const u = smoothstep(398, 537, f);
        camera.position.set(lerp(0.6, -1.5, u), 2.05, lerp(3.7, 3.4, u));
        camera.lookAt(0.0, 1.60, 0.15);
      } else if (f < 706) {
        const u = smoothstep(537, 706, f);
        camera.position.set(lerp(-1.2, 0.3, u), lerp(2.1, 2.35, u), lerp(3.6, 3.8, u));
        camera.lookAt(0.45, 1.55, 0.10);
      } else if (f < 833) {
        const u = smoothstep(706, 833, f);
        camera.position.set(lerp(0.3, 0.15, u), lerp(2.35, 1.85, u), lerp(3.8, 2.25, u));
        camera.lookAt(0.05, 1.08, 0.52);
      } else if (f < 933) {
        const u = smoothstep(833, 933, f);
        camera.position.set(lerp(0.15, 0.48, u), lerp(1.85, 1.72, u), lerp(2.25, 2.05, u));
        camera.lookAt(0.42, 1.05, 0.55);
      } else if (f < 1125) {
        const u = smoothstep(933, 1125, f);
        camera.position.set(lerp(0.35, -0.35, u), lerp(1.75, 2.05, u), lerp(2.15, 3.65, u));
        camera.lookAt(lerp(-0.2, -0.45, u), lerp(1.2, 1.85, u), 0.25);
      } else {
        const u = smoothstep(1125, 1200, f);
        camera.position.set(lerp(-0.35, -0.15, u), 2.05, lerp(3.65, 3.35, u));
        camera.lookAt(-0.15, 1.80, 0.0);
      }

      renderer.render(scene, camera);
    };
  </script>
</body>
</html>
