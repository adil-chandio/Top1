<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MONARCH® Cinema 3D — Main Abhi Bhi Apni Taraf Hoon (V2 Masked Monarch)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #05070c;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 84px 52px 210px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(10, 12, 18, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      padding: 12px 24px; border-radius: 999px;
      font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .pill.crimson { border-color: rgba(239, 68, 68, 0.65); color: #fca5a5; }
    .pill.amber { border-color: rgba(245, 158, 11, 0.65); color: #fbbf24; }
    .captions-wrap {
      align-self: center; text-align: center; max-width: 930px;
      padding: 18px 28px; border-radius: 18px;
      background: rgba(6, 8, 14, 0.82);
      border: 1px solid rgba(245, 158, 11, 0.34);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.72);
    }
    .captions-text {
      color: #f8fafc; font-size: 42px; font-weight: 900; line-height: 1.24;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.96);
    }
    .captions-text .hi { color: #fbbf24; }
    .cta-banner {
      align-self: center; text-align: center; margin-bottom: 14px;
      opacity: 0; transform: translateY(12px);
      background: rgba(10, 8, 12, 0.86);
      border: 1px solid rgba(239, 68, 68, 0.55);
      padding: 14px 28px; border-radius: 14px;
      color: #f8fafc; font-size: 26px; font-weight: 900; letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .cta-banner.visible { opacity: 1; transform: translateY(0); }
    .cta-banner span { color: #fbbf24; }
    .bottom-stack { display: flex; flex-direction: column; align-items: center; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">MONARCH® 3D</div>
      <div class="pill crimson" id="beatTag">KHWAAB</div>
    </div>
    <div class="bottom-stack">
      <div class="cta-banner" id="ctaBanner">MAIN ABHI BHI <span>APNI TARAF HOON</span></div>
      <div class="captions-wrap" id="captionWrap">
        <div class="captions-text" id="captionsText"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const W = 1080, H = 1920;
    const canvas = document.getElementById('stage');
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06080f);
    scene.fog = new THREE.FogExp2(0x06080f, 0.032);

    const camera = new THREE.PerspectiveCamera(42, W / H, 0.08, 120);

    // ---------------------------------------------------------------- POST-PROCESSING CINEMA PIPELINE
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.28, 0.48, 0.86);
    composer.addPass(bloomPass);

    const CinemaGradeShader = {
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0.0 }, uWarmth: { value: 0.0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform float uWarmth;
        varying vec2 vUv;
        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        void main() {
          vec2 d = vUv - 0.5;
          float r2 = dot(d, d);
          vec2 shift = d * r2 * 0.0022;
          float r = texture2D(tDiffuse, vUv + shift).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - shift).b;
          vec3 col = vec3(r, g, b);
          float lum = dot(col, vec3(0.299, 0.587, 0.114));
          vec3 coolSh = vec3(-0.006, 0.002, 0.016);
          vec3 warmHi = mix(vec3(0.018, 0.004, -0.006), vec3(0.026, 0.012, -0.012), uWarmth);
          col += mix(coolSh, warmHi, smoothstep(0.10, 0.72, lum));
          float vig = smoothstep(0.96, 0.25, r2 * 1.40);
          col *= mix(0.32, 1.0, vig);
          float grain = (hash12(vUv * vec2(1080.0, 1920.0) + uTime * 31.0) - 0.5) * 0.022;
          gl_FragColor = vec4(clamp(col + grain, 0.0, 1.0), 1.0);
        }
      `,
    };
    const gradePass = new ShaderPass(CinemaGradeShader);
    composer.addPass(gradePass);
    composer.addPass(new OutputPass());

    // ---------------------------------------------------------------- PROCEDURAL TEXTURES (KNIT, SKIN+BEARD, VENETIAN FILIGREE MASK, ASPHALT, MARBLE)
    function makeTurtleneckKnitTex() {
      const c = document.createElement('canvas'); c.width = 256; c.height = 256;
      const g = c.getContext('2d');
      g.fillStyle = '#090a0e'; g.fillRect(0, 0, 256, 256);
      for (let x = 0; x < 256; x += 6) {
        g.fillStyle = x % 12 === 0 ? '#14161e' : '#050609';
        g.fillRect(x, 0, 3, 256);
      }
      for (let y = 0; y < 256; y += 8) {
        g.fillStyle = 'rgba(255,255,255,0.025)';
        g.fillRect(0, y, 256, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      return tex;
    }

    function makeFaceSkinBeardTex() {
      // Equirectangular-like UV for sculpted head sphere: front is center u=0.5!
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      // Warm South-Asian olive skin base
      const grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#b58462');
      grad.addColorStop(0.55, '#c28f6c');
      grad.addColorStop(1.0, '#9c6c4e');
      g.fillStyle = grad;
      g.fillRect(0, 0, 512, 512);

      // Subtle cheekbone & nose bridge shading
      g.fillStyle = 'rgba(85, 52, 34, 0.22)';
      g.beginPath(); g.ellipse(198, 255, 28, 42, 0.2, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(314, 255, 28, 42, -0.2, 0, Math.PI * 2); g.fill();

      // Groomed Short Beard & Jawline Stubble (matching reference!)
      const beardGrad = g.createRadialGradient(256, 365, 25, 256, 365, 130);
      beardGrad.addColorStop(0.0, 'rgba(18, 16, 16, 0.92)');
      beardGrad.addColorStop(0.65, 'rgba(22, 19, 18, 0.85)');
      beardGrad.addColorStop(1.0, 'rgba(22, 19, 18, 0.0)');
      g.fillStyle = beardGrad;
      g.beginPath();
      g.moveTo(155, 290);
      g.quadraticCurveTo(175, 435, 256, 455);
      g.quadraticCurveTo(337, 435, 357, 290);
      g.quadraticCurveTo(320, 340, 256, 336);
      g.quadraticCurveTo(192, 340, 155, 290);
      g.fill();

      // Mustache
      g.fillStyle = 'rgba(14, 13, 14, 0.94)';
      g.beginPath();
      g.moveTo(214, 332);
      g.quadraticCurveTo(256, 314, 298, 332);
      g.quadraticCurveTo(278, 348, 256, 342);
      g.quadraticCurveTo(234, 348, 214, 332);
      g.fill();

      // Lips & Soul Patch
      g.fillStyle = '#8b5446';
      g.beginPath(); g.ellipse(256, 350, 22, 8, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(14, 13, 14, 0.92)';
      g.beginPath(); g.ellipse(256, 372, 11, 13, 0, 0, Math.PI * 2); g.fill();

      // Fine stubble dots
      for (let i = 0; i < 1400; i++) {
        const rx = 165 + ((Math.sin(i * 17.3) * 999) % 1 + 1) % 1 * 182;
        const ry = 290 + ((Math.cos(i * 31.7) * 999) % 1 + 1) % 1 * 145;
        g.fillStyle = 'rgba(12,11,12,0.35)';
        g.fillRect(rx, ry, 1.5, 2.2);
      }

      // Dark Eyebrows
      g.fillStyle = '#121113';
      g.beginPath(); g.ellipse(216, 206, 26, 6, -0.08, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(296, 206, 26, 6, 0.08, 0, Math.PI * 2); g.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeVenetianFiligreeMaskTextures() {
      // Symmetrical ornate Venetian filigree lace mask alpha + metallic color + bump!
      const c = document.createElement('canvas'); c.width = 512; c.height = 256;
      const a = document.createElement('canvas'); a.width = 512; a.height = 256;
      const gc = c.getContext('2d'), ga = a.getContext('2d');
      gc.fillStyle = '#0c0d11'; gc.fillRect(0, 0, 512, 256);
      ga.fillStyle = '#000000'; ga.fillRect(0, 0, 512, 256);

      const drawHalf = (ctx, color, isAlpha) => {
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineCap = 'round';
        // Crown & center nose bridge
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.moveTo(256, 34); ctx.quadraticCurveTo(234, 70, 256, 118);
        ctx.quadraticCurveTo(256, 152, 240, 174);
        ctx.stroke();

        // Outer ornate frame around eye
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(256, 64);
        ctx.bezierCurveTo(215, 52, 145, 58, 92, 92);
        ctx.bezierCurveTo(64, 112, 74, 154, 118, 174);
        ctx.bezierCurveTo(165, 195, 224, 180, 246, 152);
        ctx.stroke();

        // Inner eye ring cutout border
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.ellipse(174, 122, 48, 25, -0.06, 0, Math.PI * 2);
        ctx.stroke();

        // Decorative filigree curls & swirls (forehead, temple, cheekbone)
        ctx.lineWidth = 5;
        const curls = [
          [232, 60, 206, 36, 186, 56],
          [190, 62, 160, 38, 134, 66],
          [135, 76, 98, 62, 82, 98],
          [98, 148, 86, 182, 116, 194],
          [148, 180, 144, 212, 176, 204],
          [202, 176, 212, 204, 238, 192],
        ];
        for (const [x1, y1, cx, cy, x2, y2] of curls) {
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke();
          ctx.beginPath(); ctx.arc(x2, y2, 6, 0, Math.PI * 2); ctx.fill();
        }
        // Silver gemstone studs
        if (!isAlpha) {
          ctx.fillStyle = '#e2e8f0';
          for (const [gx, gy] of [[256, 108], [220, 62], [148, 72], [102, 112]]) {
            ctx.beginPath(); ctx.arc(gx, gy, 3.8, 0, Math.PI * 2); ctx.fill();
          }
        }
      };

      // Left half
      drawHalf(gc, '#171920', false);
      drawHalf(ga, '#ffffff', true);
      // Mirror right half
      gc.save(); gc.translate(512, 0); gc.scale(-1, 1); drawHalf(gc, '#171920', false); gc.restore();
      ga.save(); ga.translate(512, 0); ga.scale(-1, 1); drawHalf(ga, '#ffffff', true); ga.restore();

      // Carve clean transparent eye openings in alpha map
      ga.fillStyle = '#000000';
      ga.beginPath(); ga.ellipse(174, 122, 41, 19, -0.06, 0, Math.PI * 2); ga.fill();
      ga.beginPath(); ga.ellipse(338, 122, 41, 19, 0.06, 0, Math.PI * 2); ga.fill();

      const colTex = new THREE.CanvasTexture(c); colTex.colorSpace = THREE.SRGBColorSpace;
      const alphaTex = new THREE.CanvasTexture(a);
      return { colTex, alphaTex };
    }

    function makeAsphaltTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#0f131b'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 2400; i++) {
        const x = ((Math.sin(i * 19.3) * 9187) % 1 + 1) % 1 * 512;
        const y = ((Math.cos(i * 41.7) * 6311) % 1 + 1) % 1 * 512;
        g.fillStyle = i % 2 === 0 ? 'rgba(32,40,56,0.28)' : 'rgba(6,8,12,0.34)';
        g.fillRect(x, y, 4 + (i % 12), 4 + (i % 8));
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 8);
      return tex;
    }

    const knitTex = makeTurtleneckKnitTex();
    const faceTex = makeFaceSkinBeardTex();
    const maskTexs = makeVenetianFiligreeMaskTextures();
    const asphaltTex = makeAsphaltTex();

    // ---------------------------------------------------------------- LIGHTING RIG (DYNAMICALLY DRIVEN PER SCENE)
    const hemi = new THREE.HemisphereLight(0x88b4ff, 0x090b12, 0.72);
    scene.add(hemi);

    const keyLight = new THREE.SpotLight(0xffdfb0, 14, 24, Math.PI * 0.32, 0.55, 1.2);
    keyLight.position.set(1.8, 4.2, 3.6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x60a5fa, 2.2);
    rimLight.position.set(-3.5, 3.5, -4.0);
    scene.add(rimLight);

    const crimsonRimLight = new THREE.PointLight(0xff2a2a, 0.0, 9.0);
    crimsonRimLight.position.set(0, 1.65, -0.8);
    scene.add(crimsonRimLight);

    // ---------------------------------------------------------------- BUILD 3D MASKED MONARCH CHARACTER
    const loader = new GLTFLoader();
    const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));
    const TIMELINE = await (await fetch('./timeline.json')).json();

    const [humanGltf, streetLightGltf, lampGltf, chairGltf, booksGltf] = await Promise.all([
      loadGLTF('/assets/suit.glb'),
      loadGLTF('/assets/streetlight.glb'),
      loadGLTF('/assets/lamp_table.glb'),
      loadGLTF('/assets/armchair_pillows.glb'),
      loadGLTF('/assets/book_set.glb'),
    ]);

    function buildMonarchHero(gltf) {
      const root = new THREE.Group();
      const inner = SkeletonUtils.clone(gltf.scene);
      const box = new THREE.Box3().setFromObject(inner);
      const sz = new THREE.Vector3(), ct = new THREE.Vector3();
      box.getSize(sz); box.getCenter(ct);
      const s = 1.80 / Math.max(sz.y, 0.001);
      inner.scale.setScalar(s);
      inner.position.set(-ct.x * s, -box.min.y * s, -ct.z * s);
      root.add(inner);

      const turtleneckMat = new THREE.MeshStandardMaterial({
        map: knitTex, bumpMap: knitTex, bumpScale: 0.015,
        color: 0x0b0c10, roughness: 0.88, metalness: 0.06,
      });
      const trousersMat = new THREE.MeshStandardMaterial({ color: 0x0f1218, roughness: 0.80 });
      const skinMat = new THREE.MeshStandardMaterial({ color: 0xc28f6c, roughness: 0.56 });

      let headBone = null;
      let neckBone = null;

      inner.traverse((o) => {
        if (o.isBone) {
          if (o.name === 'Head') headBone = o;
          if (o.name === 'Neck') neckBone = o;
        }
        if (o.isMesh) {
          o.castShadow = true; o.receiveShadow = true;
          if (/Head/i.test(o.name)) {
            o.visible = false; // Replace stylized low-poly head with bespoke Masked MONARCH Head!
            return;
          }
          if (o.material) {
            const mName = o.material.name || '';
            if (mName === 'Skin') o.material = skinMat;
            else if (mName === 'LightBlue') o.material = trousersMat;
            else o.material = turtleneckMat;
          }
        }
      });

      // Attach 3D Ribbed Black Turtleneck Collar onto Neck bone
      const invS = 1 / s;
      if (neckBone) {
        const collar = new THREE.Mesh(
          new THREE.CylinderGeometry(0.088 * invS, 0.096 * invS, 0.11 * invS, 24),
          turtleneckMat
        );
        collar.position.set(0, 0.04 * invS, 0.005 * invS);
        neckBone.add(collar);
      }

      // Attach Bespoke Sculpted Masked MONARCH Head onto Head bone
      const monarchHead = new THREE.Group();
      monarchHead.scale.setScalar(invS);
      if (headBone) headBone.add(monarchHead);
      else root.add(monarchHead);

      // 1. Cranium + Jaw (oriented so UV center u=0.5 faces +Z!)
      const headGeo = new THREE.SphereGeometry(0.112, 32, 28);
      headGeo.scale(0.88, 1.12, 0.96);
      const headMesh = new THREE.Mesh(
        headGeo,
        new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.52, metalness: 0.04 })
      );
      headMesh.rotation.y = -Math.PI / 2; // Align sphere front seam (u=0.5) toward +Z!
      headMesh.position.set(0, 0.115, 0.008);
      headMesh.castShadow = true;
      monarchHead.add(headMesh);

      // Subtle 3D Nose Bridge
      const nose = new THREE.Mesh(
        new THREE.BoxGeometry(0.022, 0.048, 0.032),
        new THREE.MeshStandardMaterial({ color: 0xba8663, roughness: 0.55 })
      );
      nose.position.set(0, 0.112, 0.106);
      nose.rotation.x = -0.22;
      monarchHead.add(nose);

      // 2. Crimson Glowing Eye Visor + Piercing Eyes inside Mask Cutouts
      const crimsonEyeMat = new THREE.MeshBasicMaterial({
        color: 0xdc2626, transparent: true, opacity: 0.62,
      });
      for (const sx of [-1, 1]) {
        const glowLens = new THREE.Mesh(new THREE.PlaneGeometry(0.042, 0.022), crimsonEyeMat);
        glowLens.position.set(sx * 0.036, 0.132, 0.106);
        glowLens.rotation.y = sx * 0.18;
        monarchHead.add(glowLens);

        const iris = new THREE.Mesh(
          new THREE.SphereGeometry(0.011, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0x110505, roughness: 0.12, emissive: 0x450a0a, emissiveIntensity: 0.5 })
        );
        iris.position.set(sx * 0.036, 0.132, 0.098);
        monarchHead.add(iris);
      }

      // 3. 3D Curved Ornate Black Venetian Filigree Mask
      const maskGeo = new THREE.CylinderGeometry(0.109, 0.106, 0.092, 32, 1, true, -Math.PI * 0.36, Math.PI * 0.72);
      const maskMat = new THREE.MeshStandardMaterial({
        map: maskTexs.colTex,
        alphaMap: maskTexs.alphaTex,
        bumpMap: maskTexs.alphaTex,
        bumpScale: 0.008,
        transparent: true,
        alphaTest: 0.25,
        side: THREE.DoubleSide,
        roughness: 0.32,
        metalness: 0.55,
      });
      const maskMesh = new THREE.Mesh(maskGeo, maskMat);
      maskMesh.position.set(0, 0.132, 0.012);
      monarchHead.add(maskMesh);

      // 4. Smooth Sculpted Center-Parted Dark Black Hair (matching reference!)
      const hairMat = new THREE.MeshStandardMaterial({ color: 0x090a0e, roughness: 0.72, metalness: 0.06 });
      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.118, 28, 22, 0, Math.PI * 2, 0, Math.PI * 0.54), hairMat);
      crown.scale.set(0.92, 0.96, 1.02);
      crown.position.set(0, 0.136, 0.002);
      monarchHead.add(crown);

      // Swept smooth center-parted front curtains + side temple sweep + back volume
      for (const sx of [-1, 1]) {
        const sweep = new THREE.Mesh(new THREE.SphereGeometry(0.068, 22, 18), hairMat);
        sweep.scale.set(1.05, 0.56, 1.35);
        sweep.position.set(sx * 0.052, 0.195, 0.042);
        sweep.rotation.set(0.28, sx * 0.25, sx * -0.44);
        monarchHead.add(sweep);

        const temple = new THREE.Mesh(new THREE.SphereGeometry(0.056, 18, 14), hairMat);
        temple.scale.set(0.55, 1.15, 0.95);
        temple.position.set(sx * 0.088, 0.155, 0.012);
        temple.rotation.z = sx * -0.15;
        monarchHead.add(temple);
      }
      const backHair = new THREE.Mesh(new THREE.SphereGeometry(0.108, 22, 16), hairMat);
      backHair.scale.set(0.92, 1.05, 0.88);
      backHair.position.set(0, 0.135, -0.028);
      monarchHead.add(backHair);

      const mixer = new THREE.AnimationMixer(inner);
      const findClip = (re, fb) => gltf.animations.find((a) => re.test(a.name)) || gltf.animations[fb || 0];
      const acts = {
        walk: mixer.clipAction(findClip(/^Walk$/i, 0)),
        idleNeutral: mixer.clipAction(findClip(/Idle_Neutral/i, 0)),
        interact: mixer.clipAction(findClip(/Interact/i, 0)),
        idle: mixer.clipAction(findClip(/^Idle$/i, 0)),
      };
      Object.values(acts).forEach((a) => a.play());

      return { root, mixer, acts, headBone, monarchHead };
    }

    const hero = buildMonarchHero(humanGltf);
    scene.add(hero.root);

    // ---------------------------------------------------------------- 9-SETPIECE STORYTELLING PROPS
    function fitHeight(gltfScene, targetH) {
      const g = new THREE.Group();
      const inner = SkeletonUtils.clone(gltfScene);
      const box = new THREE.Box3().setFromObject(inner);
      const sz = new THREE.Vector3(), ct = new THREE.Vector3();

        embers.material.opacity = 0.45;
        scene.background.setHex(0x14161b);
        scene.fog.color.setHex(0x14161b);
        setAnimWeights(0, 0, 0, 1);
        hero.root.position.set(0, 0, 0);
        hero.root.rotation.set(0, 0, 0);
        keyLight.color.setHex(0xffffff); keyLight.intensity = 15;
        keyLight.position.set(0.35, 2.15, 2.4);
        rimLight.color.setHex(0xef4444); rimLight.intensity = 2.6;
        crimsonRimLight.intensity = 9.0;
        crimsonRimLight.position.set(0, 1.62, -0.65);
        camera.position.set(0, lerp(1.56, 1.61, u), lerp(1.18, 0.88, u));
        camera.lookAt(0, 1.56, 0.0);
      }

      composer.render();
    };

    window.__MONARCH_READY__ = true;
  </script>
