<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MONARCH® Cinema 3D — Main Abhi Bhi Apni Taraf Hoon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #090d14;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 84px 52px 210px;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .pill {
      background: rgba(12, 18, 28, 0.80);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      padding: 12px 24px; border-radius: 999px;
      font-size: 21px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
    .pill.amber { border-color: rgba(245, 158, 11, 0.62); color: #fbbf24; }
    .captions-wrap {
      align-self: center; text-align: center; max-width: 930px;
      padding: 18px 28px; border-radius: 18px;
      background: rgba(8, 12, 19, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.30);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.65);
    }
    .captions-text {
      color: #f8fafc; font-size: 42px; font-weight: 900; line-height: 1.24;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.94);
    }
    .captions-text .hi { color: #fbbf24; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud">
    <div class="top-bar">
      <div class="pill">MONARCH® 3D</div>
      <div class="pill amber" id="beatTag">KHWAAB</div>
    </div>
    <div class="captions-wrap" id="captionWrap">
      <div class="captions-text" id="captionsText"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    const W = 1080, H = 1920;
    const canvas = document.getElementById('stage');
    canvas.width = W; canvas.height = H;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(W, H, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b101b);
    scene.fog = new THREE.FogExp2(0x0b101b, 0.036);

    const camera = new THREE.PerspectiveCamera(44, W / H, 0.1, 100);

    // ---------------------------------------------------------------- POST-PROCESSING CINEMA GRADE
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.42, 0.55, 0.74);
    composer.addPass(bloomPass);

    const CinemaGradeShader = {
      uniforms: { tDiffuse: { value: null }, uTime: { value: 0.0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec2 vUv;
        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }
        void main() {
          vec2 d = vUv - 0.5;
          float r2 = dot(d, d);
          vec2 shift = d * r2 * 0.0022;
          float r = texture2D(tDiffuse, vUv + shift).r;
          float g = texture2D(tDiffuse, vUv).g;
          float b = texture2D(tDiffuse, vUv - shift).b;
          vec3 col = vec3(r, g, b);
          float lum = dot(col, vec3(0.299, 0.587, 0.114));
          // Deep indigo shadows, warm amber key highlights
          col += mix(vec3(-0.006, 0.002, 0.016), vec3(0.024, 0.010, -0.012), smoothstep(0.10, 0.74, lum));
          float vig = smoothstep(0.95, 0.24, r2 * 1.42);
          col *= mix(0.30, 1.0, vig);
          float grain = (hash12(vUv * vec2(1080.0, 1920.0) + uTime * 31.0) - 0.5) * 0.022;
          gl_FragColor = vec4(clamp(col + grain, 0.0, 1.0), 1.0);
        }
      `,
    };
    const gradePass = new ShaderPass(CinemaGradeShader);
    composer.addPass(gradePass);
    composer.addPass(new OutputPass());

    // ---------------------------------------------------------------- PROCEDURAL WOOD & PLASTER PBR TEXTURES
    function makeWoodTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#3b281c'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 160; i++) {
        g.strokeStyle = i % 2 === 0 ? 'rgba(20,12,8,0.32)' : 'rgba(92,62,40,0.22)';
        g.lineWidth = 2 + (i % 4);
        const y = (i / 160) * 512;
        g.beginPath(); g.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x * 0.03 + i) * 4);
        g.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function makePlasterTex() {
      const c = document.createElement('canvas'); c.width = 512; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#182232'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 1600; i++) {
        const x = ((Math.sin(i * 19.3) * 9187) % 1 + 1) % 1 * 512;
        const y = ((Math.cos(i * 41.7) * 6311) % 1 + 1) % 1 * 512;
        g.fillStyle = i % 2 === 0 ? 'rgba(38,52,72,0.22)' : 'rgba(10,14,22,0.25)';
        g.fillRect(x, y, 4 + (i % 14), 3 + (i % 10));
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      return tex;
    }

    const woodTex = makeWoodTex();
    const plasterTex = makePlasterTex();

    // ---------------------------------------------------------------- CINEMA LIGHTING
    scene.add(new THREE.HemisphereLight(0x94a3b8, 0x0b101b, 0.85));

    const moonSpot = new THREE.DirectionalLight(0x7fb4ff, 2.8);
    moonSpot.position.set(-4.5, 6.2, -5.0);
    scene.add(moonSpot);

    const keySpot = new THREE.SpotLight(0xffdfb0, 48, 22, Math.PI * 0.30, 0.55, 1.3);
    keySpot.position.set(1.8, 5.2, 3.6);
    keySpot.castShadow = true;
    keySpot.shadow.mapSize.set(1024, 1024);
    scene.add(keySpot);

    const lampLight = new THREE.PointLight(0xffa94d, 9.5, 7.5);
    lampLight.position.set(-0.82, 1.55, 0.60);
    scene.add(lampLight);

    const stairGlowLight = new THREE.PointLight(0xfbbf24, 0.0, 9.0);
    stairGlowLight.position.set(0.55, 2.4, -1.55);
    scene.add(stairGlowLight);

    // ---------------------------------------------------------------- ARCHITECTURAL NIGHT STUDY ROOM
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.72, metalness: 0.08 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 14),
      new THREE.MeshStandardMaterial({ map: plasterTex, roughness: 0.86 })
    );
    backWall.position.set(0, 6.5, -4.4);
    backWall.receiveShadow = true;
    scene.add(backWall);

    // Glowing Night Moon + Rain Outside Window
    const moonDisc = new THREE.Mesh(
      new THREE.CircleGeometry(1.15, 32),
      new THREE.MeshBasicMaterial({ color: 0xe2e8f0 })
    );
    moonDisc.position.set(-1.4, 3.8, -5.8);
    scene.add(moonDisc);

    // Volumetric Moonlight Shaft
    const rayCanvas = document.createElement('canvas'); rayCanvas.width = 128; rayCanvas.height = 128;
    const rg = rayCanvas.getContext('2d').createLinearGradient(0, 0, 0, 128);
    rg.addColorStop(0.0, 'rgba(147, 197, 253, 0.80)');
    rg.addColorStop(1.0, 'rgba(147, 197, 253, 0.0)');
    rayCanvas.getContext('2d').fillStyle = rg;
    rayCanvas.getContext('2d').fillRect(0, 0, 128, 128);
    const moonShaft = new THREE.Mesh(
      new THREE.ConeGeometry(2.8, 7.5, 20, 1, true),
      new THREE.MeshBasicMaterial({
        map: new THREE.CanvasTexture(rayCanvas),
        color: 0x93c5fd, transparent: true, opacity: 0.10,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide,
      })
    );
    moonShaft.position.set(-0.6, 2.8, -1.8);
    moonShaft.rotation.x = 0.45;
    scene.add(moonShaft);

    // Solid Timber Study Desk (Foreground Focal Zone: z = 0.75, width 2.55, height 0.92)
    const deskMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.55, metalness: 0.08 });
    const deskTop = new THREE.Mesh(new THREE.BoxGeometry(2.65, 0.12, 1.15), deskMat);
    deskTop.position.set(-0.05, 0.88, 0.75);
    deskTop.castShadow = true; deskTop.receiveShadow = true;
    scene.add(deskTop);
    for (const lx of [-1.22, 1.12]) {
      for (const lz of [0.28, 1.22]) {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.88, 0.09), deskMat);
        leg.position.set(lx, 0.44, lz);
        leg.castShadow = true;
        scene.add(leg);
      }
    }

    // ---------------------------------------------------------------- 3 SLATE MONOLITH BLOCKS -> 5 GOLDEN STAIRS (MID-BACKSTAGE: x = 0.55, z = -1.65)
    function makeLabelTex(line) {
      const c = document.createElement('canvas'); c.width = 512; c.height = 192;
      const g = c.getContext('2d');
      g.fillStyle = '#1e293b'; g.fillRect(0, 0, 512, 192);
      g.strokeStyle = '#94a3b8'; g.lineWidth = 6; g.strokeRect(8, 8, 496, 176);
      g.fillStyle = '#f8fafc'; g.font = '900 34px Inter, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(line, 256, 96);
      return new THREE.CanvasTexture(c);
    }

    const blockLabels = ['KAL SE', 'MERE BAS KA NAHI', 'ZIKR BAND'];
    const blocks = blockLabels.map((lbl, idx) => {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(1.18, 0.44, 0.58),
        new THREE.MeshStandardMaterial({ map: makeLabelTex(lbl), roughness: 0.58, metalness: 0.15 })
      );
      m.position.set(0.58, 5.2, -1.55 + idx * 0.03);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
      return m;
    });

    const stairGroup = new THREE.Group();
    stairGroup.visible = false;
    scene.add(stairGroup);
    const stairEdges = [];
    for (let i = 0; i < 5; i++) {
      const step = new THREE.Mesh(
        new THREE.BoxGeometry(1.30, 0.24, 0.46),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.48, metalness: 0.18 })
      );
      step.position.set(0.58, 0.24 + i * 0.30, -1.25 - i * 0.40);
      step.castShadow = true; step.receiveShadow = true;
      const edgeMat = new THREE.MeshStandardMaterial({ color: 0x475569, emissive: 0x000000, emissiveIntensity: 0 });
      const edge = new THREE.Mesh(new THREE.BoxGeometry(1.32, 0.05, 0.06), edgeMat);
      edge.position.set(0.58, 0.36 + i * 0.30, -1.02 - i * 0.40);
      stairGroup.add(step, edge);
      stairEdges.push(edgeMat);
    }

    // ---------------------------------------------------------------- DESK PROPS: NOTEBOOK + AMBER INK + PEN + FLIPPING PHONE
    const notebookGroup = new THREE.Group();
    notebookGroup.position.set(-0.08, 0.96, 0.78);
    scene.add(notebookGroup);
    const coverMat = new THREE.MeshStandardMaterial({ color: 0x7c2d12, roughness: 0.52 });
    const pageMat = new THREE.MeshStandardMaterial({ color: 0xfef3c7, roughness: 0.85 });
    const coverL = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.56), coverMat);
    coverL.position.x = -0.21;
    const pageL = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.025, 0.52), pageMat);
    pageL.position.set(-0.20, 0.02, 0);
    const rightCoverPivot = new THREE.Group();
    const coverR = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.56), coverMat);
    coverR.position.x = 0.21;
    const pageR = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.025, 0.52), pageMat);
    pageR.position.set(0.20, 0.02, 0);
    rightCoverPivot.add(coverR, pageR);
    notebookGroup.add(coverL, pageL, rightCoverPivot);

    const inkLine = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.008, 0.024),
      new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
    );
    inkLine.position.set(0.14, 1.00, 0.76);
    inkLine.scale.x = 0.001;
    inkLine.visible = false;
    scene.add(inkLine);

    const pen = new THREE.Mesh(
      new THREE.CylinderGeometry(0.012, 0.008, 0.24, 10),
      new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.8, roughness: 0.2 })
    );
    pen.rotation.z = Math.PI / 3;
    pen.position.set(0.30, 1.00, 0.84);
    scene.add(pen);

    const phoneGroup = new THREE.Group();
    phoneGroup.position.set(0.56, 0.96, 0.78);
    const phoneBody = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.024, 0.42), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.28, metalness: 0.7 }));
    const phoneScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.19, 0.37), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
    phoneScreen.rotation.x = -Math.PI / 2; phoneScreen.position.y = 0.013;
    phoneGroup.add(phoneBody, phoneScreen);
    scene.add(phoneGroup);

    // Floating warm golden dust motes
    const mCount = 260;
    const mGeo = new THREE.BufferGeometry();
    const mArr = new Float32Array(mCount * 3);
    for (let i = 0; i < mCount; i++) {
      mArr[i * 3] = Math.sin(i * 19.1) * 4.2;
      mArr[i * 3 + 1] = 0.3 + ((i % 35) / 35) * 3.8;
      mArr[i * 3 + 2] = Math.cos(i * 43.7) * 3.2 - 0.5;
    }
    mGeo.setAttribute('position', new THREE.BufferAttribute(mArr, 3));
    const motes = new THREE.Points(mGeo, new THREE.PointsMaterial({
      color: 0xfde68a, size: 0.032, transparent: true, opacity: 0.58,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    scene.add(motes);

    // ---------------------------------------------------------------- LOAD CC0 REAL HUMAN + FURNITURE ASSETS
    const loader = new GLTFLoader();
    const loadGLTF = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));
    const TIMELINE = await (await fetch('./timeline.json')).json();

    function fitHeight(gltfScene, targetH) {
      const g = new THREE.Group();
      const inner = SkeletonUtils.clone(gltfScene);
      const box = new THREE.Box3().setFromObject(inner);
      const sz = new THREE.Vector3(), ct = new THREE.Vector3();
      box.getSize(sz); box.getCenter(ct);
      const s = targetH / Math.max(sz.y, 0.001);
      inner.scale.setScalar(s);
      inner.position.set(-ct.x * s, -box.min.y * s, -ct.z * s);
      inner.traverse((o) => {
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      });
      g.add(inner);
      return { g, inner };
    }

    const [humanGltf, lampGltf, chairGltf, booksGltf, rugGltf, shelfGltf] = await Promise.all([
      loadGLTF('/assets/casual_hoodie.glb'),
      loadGLTF('/assets/lamp_table.glb'),
      loadGLTF('/assets/armchair_pillows.glb'),
      loadGLTF('/assets/book_set.glb'),
      loadGLTF('/assets/rug_rectangle_a.glb'),
      loadGLTF('/assets/shelf_b_large_decorated.glb'),
    ]);

    // Furnish Study Room cleanly (zero overlaps!)
    const rug = fitHeight(rugGltf.scene, 0.05).g;
    rug.scale.set(2.2, 1.0, 2.2);
    rug.position.set(-0.2, 0.005, 0.2);
    scene.add(rug);

    const chair = fitHeight(chairGltf.scene, 1.05).g;
    chair.position.set(-1.35, 0.0, -0.35);
    chair.rotation.y = 0.55;
    scene.add(chair);

    const shelf = fitHeight(shelfGltf.scene, 2.35).g;
    shelf.position.set(-1.85, 0.0, -3.55);
    shelf.rotation.y = 0.15;
    scene.add(shelf);

    const lamp = fitHeight(lampGltf.scene, 0.52).g;
    lamp.position.set(-0.88, 0.94, 0.52);
    lamp.traverse((o) => {
      if (o.isMesh && o.material && /shade|lamp|white|light/i.test(o.material.name || o.name)) {
        o.material = o.material.clone();
        o.material.emissive = new THREE.Color(0xffb347);
        o.material.emissiveIntensity = 1.4;
      }
    });
    scene.add(lamp);

    const books = fitHeight(booksGltf.scene, 0.24).g;
    books.position.set(0.82, 0.94, 0.52);
    books.rotation.y = -0.35;
    scene.add(books);

    // Real Animated CC0 Human Actor (replaces stickman!)
    const humanRes = fitHeight(humanGltf.scene, 1.76);
    const human = humanRes.g;
    human.traverse((o) => {
      if (o.isMesh && o.material) {
        o.material = o.material.clone();
        if (o.material.name === 'Purple') o.material.color.setHex(0xd97706); // Warm copper-amber hoodie!
        if (o.material.name === 'LightBlue') o.material.color.setHex(0x1e293b); // Slate trousers!
      }
    });
    scene.add(human);

    const humanMixer = new THREE.AnimationMixer(humanRes.inner);
    const findClip = (re, fb) => humanGltf.animations.find((a) => re.test(a.name)) || humanGltf.animations[fb || 0];
    const idleNeutralAct = humanMixer.clipAction(findClip(/Idle_Neutral/i, 0));
    const interactAct = humanMixer.clipAction(findClip(/Interact/i, 0));
    const idleProudAct = humanMixer.clipAction(findClip(/^Idle$/i, 0));
    idleNeutralAct.play();
    interactAct.play();
    idleProudAct.play();

    const lerp = (a, b, u) => a + (b - a) * Math.min(1, Math.max(0, u));
    const smoothstep = (e0, e1, x) => {
      const u = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
      return u * u * (3 - 2 * u);
    };

    function formatCaption(text, tLocal, dur) {
      const words = text.split(' ');
      const progress = Math.min(1, Math.max(0, tLocal / Math.max(dur * 0.90, 0.2)));
      const activeIdx = Math.min(words.length - 1, Math.floor(progress * words.length));
      const winStart = Math.max(0, Math.floor(activeIdx / 6) * 6);
      return words.slice(winStart, winStart + 6).map((w, i) => (winStart + i <= activeIdx ? `<span class="hi">${w}</span>` : w)).join(' ');
    }

    window.__MONARCH_FRAME__ = (f) => {
      const fps = TIMELINE.fps || 30;
      const t = f / fps;
      gradePass.uniforms.uTime.value = t;
      motes.position.y = Math.sin(t * 0.4) * 0.14;

      const beats = TIMELINE.beats;
      let b = beats[beats.length - 1];
      for (let i = 0; i < beats.length; i++) {
        if (t >= beats[i].start && t < beats[i].end) { b = beats[i]; break; }
      }
      document.getElementById('beatTag').textContent = b.tag;
      document.getElementById('captionsText').innerHTML = formatCaption(b.caption, t - b.start, b.end - b.start);

      // Human animation blending + staging (zero clipping!)
      const interactU = smoothstep(640, 710, f) * (1 - smoothstep(940, 990, f));
      const proudU = smoothstep(963, 1050, f);
      idleNeutralAct.setEffectiveWeight(Math.max(0, 1 - interactU - proudU));
      interactAct.setEffectiveWeight(interactU);
      idleProudAct.setEffectiveWeight(proudU);
      humanMixer.setTime(t);

      // Human stands beside/behind desk on left (-0.82, 0.0, 0.08), turning toward desk then tall toward lens
      human.position.set(lerp(-0.88, -0.78, proudU), 0.0, lerp(0.12, 0.28, proudU));
      human.rotation.y = lerp(0.55, lerp(0.85, 0.16, proudU), Math.max(interactU, proudU));

      // Slate blocks slam down cleanly in mid-background, then transform into 5 golden stairs!
      const showStairs = f >= 546;
      blocks.forEach((blk) => { blk.visible = !showStairs; });
      stairGroup.visible = showStairs;

      if (!showStairs) {
        const dropFrames = [279, 314, 363];
        const targetY = [0.22, 0.67, 1.12];
        blocks.forEach((blk, idx) => {
          const df = dropFrames[idx];
          if (f < df - 12) {
            blk.position.set(0.58, 6.2, -1.55);
          } else {
            const du = smoothstep(df - 12, df, f);
            const bounce = f >= df && f < df + 8 ? Math.sin(((f - df) / 8) * Math.PI) * 0.06 : 0;
            blk.position.set(0.58, lerp(5.4, targetY[idx], du) + bounce, -1.55 + idx * 0.02);
          }
        });
        stairGlowLight.intensity = 0;
      } else {
        const stepFrames = [662, 674, 687, 700, 712];
        let totalLit = 0;
        stairEdges.forEach((em, idx) => {
          const lit = smoothstep(stepFrames[idx] - 2, stepFrames[idx] + 5, f);
          totalLit += lit;
          em.color.setHex(lit > 0.1 ? 0xfbbf24 : 0x475569);
          em.emissive.setHex(0xf59e0b);
          em.emissiveIntensity = lit * 2.2;
        });
        stairGlowLight.intensity = totalLit * 2.8;
      }

      // Notebook opens at f=675
      rightCoverPivot.rotation.z = lerp(Math.PI, 0, smoothstep(665, 690, f));

      // Phone flips screen-down at f=844
      const flipU = smoothstep(833, 845, f);
      phoneGroup.rotation.z = lerp(0, Math.PI, flipU);
      phoneGroup.position.y = 0.96 + Math.sin(flipU * Math.PI) * 0.14;

      // Amber ink writes across page on f=933..975
      if (f >= 933) {
        inkLine.visible = true;
        const wU = smoothstep(933, 975, f);
        inkLine.scale.x = Math.max(0.01, wU);
        pen.position.set(0.02 + wU * 0.26, 1.07, 0.76);
      } else {
        inkLine.visible = false;
        pen.position.set(0.30, 1.00, 0.84);
      }

      // 8-Beat Portrait-Safe Camera Choreography (zero edge clipping!)
      if (f < 267) {
        const u = smoothstep(0, 267, f);
        camera.position.set(lerp(-0.4, -0.55, u), lerp(1.65, 1.55, u), lerp(3.85, 3.05, u));
        camera.lookAt(-0.55, 1.25, 0.15);
      } else if (f < 398) {
        // Bahaanay: Wide enough to keep BOTH human + all 3 blocks inside 1080x1920!
        const u = smoothstep(267, 398, f);
        camera.position.set(lerp(0.1, 0.25, u), 1.65, lerp(4.15, 3.95, u));
        camera.lookAt(0.15, 1.05, -0.55);
      } else if (f < 537) {
        const u = smoothstep(398, 537, f);
        camera.position.set(lerp(0.25, -0.65, u), 1.60, lerp(3.95, 3.55, u));
        camera.lookAt(-0.15, 1.15, -0.35);
      } else if (f < 706) {
        // Golden Stairs Reveal
        const u = smoothstep(537, 706, f);
        camera.position.set(lerp(-0.5, 0.2, u), lerp(1.70, 1.95, u), lerp(3.85, 3.65, u));
        camera.lookAt(0.22, 1.15, -0.85);
      } else if (f < 833) {
        // Desk + Notebook close-up
        const u = smoothstep(706, 833, f);
        camera.position.set(lerp(0.2, 0.05, u), lerp(1.95, 1.72, u), lerp(3.65, 2.35, u));
        camera.lookAt(0.02, 1.02, 0.72);
      } else if (f < 933) {
        // Phone flip face-down
        const u = smoothstep(833, 933, f);
        camera.position.set(lerp(0.05, 0.38, u), lerp(1.72, 1.62, u), lerp(2.35, 2.15, u));
        camera.lookAt(0.32, 0.98, 0.76);
      } else if (f < 1125) {
        // Hero stands proud + amber stairs glow behind
        const u = smoothstep(933, 1125, f);
        camera.position.set(lerp(0.32, -0.25, u), lerp(1.62, 1.72, u), lerp(2.25, 3.75, u));
        camera.lookAt(lerp(-0.10, -0.28, u), lerp(1.05, 1.32, u), 0.10);
      } else {
        const u = smoothstep(1125, 1200, f);
        camera.position.set(lerp(-0.25, -0.10, u), 1.72, lerp(3.75, 3.45, u));
        camera.lookAt(-0.12, 1.32, -0.20);
      }

      composer.render();
    };

    window.__MONARCH_READY__ = true;
  </script>
