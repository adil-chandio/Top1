<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const W = 1080, H = 1920;

/* ---------------------------------------------------------------- renderer */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: false, preserveDrawingBuffer: true,
  alpha: false, powerPreference: 'high-performance',
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a12);
scene.fog = new THREE.FogExp2(0x070a12, 0.014);

const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 400);

/* ------------------------------------------------------------------ palettes
   Each beat carries a palette name in the timeline. These are the exact
   moods the render script had, expressed as light rigs.                     */
const PALETTES = {
  moon:    { bg:0x121a2e, fog:0x121a2e, hemiA:0x9dc4ff, hemiB:0x05070f,
             key:0xbfd6ff, keyI:2.6, rim:0x6f9dff, rimI:2.2, fill:0xffc98a, fillI:0.9,  fogD:0.020 },
  amber:   { bg:0x241408, fog:0x241408, hemiA:0xffcf9a, hemiB:0x0a0603,
             key:0xffc073, keyI:3.2, rim:0xff8a3d, rimI:2.0, fill:0x7fa8ff, fillI:0.7,  fogD:0.024 },
  crimson: { bg:0x1e0a12, fog:0x1e0a12, hemiA:0xff9a8a, hemiB:0x080305,
             key:0xff5a4a, keyI:3.0, rim:0xff2030, rimI:2.6, fill:0x6f9dff, fillI:0.8,  fogD:0.022 },
  dusk:    { bg:0x2a1418, fog:0x2a1418, hemiA:0xffb37a, hemiB:0x0d0608,
             key:0xff9a5a, keyI:3.4, rim:0xff4a6a, rimI:2.2, fill:0x8fb0ff, fillI:0.6,  fogD:0.018 },
  gold:    { bg:0x241a08, fog:0x241a08, hemiA:0xffe0a0, hemiB:0x0a0702,
             key:0xffd166, keyI:3.6, rim:0xff9a2a, rimI:2.4, fill:0x9db8ff, fillI:0.7,  fogD:0.016 },
  night:   { bg:0x0a0f1e, fog:0x0a0f1e, hemiA:0x7f9fd8, hemiB:0x02040a,
             key:0xa8c4ff, keyI:2.2, rim:0x4a6fd8, rimI:2.8, fill:0xffd08a, fillI:1.0,  fogD:0.026 },
  dawn:    { bg:0x222838, fog:0x222838, hemiA:0xffd0b0, hemiB:0x0a0d14,
             key:0xffe0c0, keyI:3.0, rim:0x8fb0ff, rimI:1.8, fill:0xffb080, fillI:1.2,  fogD:0.017 },
};

/* ------------------------------------------------------------------- lights */
const hemi   = new THREE.HemisphereLight(0xffffff, 0x2a1d12, 1.9);
const keyLt  = new THREE.DirectionalLight(0xffffff, 3.0);
const rimLt  = new THREE.DirectionalLight(0xffffff, 2.4);
const fillLt = new THREE.DirectionalLight(0xffffff, 1.0);
const gateLt = new THREE.PointLight(0xffb060, 0, 26, 2);   // warm gate lamp
const moonLt = new THREE.PointLight(0xbfd6ff, 0, 90, 1.6); // cold moon pool
scene.add(hemi, keyLt, rimLt, fillLt, gateLt, moonLt, keyLt.target, rimLt.target);

/* --------------------------------------------------------------- shared geo */
function displacedPlane(w, d, seg, amp, freq, color, rough, metal) {
  const g = new THREE.PlaneGeometry(w, d, seg, seg);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, Math.sin(x * freq) * amp + Math.cos(y * freq * 0.85) * amp * 0.9
             + Math.sin((x + y) * freq * 2.1) * amp * 0.28);
  }
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
  const mesh = new THREE.Mesh(g, m);
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

/* the field: dark tilled earth, ridged in rows */
const field = displacedPlane(120, 120, 90, 0.22, 0.60, 0x2b2018, 0.97, 0.01);
field.position.y = -0.06;
scene.add(field);

/* a second, closer furrow bank so the aerial has depth under it */
const bank = displacedPlane(46, 16, 34, 0.30, 0.70, 0x33261c, 0.97, 0.01);
bank.position.set(-16, 0.06, -30);
scene.add(bank);

/* ------------------------------------------------------------- potato prop */
function potato(scale = 1) {
  const g = new THREE.SphereGeometry(0.30 * scale, 12, 9);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = 1 + Math.sin(x * 7.1 + y * 5.3) * 0.10 + Math.cos(z * 6.7) * 0.08;
    p.setXYZ(i, x * n * 1.28, y * n * 0.86, z * n);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(
    g,
    new THREE.MeshStandardMaterial({ color: 0xa9763f, roughness: 0.78, metalness: 0.03 })
  );
}

const potatoes = [];
const rnd = (i) => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
/* Potatoes read as produce only at ~8 cm and only when they sit in furrow
   lines. Bigger than that and they become boulders filling the frame. */
for (let i = 0; i < 120; i++) {
  const s = 0.16 + rnd(i) * 0.09;               // 8-13 cm across
  const m = potato(s);
  const row = Math.floor(i / 12), col = i % 12;
  m.position.set(
    col * 0.34 - 1.9 + rnd(i + 7) * 0.10,
    0.028,
    -2.6 - row * 0.52 + rnd(i + 13) * 0.12
  );
  m.rotation.set(rnd(i + 3) * 0.5, rnd(i + 5) * 6.28, rnd(i + 9) * 0.3);
  scene.add(m);
  potatoes.push(m);
}

/* ---------------------------------------------------------- the iron gate */
const gate = new THREE.Group();
const barMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, roughness: 0.42, metalness: 0.92 });
for (let i = 0; i < 15; i++) {
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 5.2, 10), barMat);
  bar.position.set(-5.6 + i * 0.8, 2.6, 0);
  gate.add(bar);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.42, 10), barMat);
  tip.position.set(-5.6 + i * 0.8, 5.4, 0);
  gate.add(tip);
}
for (const y of [0.45, 2.5, 4.7]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(11.5, 0.15, 0.15), barMat);
  rail.position.set(0, y, 0);
  gate.add(rail);
}
gate.position.set(0, 0, -20);
scene.add(gate);

/* ------------------------------------------------------------ soldier stand */
const soldierGrp = new THREE.Group();
scene.add(soldierGrp);

/* --------------------------------------------------------- atmosphere bits */
const dustCount = 900;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3]     = (rnd(i * 3) - 0.5) * 70;
  dustPos[i * 3 + 1] = rnd(i * 3 + 1) * 16 + 0.3;
  dustPos[i * 3 + 2] = (rnd(i * 3 + 2) - 0.5) * 70;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xffd9a0, size: 0.075, transparent: true, opacity: 0.42,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

/* moon disc + halo, used by the night beats */
const moonDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.4, 48),
  new THREE.MeshBasicMaterial({ color: 0xdfe9ff, transparent: true, opacity: 0.85 })
);
moonDisc.position.set(14, 26, -58);
scene.add(moonDisc);
const moonHalo = new THREE.Mesh(
  new THREE.CircleGeometry(9.5, 48),
  new THREE.MeshBasicMaterial({ color: 0x8fb0ff, transparent: true, opacity: 0.10,
    blending: THREE.AdditiveBlending, depthWrite: false })
);
moonHalo.position.copy(moonDisc.position).add(new THREE.Vector3(0, 0, 0.5));
scene.add(moonHalo);

/* --------------------------------------------------------------- GLB actors */
/* The shipped GLBs are Draco-compressed, so the loader needs the decoder.
   Without it every model fails to parse and the beats silently see nulls. */
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('/vendor/three/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const loadGLTF = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));

let monarch = null, mask = null, guardA = null, guardB = null;
let plantA = null, lantern = null, candleHolder = null;

function normalize(root, targetLen, yOff = 0) {
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(), center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  const s = targetLen / Math.max(size.x, size.y, size.z, 0.001);
  root.scale.setScalar(s);
  root.position.set(-center.x * s, -center.y * s + yOff, -center.z * s);
  root.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const src = o.material;
    /* Transmission materials make three.js run a second full-screen render
       pass per object. Under SwiftShader that is ruinous, and the look is
       indistinguishable at this size, so translucent props come through as
       plain standard surfaces instead. */
    o.material = new THREE.MeshStandardMaterial({
      color: src.color ? src.color.clone() : new THREE.Color(0x999999),
      map: src.map || null,
      roughness: Math.min(src.roughness ?? 0.6, 0.7),
      metalness: src.metalness ?? 0.0,
      transparent: false,
      side: THREE.FrontSide,
    });
    o.material.name = src.name || '';
    o.castShadow = false; o.receiveShadow = false;
  });
  return root;
}

/* Asset bounds are the difference between a mask that sits on a face and one
   that ends up buried inside a skull. Dump them so placement is measured. */
/* venice_mask.glb ships display plaques alongside the mask itself, so its
   whole-scene bounding box is meaningless for placement. Keep the largest
   mesh and throw the rest away — same filter the Cycles path uses. */
function largestMeshOnly(root) {
  const meshes = [];
  root.traverse((o) => { if (o.isMesh) meshes.push(o); });
  if (meshes.length < 2) return root;
  let best = meshes[0], bestV = -1;
  for (const m of meshes) {
    const v = m.geometry?.attributes?.position?.count ?? 0;
    if (v > bestV) { bestV = v; best = m; }
  }
  /* Remove the other meshes from their parents rather than re-parenting the
     winner, so the ancestor transform chain (which carries the real scale)
     survives. Reparenting a bare mesh loses it and the asset shrinks to
     centimetres. */
  for (const m of meshes) {
    if (m !== best && m.parent) m.parent.remove(m);
  }
  return root;
}

function boundsOf(root) {
  root.updateWorldMatrix(true, true);
  const b = new THREE.Box3();
  const v = new THREE.Vector3();
  root.traverse((o) => {
    if (!o.isMesh || !o.geometry) return;
    const pos = o.geometry.attributes.position;
    if (!pos) return;
    for (let i = 0; i < pos.count; i += Math.max(1, Math.floor(pos.count / 4000))) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      b.expandByPoint(v);
    }
  });
  if (b.isEmpty()) b.setFromObject(root);
  const sz = new THREE.Vector3(), c = new THREE.Vector3();
  b.getSize(sz); b.getCenter(c);
  return { size: sz.toArray().map(v => +v.toFixed(3)),
           center: c.toArray().map(v => +v.toFixed(3)),
           min: b.min.toArray().map(v => +v.toFixed(3)),
           max: b.max.toArray().map(v => +v.toFixed(3)) };
}

window.__PEHRA_BOUNDS__ = (kind) => {
  const src = { head: window.__G_HEAD__, mask: window.__G_MASK__,
                soldier: window.__G_SOLDIER__, lantern: window.__G_LANTERN__,
                plant: window.__G_PLANT__ }[kind];
  return src ? boundsOf(src.scene) : null;
};

window.__PEHRA_INIT__ = async (timeline) => {
  const [headG, maskG, soldierG, plantG, lanternG, holderG] = await Promise.all([
    loadGLTF('/assets/LeePerrySmith.glb'),
    loadGLTF('/assets/venice_mask.glb'),
    loadGLTF('/assets/Soldier.glb'),
    loadGLTF('/assets/DiffuseTransmissionPlant.glb'),
    loadGLTF('/assets/Lantern.glb'),
    loadGLTF('/assets/GlassHurricaneCandleHolder.glb'),
  ]);
  window.__G_HEAD__ = headG; window.__G_MASK__ = maskG;
  window.__G_SOLDIER__ = soldierG; window.__G_LANTERN__ = lanternG;
  window.__G_PLANT__ = plantG;

  /* The venetian_mask.glb is a 3 cm ornamental curio, not a wearable mask, so
     it cannot simply be stretched over a head — it reads as a giant bauble.
     Instead the monarch wears it as a face plate: the curio is scaled to the
     head's actual face width and seated just in front of the nose, which is
     how the Cycles pass wears it too. */
  monarch = new THREE.Group();
  const head = SkeletonUtils.clone(headG.scene);
  const hb = boundsOf(head);
  const headH = hb.size[1];
  const HEAD_SCALE = 1.15 / headH;
  head.scale.setScalar(HEAD_SCALE);
  head.position.set(0, 0.62 - hb.center[1] * HEAD_SCALE, 0);
  monarch.add(head);

  mask = SkeletonUtils.clone(maskG.scene);
  const srgb = new THREE.Group();       // carrier so the curio's own offset survives
  srgb.add(mask);
  const mb = boundsOf(mask);
  const faceW = hb.size[0] * HEAD_SCALE;          // how wide the head is, world m
  const maskScale = (faceW * 0.55) / Math.max(mb.size[0], 1e-6);
  srgb.scale.setScalar(maskScale);
  /* put the curio's centre onto the nose, then push it forward of the face */
  srgb.position.set(
    -mb.center[0] * maskScale,
    0.86 - mb.center[1] * maskScale,
    hb.max[2] * HEAD_SCALE + 0.02
  );
  monarch.add(srgb);
  monarch.position.set(0, 1.05, -8.5);
  scene.add(monarch);
  window.__MASK_PLACED__ = { headSize: hb.size.map(v=>+v.toFixed(2)),
                             curioSize: mb.size.map(v=>+v.toFixed(3)),
                             headScale:+HEAD_SCALE.toFixed(3),
                             maskScale:+maskScale.toFixed(2),
                             faceW:+faceW.toFixed(2),
                             maskPos: srgb.position.toArray().map(v=>+v.toFixed(2)) };
  /* two soldiers flanking the gate */
  const mk = (x, z, rotY, targetLen) => {
    const g = new THREE.Group();
    const inner = SkeletonUtils.clone(soldierG.scene);
    normalize(inner, targetLen, 0);
    g.add(inner);
    g.position.set(x, 0, z);
    g.rotation.y = rotY;
    scene.add(g);
    return g;
  };
  guardA = mk(-6.4, -14.5, 0.52, 2.55);
  guardB = mk( 6.4, -14.5, -0.52, 2.55);

  /* vegetation along the furrows */
  plantA = new THREE.Group();
  for (let i = 0; i < 6; i++) {
    const p = normalize(SkeletonUtils.clone(plantG.scene), 0.62 + rnd(i) * 0.35, 0);
    p.position.set((i % 3) * 2.4 - 2.6 + rnd(i + 2) * 0.6, 0, -Math.floor(i / 3) * 2.4 - 3.6);
    p.rotation.y = rnd(i + 4) * 6.28;
    plantA.add(p);
  }
  scene.add(plantA);

  /* lantern + hurricane holder as the practical light source */
  lantern = normalize(SkeletonUtils.clone(lanternG.scene), 1.15, 0);
  lantern.position.set(2.9, 0, -5.2);
  scene.add(lantern);
  candleHolder = normalize(SkeletonUtils.clone(holderG.scene), 0.34, 0);
  candleHolder.position.set(2.9, 1.02, -5.2);
  scene.add(candleHolder);
};

/* ----------------------------------------------------------------- palette */
function applyPalette(name) {
  const p = PALETTES[name] || PALETTES.moon;
  scene.background = new THREE.Color(p.bg);
  scene.fog = new THREE.FogExp2(p.fog, p.fogD);
  hemi.color.setHex(p.hemiA); hemi.groundColor.setHex(p.hemiB); hemi.intensity = 1.35;
  keyLt.color.setHex(p.key);   keyLt.intensity = p.keyI;
  rimLt.color.setHex(p.rim);   rimLt.intensity = p.rimI;
  fillLt.color.setHex(p.fill); fillLt.intensity = p.fillI;
  keyLt.visible = rimLt.visible = fillLt.visible = true;
}

/* ------------------------------------------------------------------- beats
   One block per timeline beat id. Each receives local progress t in [0,1)
   and is responsible for camera + actor motion. This is where the film's
   movement lives, so every beat has a deliberate move rather than a drift.  */
const BEATS = {
  B01_AERIAL_FIELD(t) {                        // high drone drift over the field
    const e = t * t * (3 - 2 * t);
    camera.position.set(-7 + e * 6, 13.0 - e * 2.0, 12 - e * 5);
    camera.lookAt(0.5, 0.6, -10);
    keyLt.position.set(-16, 24, 10); keyLt.intensity = 2.9;
    rimLt.position.set(18, 10, -30);  rimLt.intensity = 2.4;
    gateLt.visible = false; moonLt.visible = true; moonLt.intensity = 7;
    moonLt.position.set(14, 26, -58);
    dust.material.opacity = 0.30;
  },
  B02_GUARDED_FIELD(t) {                       // low track along the guards
    const e = t * t * (3 - 2 * t);
    camera.position.set(-9.0 + e * 6.0, 1.45, -9.0 + e * 3.0);
    camera.lookAt(-4.5 + e * 4.0, 1.9, -14.5);
    keyLt.position.set(-8, 7, -6); keyLt.intensity = 2.4;
    rimLt.position.set(10, 5, -24); rimLt.intensity = 2.8;
    gateLt.visible = true; gateLt.intensity = 30;
    moonLt.visible = false;
    dust.material.opacity = 0.24;
  },
  B03_MASKED_TITLE(t) {                        // masked monarch push-in
    const e = 1 - Math.pow(1 - t, 3);
    camera.position.set(0.1, 1.95 + e * 0.08, -4.6 - e * 2.2);
    camera.lookAt(0, 1.72, -8.5);
    monarch.rotation.y = Math.sin(t * 3.2) * 0.09;
    keyLt.position.set(-5, 5, -4); keyLt.intensity = 3.1;
    rimLt.position.set(5, 3.4, -13); rimLt.intensity = 3.0;
    gateLt.visible = true; gateLt.intensity = 30;
    moonLt.visible = false;
    dust.material.opacity = 0.26;
  },
  B04_HUNGRY_PARIS(t) {                        // wide starving city at dusk
    const e = t * t * (3 - 2 * t);
    camera.position.set(13 - e * 6, 5.2, 16 - e * 6);
    camera.lookAt(-1, 1.6, -9);
    keyLt.position.set(20, 8, 8); keyLt.intensity = 3.0;
    rimLt.position.set(-18, 6, -20); rimLt.intensity = 2.2;
    gateLt.visible = true; gateLt.intensity = 20;
    moonLt.visible = false;
    dust.material.opacity = 0.20;
  },
  B05_POTATO_PROMISE(t) {                      // macro glide over the crop
    const e = t * t * (3 - 2 * t);
    camera.position.set(-1.6 + e * 1.2, 0.62, 1.0 - e * 1.8);
    camera.lookAt(0.2, 0.12, -3.2);
    keyLt.position.set(-4, 6, 5); keyLt.intensity = 2.6;
    rimLt.position.set(5, 4, -10); rimLt.intensity = 2.5;
    gateLt.visible = true; gateLt.intensity = 22;
    moonLt.visible = false;
    dust.material.opacity = 0.28;
  },
  B06_POISONED_MIND(t) {                       // the poisoned-mind insert
    const e = t * t * (3 - 2 * t);
    camera.position.set(5.5 - e * 2.0, 2.0, -2.5 - e * 2.5);
    camera.lookAt(0, 1.0, -7);
    keyLt.position.set(6, 5, 0); keyLt.intensity = 2.3;
    rimLt.position.set(-7, 4, -12); rimLt.intensity = 2.7;
    gateLt.visible = true; gateLt.intensity = 26;
    moonLt.visible = false;
    dust.material.opacity = 0.26;
  },
  B07_FREE_BASKETS(t) {                        // baskets offered in the market
    const e = t * t * (3 - 2 * t);
    camera.position.set(-4.0 + e * 3.0, 1.85, 0.5 - e * 2.2);
    camera.lookAt(0.5, 0.7, -5.0);
    keyLt.position.set(-5, 6, 3); keyLt.intensity = 2.8;
    rimLt.position.set(6, 4, -11); rimLt.intensity = 2.4;
    gateLt.visible = true; gateLt.intensity = 24;
    moonLt.visible = false;
    dust.material.opacity = 0.24;
  },
  B08_SILENT_PIVOT(t) {                        // the monarch's mask, closer
    const e = 1 - Math.pow(1 - t, 3);
    camera.position.set(-2.4 + e * 1.6, 1.92, -2.6 - e * 2.2);
    camera.lookAt(0, 1.78, -8.5);
    monarch.rotation.y = -0.16 + Math.sin(t * 2.6) * 0.12;
    keyLt.position.set(-4.5, 5, -5); keyLt.intensity = 3.0;
    rimLt.position.set(4.5, 3.6, -13); rimLt.intensity = 3.2;
    gateLt.visible = true; gateLt.intensity = 32;
    moonLt.visible = false;
    dust.material.opacity = 0.22;
  },
  B09_FORTY_ACRES(t) {                         // pull back: forty walled acres
    const e = t * t * (3 - 2 * t);
    camera.position.set(-9 + e * 5, 8.0 - e * 1.5, 9 - e * 4);
    camera.lookAt(0.5, 0.9, -11);
    keyLt.position.set(-18, 20, 8); keyLt.intensity = 2.6;
    rimLt.position.set(16, 9, -28); rimLt.intensity = 2.6;
    gateLt.visible = true; gateLt.intensity = 24;
    moonLt.visible = false;
    dust.material.opacity = 0.22;
  },
  B10_WHISPERS(t) {                            // among the people, low and close
    const e = t * t * (3 - 2 * t);
    camera.position.set(3.2 - e * 2.2, 1.62, -1.5 - e * 2.0);
    camera.lookAt(-1.0, 1.5, -8.0);
    keyLt.position.set(4, 6, 0); keyLt.intensity = 2.4;
    rimLt.position.set(-6, 4, -13); rimLt.intensity = 2.8;
    gateLt.visible = true; gateLt.intensity = 28;
    moonLt.visible = false;
    dust.material.opacity = 0.30;
  },
  B11_LAST_ORDER(t) {                          // the order, delivered
    const e = 1 - Math.pow(1 - t, 3);
    camera.position.set(0, 2.15, -3.4 - e * 1.8);
    camera.lookAt(0, 1.85, -8.5);
    monarch.rotation.y = 0.08 + Math.sin(t * 2.2) * 0.06;
    keyLt.position.set(-3, 5.5, -4); keyLt.intensity = 3.2;
    rimLt.position.set(3.5, 4, -13); rimLt.intensity = 2.8;
    gateLt.visible = true; gateLt.intensity = 34;
    moonLt.visible = false;
    dust.material.opacity = 0.24;
  },
  B12_SUNSET_WITHDRAWAL(t) {                   // dusk, the gate clears
    const e = t * t * (3 - 2 * t);
    camera.position.set(-11 + e * 8, 4.6, 12 - e * 5);
    camera.lookAt(0, 2.0, -12);
    keyLt.position.set(-20, 9, 6); keyLt.intensity = 3.4;
    rimLt.position.set(14, 5, -26); rimLt.intensity = 2.4;
    gateLt.visible = true; gateLt.intensity = 18;
    moonLt.visible = false;
    dust.material.opacity = 0.20;
  },
  B13_NIGHT_THEFT(t) {                         // night: over the wall, in
    const e = t * t * (3 - 2 * t);
    camera.position.set(6.5 - e * 4.5, 3.2 - e * 0.6, 4.0 - e * 4.0);
    camera.lookAt(-1, 1.0, -12);
    keyLt.position.set(10, 14, 2); keyLt.intensity = 1.9;
    rimLt.position.set(-12, 8, -26); rimLt.intensity = 3.0;
    gateLt.visible = false; moonLt.visible = true; moonLt.intensity = 8;
    moonLt.position.set(-10, 24, -52);
    dust.material.opacity = 0.32;
  },
  B14_EMPTY_FIELD_DAWN(t) {                    // dawn: the field is stripped
    const e = t * t * (3 - 2 * t);
    camera.position.set(-9 + e * 6, 6.5 - e * 1.5, 12 - e * 5);
    camera.lookAt(0, 0.9, -8);
    keyLt.position.set(-14, 16, 8); keyLt.intensity = 3.2;
    rimLt.position.set(12, 7, -24); rimLt.intensity = 2.2;
    gateLt.visible = false; moonLt.visible = true; moonLt.intensity = 5;
    moonLt.position.set(16, 30, -60);
    dust.material.opacity = 0.20;
  },
  B15_GRAVE_200_YEARS(t) {                     // the grave, two centuries on
    const e = t * t * (3 - 2 * t);
    camera.position.set(-2.4 + e * 1.6, 1.05, 1.6 - e * 1.8);
    camera.lookAt(0.2, 0.35, -3.2);
    keyLt.position.set(-3, 4, 3); keyLt.intensity = 2.7;
    rimLt.position.set(4, 3, -9); rimLt.intensity = 2.6;
    gateLt.visible = true; gateLt.intensity = 16;
    moonLt.visible = false;
    dust.material.opacity = 0.26;
  },
  B16_FINAL_MONARCH(t) {                       // final: the monarch, the gate
    const e = 1 - Math.pow(1 - t, 2);
    camera.position.set(0.6, 2.05, -3.0 - e * 2.4);
    camera.lookAt(0, 1.78, -8.5);
    monarch.rotation.y = Math.sin(t * 1.8) * 0.10;
    keyLt.position.set(-4, 5.6, -4.5); keyLt.intensity = 3.3;
    rimLt.position.set(4, 4.2, -13); rimLt.intensity = 3.4;
    gateLt.visible = true; gateLt.intensity = 36;
    moonLt.visible = false;
    dust.material.opacity = 0.28;
  },
};


/* fallback so no beat is ever a hard cut to nothing */
const BEAT_IDS = Object.keys(BEATS);

function beatFor(frame, timeline) {
  const shots = timeline.shots;
  for (let i = 0; i < shots.length; i++) {
    const s = shots[i];
    if (frame >= s.f_start && frame <= s.f_end) {
      const span = Math.max(1, s.f_end - s.f_start);
      return { shot: s, t: (frame - s.f_start) / span, idx: i };
    }
  }
  return { shot: shots[shots.length - 1], t: 0, idx: shots.length - 1 };
}

/* ------------------------------------------------------------- frame driver */
window.__PEHRA_FRAME__ = (frame) => {
  const { shot, t } = beatFor(frame, window.__TIMELINE__);
  applyPalette(shot.palette || 'moon');

  const fn = BEATS[shot.id];
  if (fn) fn(t, shot);

  /* subtle global motion so even a static beat breathes */
  const tt = frame / 30;
  dust.rotation.y = tt * 0.012;
  dust.position.y = Math.sin(tt * 0.7) * 0.10;
  moonHalo.material.opacity = 0.09 + Math.sin(tt * 0.9) * 0.015;
  lantern.position.y = Math.sin(tt * 1.7) * 0.012;
  if (gateLt.visible) gateLt.intensity *= 1 + Math.sin(tt * 9.0) * 0.035;

  renderer.render(scene, camera);
};

window.__SET_TIMELINE__ = (tl) => { window.__TIMELINE__ = tl; };
window.__DEBUG__ = { scene, camera, field, bank, moonDisc, moonHalo, dust, gate, monarch, guardA, guardB };
window.__HIDE__ = (name, on) => {
  const m = { field, bank, moonDisc, moonHalo, dust, gate, monarch, guardA, guardB, soldierGrp, lantern }[name];
  if (m) m.visible = !on;
};
