name: Video access diagnostic
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-video-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Capture public player diagnostics
        run: |
          python3 -m pip install -q yt-dlp
          yt-dlp --no-playlist --no-part -f 'worst[ext=mp4]/worst' -o /tmp/source.mp4 'https://www.youtube.com/watch?v=JgO-ISfpsrY' > /tmp/video-log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/video-log').read_text()[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Player diagnostic::'+s)
          PY
