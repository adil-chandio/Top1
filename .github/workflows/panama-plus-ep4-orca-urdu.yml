name: Panama-Plus EP4 Orca vs Humpback Urdu 3D Render

on:
  push:
    branches:
      - main
      - arena/2a8ad29e-top1
    paths:
      - 'panama_plus_3d_kit/ep4_orca_urdu/**'
      - '.github/workflows/panama-plus-ep4-orca-urdu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-ep4-orca-urdu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Python Audio Stack, Earshot SFX, Three.js & Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl git
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy edge-tts gTTS
          npm install --no-save playwright three
          npx playwright install --with-deps chromium
          mkdir -p panama_plus_3d_kit/ep4_orca_urdu/assets
          git clone --depth 1 https://github.com/Leonxlnx/earshot.git /tmp/earshot || true
          if [ -d /tmp/earshot/takes ]; then
            cp -r /tmp/earshot/takes panama_plus_3d_kit/ep4_orca_urdu/assets/earshot_takes
          fi

      - name: Download Verified CC0/Public .glb Ocean 3D Models
        run: |
          mkdir -p panama_plus_3d_kit/ep4_orca_urdu/assets
          curl -L --fail https://raw.githubusercontent.com/Edu-Art-3D/Eduart-orca-3D/main/orca.glb -o panama_plus_3d_kit/ep4_orca_urdu/assets/orca.glb
          curl -L --fail https://raw.githubusercontent.com/Edu-Art-3D/Eduart-whale-3D/main/whale.glb -o panama_plus_3d_kit/ep4_orca_urdu/assets/whale.glb
          curl -L --fail https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs/quaternius-animatedfish/models/fish1/fish1.glb -o panama_plus_3d_kit/ep4_orca_urdu/assets/fish1.glb
          curl -L --fail https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs/quaternius-animatedfish/models/shark/shark.glb -o panama_plus_3d_kit/ep4_orca_urdu/assets/shark.glb
          python3 -c "
          from pathlib import Path
          for p in ['orca.glb', 'whale.glb', 'fish1.glb', 'shark.glb']:
              f = Path('panama_plus_3d_kit/ep4_orca_urdu/assets') / p
              hdr = f.read_bytes()[:4]
              assert hdr == b'glTF', f'{p} bad header: {hdr}'
              print(f'Verified {p}: {f.stat().st_size} bytes')
          "

      - name: Build Urdu Neural Narration + Ocean DSP + Earshot SFX (-14 LUFS)
        run: python3 panama_plus_3d_kit/ep4_orca_urdu/build_audio.py

      - name: Render 1080x1920 @ 30fps Full 3D Video + Contact Sheet + QC
        run: node panama_plus_3d_kit/ep4_orca_urdu/render_webgl.mjs

      - name: Commit Failure Diagnostics if Render Failed
        if: failure()
        run: |
          if [ -f panama_plus_3d_kit/ep4_orca_urdu/qc/render_error.log ]; then
            git pull --rebase origin arena/2a8ad29e-top1 || true
            git config user.name "MONARCH Render Bot"
            git config user.email "workadilchandio@gmail.com"
            git add -f panama_plus_3d_kit/ep4_orca_urdu/qc/render_error.log
            git commit -m "debug(ep4-orca-urdu): capture render_error.log [skip ci]" || true
            git push origin HEAD:arena/2a8ad29e-top1 || true
          fi

      - name: Commit Deliverable, Contact Sheet & QC Report back to branch
        run: |
          git config user.name "MONARCH Render Bot"
          git config user.email "workadilchandio@gmail.com"
          git add -f deliverables/MONARCH_OrcaVsHumpback_Urdu_PanamaPlus_1080x1920.mp4 panama_plus_3d_kit/ep4_orca_urdu/qc/contact_sheet.png panama_plus_3d_kit/ep4_orca_urdu/qc/qc_report.json
          git commit -m "build(ep4-orca-urdu): deliver 1080x1920 30fps Orca vs Humpback Urdu 3D master + QC [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin arena/2a8ad29e-top1 && git push origin HEAD:arena/2a8ad29e-top1 && break || sleep 6
          done
