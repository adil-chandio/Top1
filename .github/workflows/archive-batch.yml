name: Sequential archive reference research
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/archive_batch.py, research/monarch_cam_restart_batch1/archive_batch_config.json, .github/workflows/archive-batch.yml]
permissions:
  contents: read
  checks: write
  actions: write
jobs:
  research:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Cancel only our now-unnecessary fallback acquisition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api repos/${{ github.repository }}/actions/runs/44024328065 --jq .status)
          if [ "$status" != "completed" ]; then
            gh api --method POST repos/${{ github.repository }}/actions/runs/44024328065/cancel
          fi
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python research/monarch_cam_restart_batch1/archive_batch.py
