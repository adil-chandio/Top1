name: Gecko deeper film inspection
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-deep-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect video and audio signals
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U yt-dlp
          yt-dlp --no-playlist -f 'best[height<=360]/best' -o /tmp/film.mp4 https://www.dailymotion.com/video/x6i0u21
          ffprobe -v error -show_entries format=duration:stream=index,codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json /tmp/film.mp4 > /tmp/probe.json
          ffmpeg -hide_banner -i /tmp/film.mp4 -filter:v "select='gt(scene,0.25)',showinfo" -an -f null - 2>/tmp/scenes.txt
          ffmpeg -hide_banner -i /tmp/film.mp4 -af silencedetect=noise=-35dB:d=0.5 -vn -f null - 2>/tmp/silence.txt || true
          python3 - <<'PY'
          import json,re
          p=json.load(open('/tmp/probe.json'))
          print('::notice title=probe::'+json.dumps(p,separators=(',',':')))
          s=open('/tmp/scenes.txt').read()
          pts=re.findall(r'pts_time:([\d.]+)',s)
          print('::notice title=detected cuts::'+','.join(pts) if pts else '::notice title=detected cuts::none at threshold 0.25')
          for line in open('/tmp/silence.txt'):
            if 'silence_start:' in line or 'silence_end:' in line: print('::notice title=silence::'+line.strip())
          PY
