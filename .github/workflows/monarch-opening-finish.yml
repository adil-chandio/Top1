name: Monarch opening final assembly
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: ['research/monarch_cam_market/motion/opening_finish_trigger.json']
permissions:
  contents: write
  actions: read
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Dependencies
        run: python -m pip install pillow numpy imageio-ffmpeg
      - uses: actions/download-artifact@v4
        with:
          github-token: '${{ github.token }}'
          run-id: 43847040736
          pattern: opening-frames-*
          merge-multiple: true
          path: .
      - name: Mix, composite, encode and verify 20 seconds
        id: encode
        env:
          GH_TOKEN: '${{ github.token }}'
        run: python research/monarch_cam_market/motion/cloud_finish.py
      - name: 'Delivery manifest ${{ steps.encode.outputs.manifest_sha }}'
        run: echo 'Delivery manifest ready; no media committed to branch tree.'
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-opening-final
          path: |
            research/monarch_cam_market/motion/out/MONARCH_CAM_OPENING_20S_REVIEW.mp4
            research/monarch_cam_market/motion/out/opening_delivery_receipt.json
          retention-days: 3
