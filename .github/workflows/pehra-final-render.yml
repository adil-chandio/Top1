name: "PEHRA EP01 — Full-Script 3D Cinema Render"

on:
  push:
    branches: [arena/944c619c-top1]
    paths:
      - 'production/account1_ep01/FINAL_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pehra-full-${{ github.ref }}
  cancel-in-progress: false

env:
  BLENDER_VERSION: "4.2.15"
  BLENDER_DIR: "blender-4.2.15-linux-x64"
  SAMPLES: "4"

jobs:
  bootstrap:
    name: "Prepare assets + soundtrack"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      shots: ${{ steps.shots.outputs.shots }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install FFmpeg + DSP deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests numpy scipy soundfile pydub
      - name: Build the full-script timeline
        run: python production/account1_ep01/plan_full.py
      - name: Build the full-script soundtrack
        run: python production/account1_ep01/build_audio_full.py
      - name: Fetch verified CC0 / MIT 3D assets
        run: python production/account1_ep01/fetch_assets.py
      - name: Verify prepared bundle
        run: |
          set -euo pipefail
          test -f production/account1_ep01/build/timeline_full.json
          test -f production/account1_ep01/build/master_full.m4a
          test -f production/account1_ep01/assets/manifest.json
          du -sh production/account1_ep01/assets production/account1_ep01/build
      - name: Download Blender 4.2.15 LTS once
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-$BLENDER_VERSION-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/$BLENDER_DIR/blender --version | head -3
          tar -C /tmp -cJf /tmp/blender-ready.tar.xz "$BLENDER_DIR"
          ls -lh /tmp/blender-ready.tar.xz
      - name: Emit shot matrix
        id: shots
        run: |
          set -euo pipefail
          if [ -f production/account1_ep01/shards_pending.json ]; then
            echo "Repair run: rendering only $(python -c "import json;print(len(json.load(open('production/account1_ep01/shards_pending.json'))))") pending shards"
            echo "shots=$(python -c "import json;print(json.dumps(json.load(open('production/account1_ep01/shards_pending.json')),separators=(',',':')))")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          tl = json.loads(Path("production/account1_ep01/build/timeline_full.json").read_text())
          SHARD = 26          # ~26 frames per shard at ~45 s/frame ≈ 20 min
          rows = []
          for s in tl["shots"]:
              slug = re.sub(r"[^a-z0-9]+", "_", s["id"].lower()).strip("_")
              lo, hi, part = s["f_start"], s["f_end"], 1
              while lo <= hi:
                  last = min(lo + SHARD - 1, hi)
                  rows.append({"id": s["id"], "slug": f"{slug}_{part}",
                               "f_start": lo, "f_end": last})
                  lo, part = last + 1, part + 1
          print("shots=" + json.dumps(rows, separators=(",", ":")))
          PY
      - name: Upload render bundle
        uses: actions/upload-artifact@v4
        with:
          name: pehra-final-bundle-${{ github.run_id }}
          path: |
            production/account1_ep01/assets
            production/account1_ep01/build/timeline_full.json
            production/account1_ep01/build/master_full.m4a
            production/account1_ep01/render_scene.py
            production/account1_ep01/assemble_preview.py
            production/account1_ep01/plan_full.py
            production/account1_ep01/ASSET_CREDITS.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Upload the Blender tarball for the shards
        uses: actions/upload-artifact@v4
        with:
          name: blender-ready-${{ github.run_id }}
          path: /tmp/blender-ready.tar.xz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  render:
    name: "Render ${{ matrix.shot.id }} @ ${{ matrix.shot.f_start }}-${{ matrix.shot.f_end }}"
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shot: ${{ fromJSON(needs.bootstrap.outputs.shots) }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Blender runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xz-utils libgl1 libegl1 libglu1-mesa libx11-6 libxcb1 libxi6 \
            libxrender1 libxfixes3 libxkbcommon0 libxrandr2 libxinerama1 \
            libxxf86vm1 libsm6 libice6 libfontconfig1 libgomp1
      - name: Fetch the prebuilt Blender tarball
        uses: actions/download-artifact@v4
        with:
          name: blender-ready-${{ github.run_id }}
          path: /tmp/blenderpkg
      - name: Unpack Blender (no per-shard download)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/blender4215"
          tar -xf /tmp/blenderpkg/blender-ready.tar.xz -C "$HOME/blender4215"
          BIN="$HOME/blender4215/$BLENDER_DIR/blender"
          chmod +x "$BIN"
          "$BIN" --version | head -3
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Download render bundle
        uses: actions/download-artifact@v4
        with:
          name: pehra-final-bundle-${{ github.run_id }}
          path: production/account1_ep01
      - name: Render frames for this shard
        continue-on-error: true
        env:
          SLUG: ${{ matrix.shot.slug }}
          F_START: ${{ matrix.shot.f_start }}
          F_END: ${{ matrix.shot.f_end }}
          SHOT_ID: ${{ matrix.shot.id }}
        run: |
          set -euo pipefail
          rm -rf production/account1_ep01/frames
          mkdir -p production/account1_ep01/frames
          export SHARD_MARKER="production/account1_ep01/shards/${SLUG}.done"
          mkdir -p production/account1_ep01/shards
          chmod +x "$BLENDER_BIN"
          # Render in chunks so partial progress survives a timeout.
          FRAME=$F_START
          CHUNK=13
          while [ "$FRAME" -le "$F_END" ]; do
            LAST=$((FRAME + CHUNK - 1)); [ "$LAST" -gt "$F_END" ] && LAST=$F_END
            "$BLENDER_BIN" -b --factory-startup \
              --python production/account1_ep01/render_scene.py -- \
              --shot "$SHOT_ID" --mode final --samples "$SAMPLES" --res-pct 100 \
              --frames "$FRAME-$LAST" \
              --timeline production/account1_ep01/build/timeline_full.json \
              --assets production/account1_ep01/assets \
              --out production/account1_ep01/frames >> /tmp/shard.log 2>&1
            RC=$?
            tail -3 /tmp/shard.log
            echo "[chunk] $SLUG: rendered $FRAME-$LAST (rc=$RC)"
            FRAME=$((LAST + 1))
          done
      - name: Commit this shard's frames
        if: always()
        env:
          SLUG: ${{ matrix.shot.slug }}
          F_START: ${{ matrix.shot.f_start }}
          F_END: ${{ matrix.shot.f_end }}
        run: |
          set -uo pipefail
          export SHARD_MARKER="production/account1_ep01/shards/${SLUG}.done"
          mkdir -p production/account1_ep01/shards
          cp /tmp/shard.log "production/account1_ep01/shards/${SLUG}.log" 2>/dev/null || true
          N=$(find production/account1_ep01/frames -maxdepth 1 -name "f_*.png" 2>/dev/null | wc -l)
          echo "[done] $SLUG produced $N frames"
          if [ "$N" -lt 1 ]; then
            echo "::error::$SLUG produced no frames (see shards/${SLUG}.log)"
            exit 1
          fi
          touch "$SHARD_MARKER"
          git config user.name "pehra-render-bot"
          git config user.email "pehra-render@users.noreply.github.com"
          # Rendered frames are untracked, so a hard reset to the remote tip
          # keeps them on disk while discarding any stale tracked frames.
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            git add -f production/account1_ep01/frames "$SHARD_MARKER" "production/account1_ep01/shards/${SLUG}.log"
            if git diff --cached --quiet; then
              echo "[commit] nothing new to add (attempt $attempt)"
              break
            fi
            git commit -q -m "render[$SLUG] $F_START-$F_END (run ${{ github.run_id }})"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "[commit] $SLUG pushed on attempt $attempt"
              break
            fi
            echo "[commit] push rejected, retrying ($attempt)"
            sleep $((attempt * 5))
          done

      - name: Upload shot frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pehra-final-frames-${{ matrix.shot.slug }}-${{ github.run_id }}
          path: production/account1_ep01/frames
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  assemble:
    name: "Assemble, grade, mux, QC"
    needs: [bootstrap, render]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install FFmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --quiet pillow
      - name: Download render bundle
        uses: actions/download-artifact@v4
        with:
          name: pehra-final-bundle-${{ github.run_id }}
          path: production/account1_ep01
      - name: Collect every frame the shards committed
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME" --unshallow 2>/dev/null || git fetch origin "$GITHUB_REF_NAME"
          rm -rf production/account1_ep01/frames
          mkdir -p production/account1_ep01/frames
          # Shards reset to the remote tip before committing, so the newest
          # frame set can live on any commit in the history — walk them all.
          for c in $(git log --format=%H -40 "origin/$GITHUB_REF_NAME"); do
            for f in $(git ls-tree -r --name-only "$c" -- production/account1_ep01/frames | grep 'f_.*\.png$'); do
              base=$(basename "$f")
              [ -f "production/account1_ep01/frames/$base" ] && continue
              git show "$c:$f" > "production/account1_ep01/frames/$base"
            done
          done
          N=$(find production/account1_ep01/frames -maxdepth 1 -name 'f_*.png' | wc -l)
          echo "collected $N frames"
          python - "$N" <<'PY'
          import sys
          from pathlib import Path
          got = {int(p.stem.split("_")[1]) for p in Path("production/account1_ep01/frames").glob("f_*.png")}
          missing = [f for f in range(1, 451) if f not in got]
          print(f"have {len(got)}/450; missing {len(missing)}")
          if missing:
              print("missing frames:", missing[:40])
              sys.exit(1)
          PY
      - name: Count the frame set
        run: |
          N=$(find production/account1_ep01/frames -maxdepth 1 -name 'f_*.png' | wc -l)
          echo "frames: $N / 450"
          [ "$N" -eq 450 ] || { echo "::error::expected 450 frames, found $N"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          d = Path("production/account1_ep01/frames")
          got = sorted(int(p.stem.split("_")[1]) for p in d.glob("f_*.png"))
          missing = [f for f in range(1, 451) if f not in set(got)]
          assert not missing, f"missing frames: {missing[:20]}"
          print("all 450 frames present, contiguous 1..450")
          PY
      - name: Assemble the 15s film
        run: |
          set -euo pipefail
          python production/account1_ep01/assemble_preview.py \
            --mode final \
            --frames-dir production/account1_ep01/frames \
            --timeline production/account1_ep01/build/timeline_full.json \
            --audio production/account1_ep01/build/master_full.m4a \
            --out-dir production/account1_ep01/renders
          ls -lh production/account1_ep01/renders
      - name: Publish deliverables to the branch
        run: |
          set -euo pipefail
          DEST="deliverables/pehra-full"
          mkdir -p "$DEST"
          cp -a production/account1_ep01/renders/. "$DEST/"
          git config user.name "pehra-render-bot"
          git config user.email "pehra-render@users.noreply.github.com"
          git add -f "$DEST"
          git commit -q -m "Publish PEHRA EP01 full-script film (run ${{ github.run_id }})" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: pehra-final-film-${{ github.run_id }}
          path: production/account1_ep01/renders
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
