name: Sequential visual reference acquisition
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths:
      - research/monarch_cam_restart_batch1/visual_reference_review.py
      - .github/workflows/visual-reference-review.yml
permissions:
  contents: read
jobs:
  visual-references:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install yt-dlp
      - name: Process references one at a time without audio
        run: python research/monarch_cam_restart_batch1/visual_reference_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-reference-evidence
          path: studio/runtime/visual-reference-review/
          retention-days: 1
