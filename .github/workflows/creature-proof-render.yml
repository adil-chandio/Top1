name: Creature proof picture rendering
on:
  push:
    branches: [arena/868808e3-top1]
    paths: [.github/workflows/creature-proof-render.yml]
permissions: {}
jobs:
  picture:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {first: 0, end: 30}
          - {first: 30, end: 60}
          - {first: 60, end: 90}
          - {first: 90, end: 120}
          - {first: 120, end: 150}
          - {first: 150, end: 180}
          - {first: 180, end: 208}
    name: Frames ${{ matrix.first }}–${{ matrix.end }} (exclusive)
    env:
      INPUT_BLOB: 'e48dbd333f2f15c387498590a6d66e8ef7cbeb9b'
      FIRST: ${{ matrix.first }}
      END: ${{ matrix.end }}
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 4
      RECIPIENT: |
        -----BEGIN CERTIFICATE-----
        MIIEPTCCAqWgAwIBAgIUGMgAssysSv4nUhJDD9ILmB3RglQwDQYJKoZIhvcNAQEL
        BQAwLjEsMCoGA1UEAwwjTW9uYXJjaCBDcmVhdHVyZSBwcm9vZiBzZWFsZWQgcGxh
        dGUwHhcNMjYxMTE5MDMzMDUwWhcNMjYxMTIzMDMzMDUwWjAuMSwwKgYDVQQDDCNN
        b25hcmNoIENyZWF0dXJlIHByb29mIHNlYWxlZCBwbGF0ZTCCAaIwDQYJKoZIhvcN
        AQEBBQADggGPADCCAYoCggGBAMqP7JS3NxLr86++6ri79Prg9HEpgmXpZMHFuEFm
        xyAYDgzKqhLl0ALc4+9F5ByS5itUvpxWE6XYFJ8rqkUVfKhEf+IS4CgOKPe8hp3Y
        89LGS80mOIsSAirdbGXM4leelDOWlBdkG/SoGD3oOFDH5fMyR/F8BURCwqWU4zoJ
        oasnvlQhGxWXO8TatYxYUEc3Q/GMYKG9O6CRO0AmAHVqf8PNK4sBkcdXbG7B/gGd
        Lton+4V0Wz+tEUNAhc0ie3bP+korpRWkKAu2j02KdIyu9HYe2MqsF0w9DuJyrmWc
        mblyGlDH7Skls08YE3Own3HBdjyHD7JGm0uwACQMZK4Bw6GqWW3sqNG97F1VPxZM
        QdqySS0G/WHslSLj77QqmxREKwzEHEdhKRrsRLyDflprjPYf/tjIho0u5g0L50xs
        SXhfQbebi2IEPAEG/v1GEdK+l2P0wTEcaHDXyKAqbDgL8BYCu8RfS7hU7Jbpwf5P
        K4uuVfKlPKcQh9RTuVw4bfTbWQIDAQABo1MwUTAdBgNVHQ4EFgQUfFWsEptIu4Td
        K2RF0/KMbIRx9mQwHwYDVR0jBBgwFoAUfFWsEptIu4TdK2RF0/KMbIRx9mQwDwYD
        VR0TAQH/BAUwAwEB/zANBgkqhkiG9w0BAQsFAAOCAYEAXxqYDxI/+H2rtD94SCNY
        MN4mzyUJJBiR5Gp/3z1ErtkSoDulFRm5+yvAOex5LN5wIKMIaiLm22eZJTkolRTs
        JiIrfzbiZ8/6cg/W2DkhVnikFtzskg5G41iqw0mtcwRKvcdeLJBVbzhix1Xyp5WA
        ITlPhvCN018gaY1gQ4IdAdGU9mKwuUB8zVUBzyXrTlPpHvRGGGwmTL9Zj3ZEBKjT
        HvPWKlnRco6QfHIa/D/SzyZpuq75b1czaNfz6OpFl/KmmwjtaUXjS+Yk4DsUKUPi
        9T3cqba/a3kgGcLoFWS6FN+XwkYMB9NB+hrbNjX0KRAzHp7DeeqZqVXLpYk4Q34w
        MZG0g6N8HR48cR0R8KaeMPPkkvXXO1MI/dPZQ5JBknK9ln/s/d7vwlJmAM8Duocm
        M8rnRiwranAiSnU0A383N5OxUb34p6M2PgdTSkQC/ymQqYwcw2OR0zi3vhd1HeiH
        fwhKkwjleWBOaItPOcK94ee4jmZ6vcrEqKrsmQcNUwNy
        -----END CERTIFICATE-----
    steps:
      - name: Rehydrate only the original picture rig
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p creature/source
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$INPUT_BLOB" --jq .content | base64 -d > creature/rig.tgz
          test "$(git hash-object creature/rig.tgz)" = "$INPUT_BLOB"
          cd creature
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          names={'geometry.py','surface.py','habitat.py','render.py','assets/conservatory.jpg','take.json'}
          with tarfile.open('rig.tgz') as archive:
              assert {m.name for m in archive.getmembers()} == names
              for member in archive:
                  assert member.isfile() and 0 < member.size <= 8_000_000
                  dst=Path('source')/member.name
                  dst.parent.mkdir(exist_ok=True)
                  dst.write_bytes(archive.extractfile(member).read())
          PY
      - name: Trace native frames with Blender Cycles
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/creature"
          py=$(find /opt/hostedtoolcache/Python/3.11.*/x64/bin -name python3 -print | sort -V | tail -1)
          test -x "$py"
          "$py" -m pip install --disable-pip-version-check --quiet --target "$PWD/runtime" 'bpy==4.3.0' 'numpy==1.26.4'
          export PYTHONPATH="$PWD/runtime"
          "$py" -u source/render.py --width 576 --samples 10 --threads 4 --poses source/take.json --out plate --range "$FIRST:$END"
      - name: Seal the picture segment without a public video artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP/creature"
          trap 'rm -f run.mp4 sealed.cms transport.json cert.pem' EXIT
          ffmpeg -nostdin -hide_banner -v error -y -filter_threads 1 -framerate 24 -start_number "$FIRST" -i plate/%04d.png \
            -frames:v "$((END-FIRST))" -vf 'scale=in_range=full:out_range=tv:out_color_matrix=bt709,format=yuv420p' \
            -c:v libx264 -profile:v high -threads 3 -preset slow -crf 13 -g 48 -an -colorspace bt709 -color_range tv \
            -color_trc bt709 -color_primaries bt709 -movflags +faststart run.mp4
          n=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 run.mp4)
          test "$n" = "$((END-FIRST))"
          echo "$RECIPIENT" > cert.pem
          openssl cms -encrypt -binary -aes256 -in run.mp4 -outform DER -out sealed.cms cert.pem
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          data = Path('sealed.cms').read_bytes()
          assert 0 < len(data) < 8_000_000
          Path('transport.json').write_text(json.dumps({'encoding':'base64', 'content':base64.b64encode(data).decode()}))
          PY
          blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input transport.json --jq .sha)
          receipt=$(python3 -c 'import json; print(json.load(open("plate/picture.json"))["fingerprint"])')
          sha=$(sha256sum run.mp4 | cut -d' ' -f1)
          echo "::notice title=Sealed creature picture::$FIRST:$END:$blob:$sha:$receipt"
