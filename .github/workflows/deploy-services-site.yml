name: Deploy 3D services site

# Publishes services/website/site to GitHub Pages — free, no card, no domain.
# URL: https://adil-chandio.github.io/Top1/
#
# ONE-TIME SETUP (owner must click this, a token cannot):
#   https://github.com/adil-chandio/Top1/settings/pages
#   Source: "GitHub Actions"
#
# After that this workflow redeploys on every push to main. Nothing else to do.
#
# Pages serves the repo from a subpath, so every URL in the site stays relative
# (./site.css, not /site.css). Do not break that.

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's own tests pass
        run: node services/website/site.test.mjs

      - name: Stage only the site folder
        run: |
          mkdir -p _site
          cp -R services/website/site/. _site/
          rm -f _site/site.test.mjs
          cp services/website/site/index.html _site/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
