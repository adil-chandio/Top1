name: Deploy 3D services site

# Publishes services/website/site to GitHub Pages.
# Free, no card, no token to rotate. URL: https://adil-chandio.github.io/Top1/
#
# Because Pages serves this repo from a subpath, everything in the site must use
# relative URLs (./site.css, not /site.css). Keep it that way.

on:
  push:
    branches: [main]
    paths:
      - 'services/website/site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's own tests pass
        run: node services/website/site.test.mjs

      - name: Stage only the site folder
        run: |
          mkdir -p _site
          cp -R services/website/site/. _site/
          rm -f _site/site.test.mjs
          cp services/website/site/index.html _site/404.html || true

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it has never been enabled.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
