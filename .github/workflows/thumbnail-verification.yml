name: One-shot thumbnail verification
on:
  push:
    branches: [arena/b040eefc-top1]
    paths:
      - .github/workflows/thumbnail-verification.yml
      - channels/monarch_cam/intel/verify_thumbnail_sources.py
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture official thumbnails (decode locally after download)
        run: |
          mkdir -p thumbnail-captures
          python3 channels/monarch_cam/intel/verify_thumbnail_sources.py --skip-decoder --output thumbnail-captures | tee thumbnail-captures/results.json
          exit "${PIPESTATUS[0]}"
      - name: Publish small JPEG payloads to run annotations
        if: always()
        run: |
          python3 - <<'PY'
          import base64, pathlib
          for image in pathlib.Path('thumbnail-captures').glob('*.jpg'):
              print(f'::notice title={image.name}::{base64.b64encode(image.read_bytes()).decode()}')
          PY
      - name: Save results and captured images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-thumbnail-captures
          path: thumbnail-captures/
          if-no-files-found: error
          retention-days: 7
