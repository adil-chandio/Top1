name: Bounded YoutubeExplode route test
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/explode-test/**, .github/workflows/explode-route-test.yml]
permissions:
  contents: read
  checks: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: One anonymous reference, no cookies or routing changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --project research/monarch_cam_restart_batch1/explode-test/Probe.csproj
