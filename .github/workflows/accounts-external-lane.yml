name: Accounts external lane
# Real work performed on GitHub-hosted runners, which have general internet
# access that the authoring sandbox does not. Every result is committed back to
# the branch by the runner itself, so evidence is auditable and never authored
# by the agent that requested it.
on:
  push:
    paths:
      - 'external_lane_trigger/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounts-external-lane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asr_transcript:
    name: Real ASR transcript (faster-whisper on runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install ffmpeg + faster-whisper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet faster-whisper
      - name: Transcribe the real PEHRA deliverable audio
        run: |
          mkdir -p external_evidence/asr
          V=deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4
          ffmpeg -hide_banner -loglevel error -y -i "$V" -vn -ac 1 -ar 16000 /tmp/pehra.wav
          python - <<'PY'
          import json, hashlib, subprocess
          from pathlib import Path
          from faster_whisper import WhisperModel
          src = Path('deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4')
          out = {'source': str(src), 'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
                 'engine': 'faster-whisper', 'route': 'github_actions_runner', 'results': []}
          try:
              model = WhisperModel('small', device='cpu', compute_type='int8')
              out['model'] = 'small'
              for label, path, lang in [('pehra_deliverable', '/tmp/pehra.wav', 'ur')]:
                  segs, info = model.transcribe(path, language=lang, beam_size=5, vad_filter=True)
                  segs = list(segs)
                  out['results'].append({
                      'label': label, 'language_requested': lang,
                      'language_detected': info.language,
                      'language_probability': round(info.language_probability, 4),
                      'duration': round(info.duration, 3),
                      'segments': [{'start': round(s.start,2), 'end': round(s.end,2),
                                    'text': s.text.strip(),
                                    'no_speech_prob': round(s.no_speech_prob,4)} for s in segs],
                      'transcript': ' '.join(s['text'] for s in [] ) or ' '.join(x['text'] for x in [])})
                  out['results'][-1]['transcript'] = ' '.join(s['text'] for s in [
                      {'text': y['text']} for y in out['results'][-1]['segments']]).strip()
          except Exception as e:
              out['error'] = f'{type(e).__name__}: {e}'
          Path('external_evidence/asr/pehra_transcript.json').write_text(json.dumps(out, indent=2, ensure_ascii=False))
          print(json.dumps(out, indent=2, ensure_ascii=False)[:3000])
          PY
      - name: Commit transcript back to the branch
        if: always()
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add external_evidence/
          git commit -m 'External lane: real ASR transcript of PEHRA deliverable' || echo 'nothing to commit'
          git push origin HEAD:arena/944c619c-top1 && echo PUSH_OK || echo PUSH_FAIL

  different_model_review:
    name: Different language model review (independent model family)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install torch CPU + transformers
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet transformers accelerate
      - name: Run a different model family over the measured artifact facts
        run: |
          mkdir -p external_evidence/review
          python - <<'PY'
          import json, hashlib, platform
          from pathlib import Path
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          MODEL = 'Qwen/Qwen2.5-0.5B-Instruct'
          V = Path('deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4')
          qc = json.loads(Path('deliverables/pehra-final/PEHRA_15s_QC.json').read_text())
          facts = {
              'artifact_sha256': hashlib.sha256(V.read_bytes()).hexdigest(),
              'artifact_bytes': V.stat().st_size,
              'duration_sec': qc['ffprobe']['format']['duration'],
              'width': qc['ffprobe']['streams'][0]['width'],
              'height': qc['ffprobe']['streams'][0]['height'],
              'fps': qc['ffprobe']['streams'][0]['r_frame_rate'],
              'audio_codec': qc['ffprobe']['streams'][1]['codec_name'],
              'audio_sample_rate': qc['ffprobe']['streams'][1]['sample_rate'],
              'zero_still_image_scene_plates': qc['zero_still_image_scene_plates'],
              'validated_all_frame_files': qc['validated_all_frame_files'],
              'editorial_caption_overlays': qc['editorial_caption_overlays'],
          }
          criteria = {'width': 1080, 'height': 1920, 'fps': 30, 'duration_sec': 15.0}
          prompt = (
              "You are an independent technical reviewer. You did NOT author this artifact.\n"
              "You cannot watch the video. Judge ONLY the measured facts below.\n\n"
              f"MEASURED FACTS:\n{json.dumps(facts, indent=2)}\n\n"
              f"ACCEPTANCE CRITERIA:\n{json.dumps(criteria, indent=2)}\n\n"
              "Reply with strict JSON only, keys: "
              '{"meets_technical_spec": true/false, "checks": {...}, "findings": "one paragraph", '
              '"cannot_judge": ["..."]}. Do not invent observations about picture or sound content.'
          )
          out = {'model': MODEL, 'backend': 'transformers', 'route': 'github_actions_runner',
                 'torch': torch.__version__, 'python': platform.python_version(),
                 'prompt': prompt, 'facts': facts}
          try:
              tok = AutoTokenizer.from_pretrained(MODEL)
              mdl = AutoModelForCausalLM.from_pretrained(MODEL, torch_dtype=torch.float32)
              msgs = [{'role': 'user', 'content': prompt}]
              ids = tok.apply_chat_template(msgs, add_generation_prompt=True, return_tensors='pt')
              gen = mdl.generate(ids, max_new_tokens=400, do_sample=False,
                                 temperature=None, top_p=None, pad_token_id=tok.eos_token_id)
              text = tok.decode(gen[0][ids.shape[-1]:], skip_special_tokens=True)
              out['raw_response'] = text
              s, e = text.find('{'), text.rfind('}')
              if s != -1 and e > s:
                  try:
                      out['parsed'] = json.loads(text[s:e+1])
                  except Exception as ex:
                      out['parse_error'] = str(ex)
          except Exception as e:
              out['error'] = f'{type(e).__name__}: {e}'
          Path('external_evidence/review/different_model_review.json').write_text(
              json.dumps(out, indent=2, ensure_ascii=False))
          print(json.dumps(out.get('parsed') or out, indent=2, ensure_ascii=False)[:2500])
          PY
      - name: Commit review back to the branch
        if: always()
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add external_evidence/
          git commit -m 'External lane: different-model independent technical review' || echo 'nothing to commit'
          git push origin HEAD:arena/944c619c-top1 && echo PUSH_OK || echo PUSH_FAIL

  platform_av:
    name: Platform reference AV from runner network
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install yt-dlp and probe platform behaviour honestly
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet yt-dlp
          mkdir -p external_evidence/platform
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          targets = [('youtube','https://www.youtube.com/watch?v=aqz-KE-bpKQ'),
                     ('instagram','https://www.instagram.com/p/CqNyqZPLLZ9/'),
                     ('tiktok','https://www.tiktok.com/@scout2015/video/6718335390845095173')]
          report = []
          for name, url in targets:
              rec = {'platform': name, 'url': url}
              meta = subprocess.run(['yt-dlp','--no-warnings','--skip-download','--dump-json',url],
                                    capture_output=True, text=True, timeout=180)
              if meta.returncode == 0:
                  try:
                      j = json.loads(meta.stdout.splitlines()[0])
                      rec.update({'metadata_ok': True, 'title': j.get('title'),
                                  'duration': j.get('duration'), 'extractor': j.get('extractor')})
                  except Exception as e:
                      rec.update({'metadata_ok': True, 'parse_error': str(e)})
              else:
                  rec.update({'metadata_ok': False,
                              'error': (meta.stderr or '')[-400:]})
              report.append(rec)
          Path('external_evidence/platform/platform_probe.json').write_text(
              json.dumps({'route':'github_actions_runner','results':report}, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Commit probe back to the branch
        if: always()
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add external_evidence/
          git commit -m 'External lane: platform reference AV probe from runner network' || echo 'nothing to commit'
          git push origin HEAD:arena/944c619c-top1 && echo PUSH_OK || echo PUSH_FAIL
