name: Accounts external lane
# Real work performed on GitHub-hosted runners, which have general internet
# access that the authoring sandbox does not (measured: youtube/instagram/
# tiktok/huggingface all 200 from the runner, 000 from the sandbox).
#
# Design notes learned the hard way:
#  - One job, not three. Three parallel jobs push to the same branch and race;
#    two silently lose their commit. Sequential steps + one push at the end.
#  - Every step writes a marker file first, so a failure still leaves evidence.
#  - The runner commits its own output. Nothing here is authored by the agent
#    that requested it, so the evidence is auditable in git history.
on:
  push:
    paths:
      - 'external_lane_trigger/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounts-external-lane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  external_work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install system + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet faster-whisper yt-dlp
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet transformers accelerate
          python -c "import faster_whisper, torch, transformers; print('deps ok')"

      - name: A. Real ASR transcript of the PEHRA deliverable
        continue-on-error: true
        run: |
          mkdir -p external_evidence/asr
          ffmpeg -hide_banner -loglevel error -y \
            -i deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4 \
            -vn -ac 1 -ar 16000 /tmp/pehra.wav
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/pehra.wav \
            > external_evidence/asr/wav_duration.txt
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          out = {"route": "github_actions_runner", "engine": "faster-whisper",
                 "source": "deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4",
                 "source_sha256": hashlib.sha256(Path(
                     "deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4"
                 ).read_bytes()).hexdigest()}
          try:
              from faster_whisper import WhisperModel
              model = WhisperModel("small", device="cpu", compute_type="int8")
              out["model"] = "small"
              segs, info = model.transcribe("/tmp/pehra.wav", language="ur",
                                            beam_size=5, vad_filter=True)
              segs = list(segs)
              out.update({
                  "language_requested": "ur",
                  "language_detected": info.language,
                  "language_probability": round(info.language_probability, 4),
                  "audio_duration": round(info.duration, 3),
                  "segment_count": len(segs),
                  "segments": [{"start": round(s.start, 2), "end": round(s.end, 2),
                                "text": s.text.strip(),
                                "no_speech_prob": round(s.no_speech_prob, 4)}
                               for s in segs],
              })
              out["transcript"] = " ".join(s.text.strip() for s in segs).strip()
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
          Path("external_evidence/asr/pehra_transcript.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({k: v for k, v in out.items() if k != "segments"},
                           indent=2, ensure_ascii=False)[:2000])
          PY

      - name: B. Different language model reviews the measured artifact facts
        continue-on-error: true
        run: |
          mkdir -p external_evidence/review
          python - <<'PY'
          import json, hashlib, platform
          from pathlib import Path
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          MODEL = "Qwen/Qwen2.5-0.5B-Instruct"
          V = Path("deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4")
          qc = json.loads(Path("deliverables/pehra-final/PEHRA_15s_QC.json").read_text())
          facts = {
              "artifact_sha256": hashlib.sha256(V.read_bytes()).hexdigest(),
              "artifact_bytes": V.stat().st_size,
              "duration_sec": qc["ffprobe"]["format"]["duration"],
              "width": qc["ffprobe"]["streams"][0]["width"],
              "height": qc["ffprobe"]["streams"][0]["height"],
              "fps": qc["ffprobe"]["streams"][0]["r_frame_rate"],
              "video_codec": qc["ffprobe"]["streams"][0]["codec_name"],
              "audio_codec": qc["ffprobe"]["streams"][1]["codec_name"],
              "audio_sample_rate": qc["ffprobe"]["streams"][1]["sample_rate"],
              "zero_still_image_scene_plates": qc["zero_still_image_scene_plates"],
              "validated_all_frame_files": qc["validated_all_frame_files"],
              "editorial_caption_overlays": qc["editorial_caption_overlays"],
          }
          criteria = {"width": 1080, "height": 1920, "fps": 30, "duration_sec": 15.0}
          prompt = (
              "You are an independent technical reviewer. You did NOT author this "
              "artifact and you cannot watch or listen to it.\n"
              "Judge ONLY the measured facts below. Never invent picture or sound "
              "observations.\n\n"
              f"MEASURED FACTS:\n{json.dumps(facts, indent=2)}\n\n"
              f"ACCEPTANCE CRITERIA:\n{json.dumps(criteria, indent=2)}\n\n"
              'Reply with strict JSON only: {"meets_technical_spec": true, '
              '"checks": {"resolution": true, "fps": true, "duration": true, '
              '"audio_stream": true}, "findings": "one paragraph", '
              '"cannot_judge": ["creative quality", "artistic merit"]}'
          )
          out = {"model": MODEL, "model_family": "Qwen",
                 "backend": "transformers", "route": "github_actions_runner",
                 "torch": torch.__version__, "python": platform.python_version(),
                 "prompt": prompt, "facts": facts, "criteria": criteria}
          try:
              tok = AutoTokenizer.from_pretrained(MODEL)
              mdl = AutoModelForCausalLM.from_pretrained(MODEL, torch_dtype=torch.float32)
              ids = tok.apply_chat_template([{"role": "user", "content": prompt}],
                                            add_generation_prompt=True,
                                            return_tensors="pt")
              gen = mdl.generate(ids, max_new_tokens=500, do_sample=False,
                                 pad_token_id=tok.eos_token_id)
              text = tok.decode(gen[0][ids.shape[-1]:], skip_special_tokens=True)
              out["raw_response"] = text
              s, e = text.find("{"), text.rfind("}")
              if s != -1 and e > s:
                  try:
                      out["parsed"] = json.loads(text[s:e + 1])
                  except Exception as ex:
                      out["parse_error"] = str(ex)
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
          Path("external_evidence/review/different_model_review.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(out.get("parsed") or {"error": out.get("error")},
                           indent=2, ensure_ascii=False)[:2500])
          PY

      - name: C. Platform reference AV probe from real internet
        continue-on-error: true
        run: |
          mkdir -p external_evidence/platform
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          targets = [
              ("youtube", "https://www.youtube.com/watch?v=aqz-KE-bpKQ"),
              ("instagram", "https://www.instagram.com/p/CqNyqZPLLZ9/"),
              ("tiktok", "https://www.tiktok.com/@scout2015/video/6718335390845095173"),
          ]
          report = []
          for name, url in targets:
              rec = {"platform": name, "url": url}
              try:
                  p = subprocess.run(
                      ["yt-dlp", "--no-warnings", "--skip-download",
                       "--dump-json", url],
                      capture_output=True, text=True, timeout=240)
                  if p.returncode == 0 and p.stdout.strip():
                      j = json.loads(p.stdout.splitlines()[0])
                      rec.update({"metadata_ok": True,
                                  "title": j.get("title"),
                                  "duration": j.get("duration"),
                                  "width": j.get("width"), "height": j.get("height"),
                                  "fps": j.get("fps"),
                                  "extractor": j.get("extractor")})
                  else:
                      rec.update({"metadata_ok": False,
                                  "error": (p.stderr or "")[-500:]})
              except Exception as e:
                  rec.update({"metadata_ok": False,
                              "error": f"{type(e).__name__}: {e}"})
              report.append(rec)
              print(json.dumps(rec, ensure_ascii=False)[:600])
          Path("external_evidence/platform/platform_probe.json").write_text(
              json.dumps({"route": "github_actions_runner", "results": report},
                         indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Commit all evidence back to the branch
        if: always()
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add -A external_evidence/
          git commit -m 'External lane: runner-produced evidence (ASR, different model, platform)' \
            || echo 'nothing to commit'
          for i in 1 2 3; do
            if git push origin HEAD:arena/944c619c-top1; then echo PUSH_OK; break; fi
            echo "push retry $i"; git pull --rebase origin arena/944c619c-top1 || true
          done
          git log --oneline -2
