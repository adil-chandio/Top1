name: Accounts external lane
# Real work on GitHub-hosted runners, which have general internet access the
# authoring sandbox does not (measured: yt/ig/tiktok/huggingface 200 on the
# runner, 000 in the sandbox). One sequential job, one push at the end:
# parallel jobs raced on push and silently lost commits.
on:
  push:
    paths:
      - 'external_lane_trigger/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounts-external-lane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  external_work:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install system + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet faster-whisper yt-dlp
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet transformers accelerate pillow
          python -c "import faster_whisper, torch, transformers; print('deps ok')"

      - name: A. Real ASR transcript of the PEHRA deliverable
        continue-on-error: true
        run: |
          mkdir -p external_evidence/asr
          ffmpeg -hide_banner -loglevel error -y \
            -i deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4 \
            -vn -ac 1 -ar 16000 /tmp/pehra.wav
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          out = {"route": "github_actions_runner", "engine": "faster-whisper",
                 "source": "deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4",
                 "source_sha256": hashlib.sha256(Path(
                     "deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4"
                 ).read_bytes()).hexdigest()}
          try:
              from faster_whisper import WhisperModel
              model = WhisperModel("small", device="cpu", compute_type="int8")
              out["model"] = "small"
              segs, info = model.transcribe("/tmp/pehra.wav", language="ur",
                                            beam_size=5, vad_filter=True)
              segs = list(segs)
              out.update({"language_requested": "ur",
                          "language_detected": info.language,
                          "language_probability": round(info.language_probability, 4),
                          "audio_duration": round(info.duration, 3),
                          "segment_count": len(segs),
                          "segments": [{"start": round(s.start, 2), "end": round(s.end, 2),
                                        "text": s.text.strip(),
                                        "no_speech_prob": round(s.no_speech_prob, 4)}
                                       for s in segs]})
              out["transcript"] = " ".join(s.text.strip() for s in segs).strip()
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
          Path("external_evidence/asr/pehra_transcript.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(out.get("transcript", out.get("error")))
          PY

      - name: B. Different language model reviews measured artifact facts
        continue-on-error: true
        run: |
          mkdir -p external_evidence/review
          python - <<'PY'
          import json, hashlib, platform, traceback
          from pathlib import Path
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          CANDIDATES = ["Qwen/Qwen2.5-0.5B-Instruct",
                        "HuggingFaceTB/SmolLM2-360M-Instruct"]
          V = Path("deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4")
          qc = json.loads(Path("deliverables/pehra-final/PEHRA_15s_QC.json").read_text())
          facts = {
              "artifact_sha256": hashlib.sha256(V.read_bytes()).hexdigest(),
              "artifact_bytes": V.stat().st_size,
              "duration_sec": qc["ffprobe"]["format"]["duration"],
              "width": qc["ffprobe"]["streams"][0]["width"],
              "height": qc["ffprobe"]["streams"][0]["height"],
              "fps": qc["ffprobe"]["streams"][0]["r_frame_rate"],
              "video_codec": qc["ffprobe"]["streams"][0]["codec_name"],
              "audio_codec": qc["ffprobe"]["streams"][1]["codec_name"],
              "audio_sample_rate": qc["ffprobe"]["streams"][1]["sample_rate"],
              "zero_still_image_scene_plates": qc["zero_still_image_scene_plates"],
              "validated_all_frame_files": qc["validated_all_frame_files"],
              "editorial_caption_overlays": qc["editorial_caption_overlays"],
          }
          criteria = {"width": 1080, "height": 1920, "fps": 30, "duration_sec": 15.0}
          prompt = (
              "You are an independent technical reviewer. You did NOT author this "
              "artifact and you cannot watch or listen to it. Judge ONLY the "
              "measured facts. Never invent picture or sound observations.\n\n"
              f"MEASURED FACTS:\n{json.dumps(facts, indent=2)}\n\n"
              f"ACCEPTANCE CRITERIA:\n{json.dumps(criteria, indent=2)}\n\n"
              "Answer with JSON: {\"meets_technical_spec\": true/false, "
              "\"findings\": \"one paragraph\"}.")
          out = {"model_family_requirement": "must differ from the authoring model",
                 "backend": "transformers", "route": "github_actions_runner",
                 "torch": torch.__version__, "python": platform.python_version(),
                 "prompt": prompt, "facts": facts, "criteria": criteria,
                 "attempts": []}
          for name in CANDIDATES:
              att = {"model": name}
              try:
                  tok = AutoTokenizer.from_pretrained(name)
                  mdl = AutoModelForCausalLM.from_pretrained(name)
                  att["loaded"] = True
                  enc = tok.apply_chat_template([{"role": "user", "content": prompt}],
                                                add_generation_prompt=True,
                                                return_tensors="pt", return_dict=True)
                  ids = enc["input_ids"]
                  gen = mdl.generate(input_ids=ids,
                                     attention_mask=enc.get("attention_mask"),
                                     max_new_tokens=320, do_sample=False,
                                     pad_token_id=tok.eos_token_id)
                  text = tok.decode(gen[0][ids.shape[-1]:], skip_special_tokens=True)
                  att["raw_response"] = text
                  s, e = text.find("{"), text.rfind("}")
                  if s != -1 and e > s:
                      try:
                          att["parsed"] = json.loads(text[s:e + 1])
                      except Exception as ex:
                          att["parse_error"] = str(ex)
                  out["selected"] = name
                  out["attempts"].append(att)
                  break
              except Exception as e:
                  att["loaded"] = False
                  att["error"] = f"{type(e).__name__}: {e}"
                  att["traceback"] = traceback.format_exc()[-1200:]
                  out["attempts"].append(att)
          Path("external_evidence/review/different_model_review.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({k: v for k, v in out.items()
                            if k in ("selected", "attempts")}, indent=2)[:1500])
          PY

      - name: B2. Vision-language model actually looks at the real keyframes
        continue-on-error: true
        run: |
          mkdir -p external_evidence/vision
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          from PIL import Image
          import torch
          from transformers import (BlipProcessor, BlipForConditionalGeneration,
                                    ViltProcessor, ViltForQuestionAnswering)

          frames = sorted(Path("deliverables/pehra-final/keyframes").glob("*.png"))
          out = {"route": "github_actions_runner", "artifact_source":
                 "deliverables/pehra-final/keyframes/*.png (extracted from the "
                 "committed 15s MP4)", "frame_count": len(frames),
                 "captioner": "Salesforce/blip-image-captioning-base",
                 "vqa": "dandelin/vilt-b32-finetuned-vqa",
                 "cannot": ["subjective taste", "cinematic quality judgements",
                            "human emotional response"],
                 "frames": []}
          try:
              cproc = BlipProcessor.from_pretrained("Salesforce/blip-image-captioning-base")
              cmdl = BlipForConditionalGeneration.from_pretrained(
                  "Salesforce/blip-image-captioning-base")
              vproc = ViltProcessor.from_pretrained("dandelin/vilt-b32-finetuned-vqa")
              vmdl = ViltForQuestionAnswering.from_pretrained(
                  "dandelin/vilt-b32-finetuned-vqa")
              questions = ["Is the image dark?", "Is there a person?",
                           "Is this a photograph?", "Is there text in the image?",
                           "Is the scene indoors or outdoors?"]
              for f in frames:
                  img = Image.open(f).convert("RGB")
                  enc = cproc(img, return_tensors="pt")
                  cap = cmdl.generate(**enc, max_new_tokens=40)
                  caption = cproc.decode(cap[0], skip_special_tokens=True)
                  answers = []
                  for q in questions:
                      inp = vproc(img, q, return_tensors="pt")
                      with torch.no_grad():
                          logits = vmdl(**inp).logits
                      idx = int(logits.argmax(-1))
                      answers.append({
                          "question": q,
                          "answer": vmdl.config.id2label[idx],
                          "confidence": round(float(torch.softmax(logits, -1).max()), 4)})
                  out["frames"].append({"file": f.name,
                                        "size": list(img.size),
                                        "caption": caption.strip(),
                                        "vqa": answers})
                  print(f.name, "|", caption.strip())
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
              out["traceback"] = traceback.format_exc()[-1500:]
          Path("external_evidence/vision/frame_inspection.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({k: v for k, v in out.items()
                            if k in ("error", "frame_count")}, indent=2))
          PY

      - name: B3. Audio-event model actually analyses the real soundtrack
        continue-on-error: true
        run: |
          mkdir -p external_evidence/audio
          python - <<'PY'
          import json, traceback
          from pathlib import Path
          import numpy as np, torch, subprocess
          from transformers import ASTFeatureExtractor, ASTForAudioClassification

          src = "deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4"
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", src,
                          "-vn", "-ac", "1", "-ar", "16000", "/tmp/ast.wav"], check=True)
          import wave
          with wave.open("/tmp/ast.wav") as w:
              sr, n = w.getframerate(), w.getnframes()
              pcm = np.frombuffer(w.readframes(n), dtype=np.int16).astype(np.float32) / 32768.0
          out = {"route": "github_actions_runner", "model":
                 "MIT/ast-finetuned-audioset-10-10-0.4593",
                 "source": src, "sample_rate": sr, "duration_sec": round(len(pcm) / sr, 3),
                 "method": "Audio Spectrogram Transformer, 527 AudioSet classes",
                 "cannot": ["lyrics meaning", "musical taste", "emotional response"],
                 "windows": []}
          try:
              fx = ASTFeatureExtractor.from_pretrained(
                  "MIT/ast-finetuned-audioset-10-10-0.4593")
              mdl = ASTForAudioClassification.from_pretrained(
                  "MIT/ast-finetuned-audioset-10-10-0.4593")
              win = 5 * sr
              for i in range(0, max(1, len(pcm) - win + 1), win // 2):
                  chunk = pcm[i:i + win]
                  if len(chunk) < sr:
                      break
                  inp = fx(chunk, sampling_rate=sr, return_tensors="pt")
                  with torch.no_grad():
                      logits = mdl(**inp).logits
                  probs = torch.softmax(logits, -1)[0]
                  top = torch.topk(probs, 5)
                  out["windows"].append({
                      "start": round(i / sr, 2),
                      "end": round(min(i + win, len(pcm)) / sr, 2),
                      "top5": [{"label": mdl.config.id2label[int(k)],
                                "score": round(float(v), 4)}
                               for v, k in zip(top.values, top.indices)]})
                  print(out["windows"][-1])
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
              out["traceback"] = traceback.format_exc()[-1500:]
          Path("external_evidence/audio/audio_event_analysis.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: C. Platform reference AV probe, trying several YouTube clients
        continue-on-error: true
        run: |
          mkdir -p external_evidence/platform
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = []
          URL = "https://www.youtube.com/watch?v=aqz-KE-bpKQ"
          for client in ["tv", "web_safari", "web_embedded", "android", "ios", "mweb"]:
              rec = {"platform": "youtube", "player_client": client, "url": URL}
              try:
                  p = subprocess.run(
                      ["yt-dlp", "--no-warnings", "--skip-download", "--dump-json",
                       "--extractor-args", f"youtube:player_client={client}", URL],
                      capture_output=True, text=True, timeout=180)
                  if p.returncode == 0 and p.stdout.strip():
                      j = json.loads(p.stdout.splitlines()[0])
                      rec.update({"metadata_ok": True, "title": j.get("title"),
                                  "duration": j.get("duration"),
                                  "width": j.get("width"), "height": j.get("height"),
                                  "fps": j.get("fps")})
                  else:
                      rec.update({"metadata_ok": False,
                                  "error": (p.stderr or "").strip()[-220:]})
              except Exception as e:
                  rec.update({"metadata_ok": False,
                              "error": f"{type(e).__name__}: {e}"})
              report.append(rec)
              print(client, rec["metadata_ok"], rec.get("error", "")[:90])
          for name, url in [("tiktok", "https://www.tiktok.com/@scout2015/video/6718335390845095173"),
                            ("instagram", "https://www.instagram.com/p/CqNyqZPLLZ9/")]:
              rec = {"platform": name, "url": url}
              try:
                  p = subprocess.run(["yt-dlp", "--no-warnings", "--skip-download",
                                      "--dump-json", url],
                                     capture_output=True, text=True, timeout=240)
                  if p.returncode == 0 and p.stdout.strip():
                      j = json.loads(p.stdout.splitlines()[0])
                      rec.update({"metadata_ok": True, "title": j.get("title"),
                                  "duration": j.get("duration"),
                                  "width": j.get("width"), "height": j.get("height")})
                  else:
                      rec.update({"metadata_ok": False,
                                  "error": (p.stderr or "").strip()[-220:]})
              except Exception as e:
                  rec.update({"metadata_ok": False,
                              "error": f"{type(e).__name__}: {e}"})
              report.append(rec)
          Path("external_evidence/platform/platform_probe.json").write_text(
              json.dumps({"route": "github_actions_runner", "results": report},
                         indent=2, ensure_ascii=False), encoding="utf-8")
          PY

      - name: D. Durable artifact store, verified by round-trip
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p external_evidence/durable
          TAG="accounts-durable-store"
          F="deliverables/pehra-final/PEHRA_15s_PREVIEW_1080x1920.mp4"
          SIZE=$(stat -c%s "$F")
          SHA=$(sha256sum "$F" | cut -d' ' -f1)
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Accounts durable artifact store" \
            --notes "Durable external copies of job artifacts, verified by re-download."
          gh release upload "$TAG" "$F" \
            deliverables/pehra-final/PEHRA_15s_QC.json \
            deliverables/pehra-final/timeline_15s.json \
            external_evidence/asr/pehra_transcript.json --clobber || echo "upload failed"
          rm -rf /tmp/vs && mkdir -p /tmp/vs
          gh release download "$TAG" --dir /tmp/vs --clobber || echo "download failed"
          REST=$(sha256sum /tmp/vs/PEHRA_15s_PREVIEW_1080x1920.mp4 2>/dev/null | cut -d' ' -f1)
          python - <<PY
          import json
          from pathlib import Path
          p = Path("/tmp/vs/PEHRA_15s_PREVIEW_1080x1920.mp4")
          rec = {"route": "github_release", "tag": "$TAG",
                 "local_sha256": "$SHA", "restored_sha256": "$REST",
                 "local_bytes": int("$SIZE"),
                 "restored_bytes": p.stat().st_size if p.is_file() else None,
                 "verified_roundtrip": bool("$REST") and "$REST" == "$SHA"}
          Path("external_evidence/durable/release_store.json").write_text(
              json.dumps(rec, indent=2))
          print(json.dumps(rec, indent=2))
          PY

      - name: Commit all evidence back to the branch
        if: always()
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add -A external_evidence/
          git commit -m 'External lane: ASR, model review, VLM frame inspection, audio events, platform, durable store' \
            || echo 'nothing to commit'
          for i in 1 2 3; do
            if git push origin HEAD:arena/944c619c-top1; then echo PUSH_OK; break; fi
            echo "push retry $i"; git pull --rebase origin arena/944c619c-top1 || true
          done
