name: Animator original public motion references
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-vimeo-research.yml]
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        item: [0, 1, 2]
    steps:
      - name: Inspect creator hosted original animation
        shell: bash
        run: |
          set -e
          python3 -m pip install -q requests imageio-ffmpeg
          python3 - <<'PY'
          import requests,pathlib
          urls=[
            'https://cdn.myportfolio.com/08ca5924-a527-42dc-a9b4-e3c871ce7a7d/5e68fc5b-9b53-476c-90fc-5a22070b0284_rw_600.gif?h=d6b0ff319dfbb358111e5720e9157883',
            'https://cdn.myportfolio.com/08ca5924-a527-42dc-a9b4-e3c871ce7a7d/0730a761-bc13-4f49-a8df-dc7a757bafdf_rw_600.gif?h=462eeba97799e86493b1b0c944782f0f',
            'https://cdn.myportfolio.com/08ca5924-a527-42dc-a9b4-e3c871ce7a7d/5e148c9f-fbdd-4807-8418-38057eda2256_rw_600.gif?h=5b36e40fdd88249fc6fd6b3ea4c4ebcd']
          r=requests.get(urls[int('${{ matrix.item }}')],timeout=30); print('::notice title=Source status::HTTP '+str(r.status_code)+' bytes '+str(len(r.content)));r.raise_for_status();pathlib.Path('/tmp/clip.gif').write_bytes(r.content)
          PY
          F=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$F" -v error -i /tmp/clip.gif -vf 'fps=4,scale=120:-2,tile=4x4' -frames:v 1 -q:v 12 /tmp/sheet.jpg
          python3 - <<'PY'
          import base64,pathlib
          data=base64.b64encode(pathlib.Path('/tmp/sheet.jpg').read_bytes()).decode();parts=[data[i:i+3400] for i in range(0,len(data),3400)];assert len(parts)<=9
          for i,v in enumerate(parts):print(f'::notice title=sheet-{i:02d}-of-{len(parts):02d}::{v}')
          PY
