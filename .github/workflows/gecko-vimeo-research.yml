name: Public animation reference research
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-vimeo-research.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        id: ['215637283', '251621697', '321384718', '105308288']
    steps:
      - name: Retrieve public player media for research
        shell: bash
        run: |
          python3 -m pip install -q yt-dlp imageio-ffmpeg
          yt-dlp --no-progress --no-playlist -f 'worst[ext=mp4]/worst' -o /tmp/source.mp4 'https://vimeo.com/${{ matrix.id }}' >/tmp/log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/log').read_text()[-2500:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Vimeo public player result::'+s)
          PY
      - name: Sample opening visual sequence
        shell: bash
        run: |
          if test -s /tmp/source.mp4; then
            F=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            "$F" -v error -ss 0 -t 4 -i /tmp/source.mp4 -vf 'fps=4,scale=120:-2,tile=4x4' -frames:v 1 -q:v 12 /tmp/0.jpg
            python3 - <<'PY'
          import base64,pathlib
          s=base64.b64encode(pathlib.Path('/tmp/0.jpg').read_bytes()).decode();a=[s[i:i+3400] for i in range(0,len(s),3400)]
          assert len(a)<=10,len(a)
          for i,v in enumerate(a):print(f'::notice title=sample-0-{i:02d}-of-{len(a):02d}::{v}')
          PY
          fi
      - name: Sample middle visual sequence
        shell: bash
        run: |
          if test -s /tmp/source.mp4; then
            F=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            "$F" -v error -ss 20 -t 4 -i /tmp/source.mp4 -vf 'fps=4,scale=120:-2,tile=4x4' -frames:v 1 -q:v 12 /tmp/20.jpg
            python3 - <<'PY'
          import base64,pathlib
          s=base64.b64encode(pathlib.Path('/tmp/20.jpg').read_bytes()).decode();a=[s[i:i+3400] for i in range(0,len(s),3400)]
          assert len(a)<=10,len(a)
          for i,v in enumerate(a):print(f'::notice title=sample-20-{i:02d}-of-{len(a):02d}::{v}')
          PY
          fi
      - name: Sample later visual sequence
        shell: bash
        run: |
          if test -s /tmp/source.mp4; then
            F=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            "$F" -v error -ss 40 -t 4 -i /tmp/source.mp4 -vf 'fps=4,scale=120:-2,tile=4x4' -frames:v 1 -q:v 12 /tmp/40.jpg
            if test -s /tmp/40.jpg; then
            python3 - <<'PY'
          import base64,pathlib
          s=base64.b64encode(pathlib.Path('/tmp/40.jpg').read_bytes()).decode();a=[s[i:i+3400] for i in range(0,len(s),3400)]
          assert len(a)<=10,len(a)
          for i,v in enumerate(a):print(f'::notice title=sample-40-{i:02d}-of-{len(a):02d}::{v}')
          PY
          fi
          fi
