name: Creator website player inspection
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-vimeo-research.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect original creator portfolio player metadata
        run: |
          python3 -m pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import requests,bs4,re
          u='https://brennanbrinkley.com/natural-habitat-shorts'
          r=requests.get(u,timeout=30); print('::notice title=HTTP result::status '+str(r.status_code)+' length '+str(len(r.content))+' body '+r.text[:300].replace('%','%25').replace('\n','%0A'));s=bs4.BeautifulSoup(r.text,'html.parser')
          for t in s.find_all(['iframe','video','source']):
            z=str(t); print('::notice title=Player element::'+z[:2600].replace('%','%25').replace('\n','%0A'))
          for x in set(re.findall(r'https?[^"\'\s<>]{1,350}(?:m3u8|mp4)[^"\'\s<>]*',r.text,re.I)):
            print('::notice title=Media candidate::'+x[:1000].replace('%','%25'))
          PY
