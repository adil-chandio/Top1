name: PBS gecko media feasibility
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-pbs-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Test public PBS official source
        run: |
          python3 -m pip install -q yt-dlp
          yt-dlp --no-playlist -f 'worst[ext=mp4]/worst' -o '/tmp/pbs.%(ext)s' 'https://www.pbs.org/video/gecko-grip-its-atomic-really-kxxxxj/' >/tmp/log 2>&1 || true
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/log').read_text()[-3000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=PBS diagnostic::'+s)
          PY
          ls -l /tmp/pbs.* || true
