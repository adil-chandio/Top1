name: One-reference cuttlefish source review
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/cuttlefish_media_review.py]
permissions:
  contents: read
  checks: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Acquire one official source, extract bounded evidence, remove working media
        env:
          GH_TOKEN: '${{ github.token }}'
        run: python research/monarch_cam_restart_batch1/cuttlefish_media_review.py
