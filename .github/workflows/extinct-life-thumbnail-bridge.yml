name: ExtinctZoo thumbnail research bridge
on:
  push:
    branches: [arena/6e66724e-top1]
    paths: [.github/workflows/extinct-life-thumbnail-bridge.yml]
permissions:
  contents: read
jobs:
  thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch bounded public thumbnail previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/thumbs
          for id in _mJJc_bMWE0 9SpzWQzF4hY k-h2i3cE3fc eWu92oXtxsw yhoHMBGRAE0; do
            curl --fail --silent --show-error --location --max-time 20 "https://i.ytimg.com/vi/${id}/mqdefault.jpg" -o "/tmp/thumbs/${id}.jpg"
          done
      - name: Compress preview files for transfer
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PYIMAGES'
          from pathlib import Path
          from PIL import Image
          for p in Path('/tmp/thumbs').glob('*.jpg'):
              with Image.open(p) as im:
                  im.convert('RGB').save(p, format='JPEG', quality=55, optimize=True)
          PYIMAGES
      - name: Encrypt previews for temporary recipient
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/recipient.pem <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIEFzCCAn+gAwIBAgIUceyNBjaRVWM+Z7I+WhsmjY2VnwIwDQYJKoZIhvcNAQEL
          BQAwGzEZMBcGA1UEAwwQdGh1bWJuYWlsIHJldmlldzAeFw0yNjExMjIxMDEyNDRa
          Fw0yNjExMjQxMDEyNDRaMBsxGTAXBgNVBAMMEHRodW1ibmFpbCByZXZpZXcwggGi
          MA0GCSqGSIb3DQEBAQUAA4IBjwAwggGKAoIBgQDK9NYDApdXHl2YnlZvnsI53dqM
          Ez82ahCykeBavFOtBzKnISnl5naJFfntIW1e7UI9ezBbusGT1ljmR7JONebVHqip
          wmb9T40XAkU3XSf4mS16pe0B7FB5WMwycf56AtooWEFgLLs4jFqSW5HpMCx72WV7
          2JCM4Xk1NsQlQyTDaO+JLThYa7yVNWc1eINC54GsSFq8HlVD0edLE9sn8rfQMAxL
