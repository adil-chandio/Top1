          -----END CERTIFICATE-----
          CERTIFICATE
          python3 - <<'PYBRIDGE'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          files = sorted(Path('/tmp/thumbs').glob('*.jpg'))
          if len(files) != 12 or any(not p.read_bytes().startswith(b'\xff\xd8\xff') for p in files):
              raise SystemExit('Missing or invalid thumbnail image')
          with ZipFile('/tmp/thumbs.zip', 'w', ZIP_STORED) as z:
              for p in files: z.write(p, p.name)
          PYBRIDGE
          openssl cms -encrypt -binary -aes256 -in /tmp/thumbs.zip -outform DER -out /tmp/thumbs.enc /tmp/recipient.pem
          base64 -w 0 /tmp/thumbs.enc > /tmp/thumbs.b64
      - name: Transfer encrypted preview chunks 1
        shell: bash
        run: |
          python3 - <<'PYBRIDGE'
          from pathlib import Path
          data = Path('/tmp/thumbs.b64').read_text()
          chunks = [data[i:i+3500] for i in range(0, len(data), 3500)]
          if len(chunks) > 80: raise SystemExit('Transfer too large; no chunks emitted')
          for i in range(0, min(10, len(chunks))):
              print(f'::notice title=ELTHUMBS-{i+1:02d}-OF-{len(chunks):02d}::{chunks[i]}')
          PYBRIDGE
