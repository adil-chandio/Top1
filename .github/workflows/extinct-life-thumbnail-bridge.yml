          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          files = sorted(Path('/tmp/thumbs').glob('*.jpg'))
          if len(files) != 6 or any(not p.read_bytes().startswith(b'\xff\xd8\xff') for p in files):
