name: Extinct Life thumbnail research bridge
on:
  push:
    branches: [arena/6e66724e-top1]
    paths: [.github/workflows/extinct-life-thumbnail-bridge.yml]
permissions:
  contents: read
jobs:
  thumbnails:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch bounded public thumbnail previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/thumbs
          for id in gPZegVh34Mg 2-9TkvNuuck YXe9IHVX17U pxE6CYh1NvA iX1jEu0gT4c 8AfCeuaY6xo; do
            curl --fail --silent --show-error --location --max-time 20 "https://i.ytimg.com/vi/${id}/mqdefault.jpg" -o "/tmp/thumbs/${id}.jpg"
          done
