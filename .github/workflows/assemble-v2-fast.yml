name: Fast Assemble V5 Master MP4 (From Run 45794369242)

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"
    paths:
      - ".github/workflows/assemble-v2-fast.yml"

permissions:
  actions: read
  contents: read

jobs:
  assemble-v2:
    name: Assemble 1080x1920 V5 Master MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download All 20 Rendered V5 Chunks from Run 45794369242
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dl /tmp/all_frames
          gh run download 45794369242 --dir /tmp/dl
          find /tmp/dl -name "*.png" -exec mv {} /tmp/all_frames/ \;
          echo "Total frames collected: $(ls /tmp/all_frames/*.png | wc -l)"

      - name: Install FFmpeg, Pillow & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          python3 -m pip install -q pillow

      - name: Stitch 1080x1920 + Zack D. Captions + Master Audio
        run: |
          mkdir -p /tmp/output
          python3 tools/thermal-shock-blender/assemble.py \
            /tmp/all_frames \
            /tmp/output/Thermal-Shock-V5-ZackD-3D.mp4
          ls -lh /tmp/output/Thermal-Shock-V5-ZackD-3D.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate /tmp/output/Thermal-Shock-V5-ZackD-3D.mp4

      - name: Upload Final V5 3D Master Video
        uses: actions/upload-artifact@v4
        with:
          name: Thermal-Shock-V5-ZackD-3D
          path: /tmp/output/Thermal-Shock-V5-ZackD-3D.mp4
          retention-days: 14
