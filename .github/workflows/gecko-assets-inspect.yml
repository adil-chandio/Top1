name: Gecko model source inspection
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-assets-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Examine public listing metadata
        run: |
          python - <<'PY'
          import urllib.request,re,json
          urls={'blend-download':'https://www.blenderkit.com/api/v1/downloads/7046cc2a-67e5-49aa-8799-a7229fc9d0dd/'}
          for name,url in urls.items():
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'});r=urllib.request.urlopen(req,timeout=25);data=r.read(3000);print('::notice title=download response::status='+str(r.status)+' content-type='+str(r.headers.get('Content-Type'))+' response='+repr(data[:800]).replace('%','%25'))
           except Exception as e:print('::warning title=download error::'+str(e))
          PY
