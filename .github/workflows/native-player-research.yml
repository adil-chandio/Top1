name: Public native player research
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/native-player-research.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install open browser runtime
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
          python3 -m pip install -q pillow
      - name: Try ordinary public playback and capture verified visual samples
        shell: bash
        run: |
          cat > /tmp/test.cjs <<'JS'
          const { chromium } = require(process.cwd()+'/node_modules/playwright');
          (async()=>{
            const b=await chromium.launch({headless:true,args:['--no-sandbox']});
            const p=await b.newPage({viewport:{width:900,height:600}});
            for (const [name,url] of [['dragonfly','https://www.youtube.com/watch?v=UnHFiv5M0i4'],['spider','https://www.youtube.com/watch?v=mMoMGq0JO7U'],['gaits','https://vimeo.com/215637283']]) {
              let result={name,url};
              try {
                await p.goto(url,{waitUntil:'domcontentloaded',timeout:35000}); await p.waitForTimeout(7000);
                result.title=await p.title();result.body=(await p.locator('body').innerText({timeout:6000})).slice(0,1400);
                let v=p.locator('video').first();
                if (await v.count()) {
                  await v.evaluate(e=>{e.muted=true; e.play().catch(()=>{});});
                  let t1=await v.evaluate(e=>e.currentTime);await p.waitForTimeout(7000);
                  let state=await v.evaluate(e=>({time:e.currentTime,paused:e.paused,ready:e.readyState,width:e.videoWidth,height:e.videoHeight,error:e.error&&e.error.message}));
                  result.video=state;result.initial=t1;
                  if(state.time>t1+1 && state.width>0){
                    for(let i=0;i<5;i++){await v.screenshot({path:`/tmp/${name}-${i}.png`,timeout:5000});await p.waitForTimeout(700);}
                  }
                }
              }catch(e){result.error=String(e).slice(0,500)}
              console.log('::notice title=Player diagnostic::'+JSON.stringify(result).replace(/%/g,'%25').replace(/\n/g,'%0A'));
            } await b.close();
          })();
          JS
          node /tmp/test.cjs
      - name: Publish captured images if player worked
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,base64,io
          from PIL import Image
          for name in ['dragonfly','spider','gaits']:
            paths=sorted(glob.glob('/tmp/'+name+'-*.png'))
            if not paths: continue
            imgs=[Image.open(p).convert('RGB').resize((190,108)) for p in paths]
            out=Image.new('RGB',(190*len(imgs),108))
            for i,img in enumerate(imgs):out.paste(img,(190*i,0))
            f=io.BytesIO();out.save(f,format='JPEG',quality=30);data=base64.b64encode(f.getvalue()).decode();parts=[data[i:i+3400] for i in range(0,len(data),3400)]
            if len(parts)>9: print('::notice title=Too large::'+name);continue
            for i,c in enumerate(parts):print(f'::notice title={name}-{i:02d}-of-{len(parts):02d}::{c}')
          PY
