name: Monarch opening 20-second animation frames
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: ['research/monarch_cam_market/motion/opening_cloud_trigger.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monarch-opening-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - {start: 0, end: 120}
          - {start: 120, end: 240}
          - {start: 240, end: 360}
          - {start: 360, end: 480}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxi6 libxfixes3 libxkbcommon0 libsm6 libegl1 libgl1
          python -m pip install bpy==4.2.0 numpy==2.4.6
          npm install --prefix research/monarch_cam_market/motion/out/tools --no-audit --no-fund @gltf-transform/core@4.5.1 @gltf-transform/extensions@4.5.1 meshoptimizer@1.3.0
      - name: Fetch and decode verified scene assets
        run: |
          python research/monarch_cam_market/motion/fetch_opening_assets.py
          node research/monarch_cam_market/motion/decode_orca.mjs
      - name: Render independently animated frames
        env:
          FRAME_START: '${{ matrix.shard.start }}'
          FRAME_END: '${{ matrix.shard.end }}'
        run: python research/monarch_cam_market/motion/render_opening.py > render.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-frames-${{ matrix.shard.start }}
          path: |
            research/monarch_cam_market/motion/out/opening_frames/*.png
            render.log
          retention-days: 3
          if-no-files-found: error
