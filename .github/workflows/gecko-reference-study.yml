name: Gecko reference motion study
on:
  push:
    branches: [arena/868808e3-top1]
    paths: [.github/workflows/gecko-reference-study.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
