    steps:
      - name: Locate bounded media decoders
        shell: bash
        run: |
          set -eu
          bin="$RUNNER_TEMP/gecko-bin"
          mkdir -p "$bin"
          # Use the same reproducible FFmpeg build as the previous reference study.
          python3 -m pip install --quiet --no-deps --target "$RUNNER_TEMP/decoder" imageio-ffmpeg==0.8.1
          ffmpeg=$(find "$RUNNER_TEMP/decoder" -type f -name 'ffmpeg-linux-x86_64*' -print -quit)
          test -x "$ffmpeg"
          ln -s "$ffmpeg" "$bin/ffmpeg"
          "$bin/ffmpeg" -version | sed -n '1p'
          if ! command -v ffprobe >/dev/null; then
            npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/probe" @ffprobe-installer/linux-x64@5.2.0
            ln -s "$RUNNER_TEMP/probe/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$bin/ffprobe"
          fi
          echo "$bin" >> "$GITHUB_PATH"
      - name: Decode the ordinary public player stream
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cd "$RUNNER_TEMP"
          mkdir gecko-study gecko-sealed
          trap 'rm -rf "$RUNNER_TEMP/gecko-study"' EXIT
          printf '%s\n' "$RECIPIENT" > gecko-study/recipient.pem
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          vid = 'x6i0u21'
          page = 'https://www.dailymotion.com/video/' + vid
          agent = ('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                   '(KHTML, like Gecko) Chrome/137.0.0.0 Safari/537.36')
          sealed = Path('gecko-sealed')
          study = Path('gecko-study')

          def notice(label, data):
              value = json.dumps(data, ensure_ascii=True).replace('%', '%25')
              print(f'::notice title={label}::{value}', flush=True)

          def get(url, limit):
              with urlopen(Request(url, headers={'User-Agent': agent, 'Referer': page}), timeout=18) as response:
                  data = response.read(limit + 1)
              if not 0 < len(data) <= limit:
                  raise ValueError('empty or oversize response')
              return data

          def safe_error(err):
              return f'HTTP {err.code}' if isinstance(err, HTTPError) else type(err).__name__

          def public_url(url):
              parts = urlsplit(url or '')
              host = parts.hostname or ''
              return (parts.scheme == 'https' and not parts.username and not parts.password
                      and any(host == s or host.endswith('.' + s) for s in ('dailymotion.com', 'dmcdn.net')))

          def seal(p, label):
              subprocess.run(['openssl', 'cms', '-encrypt', '-binary', '-aes256', '-in', str(p),
                              '-outform', 'DER', '-out', str(sealed / (label + '.cms')),
                              str(study / 'recipient.pem')], check=True)
              return {'bytes': p.stat().st_size, 'sha256': hashlib.file_digest(p.open('rb'), 'sha256').hexdigest()}

          report = {'id': vid, 'duration_expected_sec': 65, 'video': None, 'previews': {}, 'attempts': []}
          try:
              meta = json.loads(get('https://www.dailymotion.com/player/metadata/video/' + vid, 1_500_000))
          except Exception as error:
              meta = {}
              report['metadata_failure'] = safe_error(error)
          report['listing'] = {key: meta.get(key) for key in
                               ('id', 'title', 'duration', 'mode', 'private', 'protected_delivery', 'is_password_protected')}
          notice('Gecko listing', report['listing'])
          is_public = (meta.get('id') == vid and meta.get('mode') == 'vod' and meta.get('duration') == 65
                       and meta.get('private') is False and meta.get('protected_delivery') is False
                       and meta.get('is_password_protected') is False and not meta.get('error'))
          if is_public:
              used = set()
              for quality in ('720', 'auto', '480', '380'):
                  url = next((item.get('url') for item in meta.get('qualities', {}).get(quality, [])
                              if item.get('type', '').lower() == 'application/x-mpegurl'
                              and public_url(item.get('url'))), None)
                  if not url or url in used:
                      continue
                  used.add(url)
                  output = study / 'review.mp4'
                  output.unlink(missing_ok=True)
                  try:
                      proc = subprocess.run(
                          ['ffmpeg', '-nostdin', '-hide_banner', '-v', 'error', '-y',
                           '-rw_timeout', '12000000', '-protocol_whitelist', 'http,https,tls,tcp,crypto',
                           '-user_agent', agent, '-referer', page, '-i', url, '-t', '67',
                           '-sn', '-dn',
                           '-vf', "scale='min(1280,iw)':-2:flags=lanczos", '-fps_mode', 'passthrough',
                           '-threads', '2', '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '18',
                           '-maxrate', '1400k', '-bufsize', '2800k', '-pix_fmt', 'yuv420p',
                           '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', str(output)],
                          stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=78)
                      if proc.returncode:
                          codes = sorted({m.decode() for m in re.findall(rb'HTTP error ([0-9]{3})', proc.stderr)})
                          # Preserve diagnostics without publishing signed delivery URLs.
                          log = proc.stderr.decode(errors='replace')
                          log = re.sub(r'https?[^\s\'"<>]*', '[delivery URL]', log)
                          log = re.sub(r'auth=[^\s\'"<>]*', 'auth=[redacted]', log)
                          report['attempts'].append({'quality': quality, 'failure': 'HTTP ' + '/'.join(codes)
                                                     if codes else f'decode exit {proc.returncode}',
                                                     'diagnostic': '\n'.join(log.strip().splitlines()[-7:])[:900]})
                          continue
                      probe = json.loads(subprocess.check_output(
                          ['ffprobe', '-v', 'error', '-count_frames', '-show_entries',
                           'format=duration,size:stream=codec_type,width,height,avg_frame_rate,nb_read_frames,duration,channels,sample_rate',
                           '-of', 'json', str(output)], stderr=subprocess.DEVNULL, timeout=30))
                      video = next(s for s in probe['streams'] if s['codec_type'] == 'video')
                      if not 64 <= float(video['duration']) <= 66 or int(video['nb_read_frames']) < 1200:
                          report['attempts'].append({'quality': quality, 'failure': 'incomplete video', 'probe': probe})
                          continue
                      if output.stat().st_size > 15_000_000:
                          report['attempts'].append({'quality': quality, 'failure': 'transport size exceeded'})
                          continue
                      report['video'] = {'public_quality': quality, **probe, **seal(output, 'review')}
                      notice('Decoded complete Gecko reference', report['video'])
                      break
                  except (ValueError, OSError, StopIteration, subprocess.SubprocessError) as error:
                      report['attempts'].append({'quality': quality, 'failure': safe_error(error)})
              if not report['video']:
                  # The public scrubber is a partial fallback, never counted as full playback.
                  for name in ('filmstrip', 'seeker'):
                      href = meta.get(name + '_url')
                      if not public_url(href):
                          continue
                      try:
                          data = get(href, 1_500_000)
                          if not (data.startswith((b'\xff\xd8\xff', b'\x89PNG', b'GIF8'))
                                  or (data[:4] == b'RIFF' and data[8:12] == b'WEBP')):
                              raise ValueError('not an image')
                          preview = study / name
                          preview.write_bytes(data)
                          report['previews'][name] = seal(preview, name)
                      except (ValueError, OSError, subprocess.SubprocessError) as error:
                          report['previews'][name] = {'failure': safe_error(error)}
          else:
              report['attempts'].append({'failure': 'no identified public, unprotected 65-second VOD'})
          (sealed / 'receipt.json').write_text(json.dumps(report, indent=2) + '\n')
          notice('Gecko capture outcome', {'full_video': bool(report['video']), 'attempts': report['attempts'],
                                           'previews': report['previews'], 'metadata_failure': report.get('metadata_failure')})
          PY
      - name: Retrieve the sealed review via the repository API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - <<'PY'
          import base64
          import io
          import json
          import tarfile
          from pathlib import Path
          raw = io.BytesIO()
          with tarfile.open(fileobj=raw, mode='w') as archive:
              for item in sorted(Path('gecko-sealed').iterdir()):
                  archive.add(item, arcname=item.name, recursive=False)
          if raw.tell() > 16_000_000:
              raise SystemExit('Transport over budget')
          Path('gecko-request.json').write_text(json.dumps({'encoding': 'base64', 'content': base64.b64encode(raw.getvalue()).decode('ascii')}))
          PY
          trap 'rm -f "$RUNNER_TEMP/gecko-request.json"' EXIT
          blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input gecko-request.json --jq .sha)
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
          echo "::notice title=Sealed Gecko review blob::$blob"
