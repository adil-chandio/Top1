name: Monarch public packaging inspection
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths:
      - research/monarch_cam_market/inspect_pairs.py
      - .github/workflows/monarch-paired-inspection.yml
permissions:
  contents: write
concurrency:
  group: monarch-paired-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public watch metadata and packaging only
        run: python research/monarch_cam_market/inspect_pairs.py
      - name: Preserve bounded public evidence on current branch
        run: |
          git config user.name monarch-research-bot
          git config user.email research-bot@users.noreply.github.com
          git add research/monarch_cam_market/data/paired_inspection.json
          if [ -d research/monarch_cam_market/packaging ]; then git add research/monarch_cam_market/packaging; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: preserve paired public metadata and thumbnail evidence [skip ci]"
          git push origin HEAD:arena/2a8ad29e-top1
