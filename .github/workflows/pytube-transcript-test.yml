name: Pytube and transcript actual execution
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/pytube_transcript_test.py, .github/workflows/pytube-transcript-test.yml]
permissions:
  contents: read
  checks: write
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        kind: [pytube, transcript]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytube==15.0.0 youtube-transcript-api
      - name: One bounded reference test
        env:
          TEST_KIND: ${{ matrix.kind }}
          GH_TOKEN: ${{ github.token }}
        run: timeout 100 python research/monarch_cam_restart_batch1/pytube_transcript_test.py
