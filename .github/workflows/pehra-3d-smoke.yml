name: PEHRA 3D smoke test (one shot, few frames)
on:
  push:
    branches: [arena/944c619c-top1]
    paths:
      - '.github/workflows/pehra-3d-smoke.yml'
      - 'production/account1_ep01/pehra_smoke_trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pehra-3d-smoke-${{ github.ref }}
  cancel-in-progress: true
env:
  BLENDER_VERSION: "4.2.15"
  BLENDER_DIR: "blender-4.2.15-linux-x64"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Blender 4.2 LTS + runtime libs
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libgl1 libglu1-mesa libsm6 libice6 libxkbcommon0 libgomp1
          if [ ! -x "$HOME/blender4215/$BLENDER_DIR/blender" ]; then
            mkdir -p "$HOME/blender4215"
            curl -fsSL -o /tmp/blender.tar.xz \
              "https://download.blender.org/release/Blender4.2/blender-$BLENDER_VERSION-linux-x64.tar.xz"
            tar -xf /tmp/blender.tar.xz -C "$HOME/blender4215"
            rm -f /tmp/blender.tar.xz
          fi
          echo "$HOME/blender4215/$BLENDER_DIR" >> "$GITHUB_PATH"
          "$HOME/blender4215/$BLENDER_DIR/blender" --version | head -3
      - name: Install DSP deps
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet requests numpy scipy soundfile pydub
      - name: Build frame-locked Urdu soundtrack (writes build/timeline_15s.json)
        run: |
          set -euo pipefail
          python production/account1_ep01/build_audio_15s.py
          ls -la production/account1_ep01/build/
          python -c "import json;d=json.load(open('production/account1_ep01/build/timeline_15s.json'));print('shots:',[s['id'] for s in d['shots']])"
      - name: Fetch the real CC0/MIT 3D assets
        continue-on-error: true
        run: |
          set -euo pipefail
          python production/account1_ep01/fetch_assets.py 2>&1 | tee /tmp/fetch.log
          ls -la production/account1_ep01/assets | head -20
      - name: Final-quality probe (4 samples, 100%) + measure
        run: |
          set -euo pipefail
          mkdir -p production/account1_ep01/frames
          # Capture the FULL blender output; we cannot read the run log from the
          # sandbox, so diagnostics are written to a file and committed instead.
          mkdir -p production/account1_ep01/frames_debug
          blender -b --factory-startup --python production/account1_ep01/render_scene.py -- \
            --shot S6_MASTER_MOVE --mode lookdev --samples 4 --res-pct 100 \
            --timeline production/account1_ep01/build/timeline_15s.json \
            --assets production/account1_ep01/assets \
            --out production/account1_ep01/frames_debug > /tmp/blender.log 2>&1 || true
          grep -E "Render complete|Saved:" /tmp/blender.log || tail -20 /tmp/blender.log
          echo "=== exit summary ==="
          tail -40 /tmp/blender.log || true
          cp /tmp/blender.log /tmp/smoke_blender.log
          find production/account1_ep01/frames_debug -maxdepth 1 -name '*.png' | sort | head -20
      - name: Commit the smoke frames so they can be inspected
        if: always()
        run: |
          set -euo pipefail
          DEST=deliverables/pehra-3d-smoke
          mkdir -p "$DEST"
          cp -a production/account1_ep01/frames_debug/*.png "$DEST"/ 2>/dev/null || true
          cp /tmp/smoke_blender.log "$DEST/blender.log" 2>/dev/null || echo 'no blender log' > "$DEST/blender.log"
          find production/account1_ep01/frames_debug -maxdepth 1 -type f | sort > "$DEST/frames_manifest.txt" || true
          cp /tmp/fetch.log "$DEST/fetch.log" 2>/dev/null || echo 'no fetch log' > "$DEST/fetch.log"
          { echo '--- assets ---'; ls -la production/account1_ep01/assets 2>/dev/null || echo 'no assets dir';
            echo '--- frames dir ---'; ls -la production/account1_ep01/frames_debug 2>/dev/null || echo 'no frames dir'; } > "$DEST/diagnostics.txt"
          ls -la "$DEST" || true
          git config user.name 'pehra-render-bot'
          git config user.email 'pehra-render@users.noreply.github.com'
          git add -f "$DEST" || true
          if git diff --cached --quiet; then echo 'no frames produced'; else
            git commit -m "PEHRA 3D smoke frames (run ${{ github.run_id }})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
