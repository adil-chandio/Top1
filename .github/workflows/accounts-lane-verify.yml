name: Accounts lane verify (independent re-run)
# Deliberately a SEPARATE workflow from accounts-external-lane.yml.
#
# Its only job is to prove that what the lane produced is real and durable by
# re-deriving it on a fresh machine with no shared filesystem: download the
# artifact straight from the Release, hash it, probe it, and compare against
# the values recorded by the earlier run. If the store were fake or the
# sandbox were the real holder of the bytes, this would fail.
on:
  push:
    paths:
      - 'external_lane_trigger/verify.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accounts-lane-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_store:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install deps
        if: contains(github.event.head_commit.message, '[run-lane]')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pillow yt-dlp numpy
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet transformers
          python -c "import yt_dlp, torch, transformers; print('deps ok')"

      - name: Durable store — fetch and verify from a different machine
        if: contains(github.event.head_commit.message, '[run-lane]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p external_evidence/durable
          rm -rf /tmp/fresh && mkdir -p /tmp/fresh
          gh release download accounts-durable-store --dir /tmp/fresh --clobber
          ls -la /tmp/fresh
          F=/tmp/fresh/PEHRA_15s_PREVIEW_1080x1920.mp4
          FETCHED=$(sha256sum "$F" | cut -d' ' -f1)
          python - <<PY
          import json, subprocess
          from pathlib import Path
          f = Path("/tmp/fresh/PEHRA_15s_PREVIEW_1080x1920.mp4")
          p = subprocess.run(["ffprobe", "-v", "error", "-print_format", "json",
                              "-show_format", "-show_streams", str(f)],
                             capture_output=True, text=True)
          probe = json.loads(p.stdout) if p.returncode == 0 else {}
          vid = next((s for s in probe.get("streams", [])
                      if s.get("codec_type") == "video"), {})
          aud = next((s for s in probe.get("streams", [])
                      if s.get("codec_type") == "audio"), {})
          rec = {
            "route": "github_actions_runner",
            "purpose": "independent durability verification on a fresh runner",
            "release_tag": "accounts-durable-store",
            "fetched_sha256": "$FETCHED",
            "fetched_bytes": f.stat().st_size if f.is_file() else None,
            "duration_sec": probe.get("format", {}).get("duration"),
            "width": vid.get("width"), "height": vid.get("height"),
            "fps": vid.get("r_frame_rate"),
            "video_codec": vid.get("codec_name"),
            "audio_codec": aud.get("codec_name"),
            "audio_sample_rate": aud.get("sample_rate"),
            "decoded_by": "ffprobe on a machine that never held the source file",
          }
          recorded = Path("external_evidence/durable/release_store.json")
          if recorded.is_file():
              prev = json.loads(recorded.read_text())
              rec["matches_original_sha256"] = prev.get("local_sha256") == "$FETCHED"
              rec["original_sha256"] = prev.get("local_sha256")
          Path("external_evidence/durable/fresh_machine_verify.json").write_text(
              json.dumps(rec, indent=2))
          print(json.dumps(rec, indent=2))
          PY

      - name: Competitor platform — real video bytes, then real inspection
        if: contains(github.event.head_commit.message, '[run-lane]')
        continue-on-error: true
        run: |
          mkdir -p external_evidence/platform/av
          python - <<'PY'
          import json, subprocess, traceback, glob
          from pathlib import Path

          URL = "https://www.tiktok.com/@scout2015/video/6718335390845095173"
          out = {"route": "github_actions_runner",
                 "platform": "tiktok",
                 "url": URL,
                 "reuse_in_production": False,
                 "licence_note": "reference inspection only; not licensed for reuse "
                                 "in the PEHRA cut",
                 "steps": []}
          try:
              dl = subprocess.run(
                  ["yt-dlp", "--no-warnings", "-f", "best[ext=mp4]/best",
                   "-o", "/tmp/pv.%(ext)s", URL],
                  capture_output=True, text=True, timeout=600)
              out["steps"].append({"download_rc": dl.returncode,
                                   "download_tail": (dl.stderr or "")[-400:]})
              files = [f for f in glob.glob("/tmp/pv.*") if not f.endswith(".part")]
              if not files:
                  raise RuntimeError("no file downloaded")
              src = files[0]
              out["downloaded_file"] = src
              out["downloaded_bytes"] = Path(src).stat().st_size

              import hashlib
              out["sha256"] = hashlib.sha256(Path(src).read_bytes()).hexdigest()

              pr = subprocess.run(["ffprobe", "-v", "error", "-print_format", "json",
                                   "-show_format", "-show_streams", src],
                                  capture_output=True, text=True)
              probe = json.loads(pr.stdout) if pr.returncode == 0 else {}
              vid = next((s for s in probe.get("streams", [])
                          if s.get("codec_type") == "video"), {})
              aud = next((s for s in probe.get("streams", [])
                          if s.get("codec_type") == "audio"), {})
              out["probe"] = {"duration": probe.get("format", {}).get("duration"),
                              "width": vid.get("width"), "height": vid.get("height"),
                              "fps": vid.get("r_frame_rate"),
                              "video_codec": vid.get("codec_name"),
                              "audio_codec": aud.get("codec_name")}

              # real frames from real competitor-platform video
              Path("/tmp/fr").mkdir(exist_ok=True)
              dur = float(probe.get("format", {}).get("duration") or 5)
              picks = [dur * 0.15, dur * 0.5, dur * 0.85]
              for i, t in enumerate(picks):
                  subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                                  "-ss", f"{t:.2f}", "-i", src, "-frames:v", "1",
                                  "-vf", "scale=640:-2",
                                  f"/tmp/fr/pv_{i}.png"], timeout=120)
              out["frames_extracted"] = sorted(glob.glob("/tmp/fr/pv_*.png"))

              # a different model family actually looks at them
              from PIL import Image
              from transformers import (BlipProcessor, BlipForConditionalGeneration,
                                        ViltProcessor, ViltForQuestionAnswering)
              cp = BlipProcessor.from_pretrained("Salesforce/blip-image-captioning-base")
              cm = BlipForConditionalGeneration.from_pretrained(
                  "Salesforce/blip-image-captioning-base")
              vp = ViltProcessor.from_pretrained("dandelin/vilt-b32-finetuned-vqa")
              vm = ViltForQuestionAnswering.from_pretrained(
                  "dandelin/vilt-b32-finetuned-vqa")
              import torch
              insp = []
              for f in out["frames_extracted"]:
                  img = Image.open(f).convert("RGB")
                  enc = cp(img, return_tensors="pt")
                  cap = cm.generate(**enc, max_new_tokens=40)
                  caption = cp.decode(cap[0], skip_special_tokens=True)
                  qa = []
                  for q in ["Is there a person?", "Is this a photograph?",
                            "Is the image dark?"]:
                      inp = vp(img, q, return_tensors="pt")
                      with torch.no_grad():
                          lg = vm(**inp).logits
                      k = int(lg.argmax(-1))
                      qa.append({"q": q, "a": vm.config.id2label[k],
                                 "conf": round(float(torch.softmax(lg, -1).max()), 4)})
                  insp.append({"file": Path(f).name, "caption": caption.strip(),
                               "vqa": qa})
                  print(f, caption.strip())
              out["visual_inspection"] = insp

              # an audio-event model actually listens to it
              subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y",
                              "-i", src, "-vn", "-ac", "1", "-ar", "16000",
                              "/tmp/pv.wav"], timeout=180)
              import wave, numpy as np
              with wave.open("/tmp/pv.wav") as w:
                  sr = w.getframerate()
                  pcm = np.frombuffer(w.readframes(w.getnframes()),
                                      dtype=np.int16).astype(np.float32) / 32768.0
              from transformers import ASTFeatureExtractor, ASTForAudioClassification
              fx = ASTFeatureExtractor.from_pretrained(
                  "MIT/ast-finetuned-audioset-10-10-0.4593")
              am = ASTForAudioClassification.from_pretrained(
                  "MIT/ast-finetuned-audioset-10-10-0.4593")
              win = 5 * sr
              ev = []
              for i in range(0, max(1, len(pcm) - win + 1), win):
                  ch = pcm[i:i + win]
                  if len(ch) < sr:
                      break
                  inp = fx(ch, sampling_rate=sr, return_tensors="pt")
                  with torch.no_grad():
                      lg = am(**inp).logits
                  pr2 = torch.softmax(lg, -1)[0]
                  top = torch.topk(pr2, 3)
                  ev.append({"start": round(i / sr, 2),
                             "top3": [{"label": am.config.id2label[int(k)],
                                       "score": round(float(v), 4)}
                                      for v, k in zip(top.values, top.indices)]})
              out["audio_events"] = ev
              out["audio_duration_sec"] = round(len(pcm) / sr, 3)
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
              out["traceback"] = traceback.format_exc()[-1500:]
          Path("external_evidence/platform/av/tiktok_reference.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps({k: v for k, v in out.items()
                            if k in ("downloaded_bytes", "probe", "error")}, indent=2))
          PY

      - name: Commit verification back to the branch
        if: always() && contains(github.event.head_commit.message, '[run-lane]')
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add -A external_evidence/
          git commit -m 'Lane verify: fresh-machine durability + real TikTok AV inspection' \
            || echo 'nothing to commit'
          for i in 1 2 3; do
            if git push origin HEAD:arena/944c619c-top1; then echo PUSH_OK; break; fi
            echo "retry $i"; git pull --rebase origin arena/944c619c-top1 || true
          done
