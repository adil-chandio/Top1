name: Actual packaged downloader desktop matrix
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/desktop_matrix.py, .github/workflows/desktop-app-matrix.yml]
permissions:
  contents: read
  checks: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        app: [tyrrrz, ovd]
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install GUI runtime and automation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xclip scrot tesseract-ocr ffmpeg libwebkit2gtk-4.1-0 libgtk-3-0 libx11-6 libice6 libsm6 libfontconfig1
          python -m pip install Pillow==11.3.0 pyautogui==0.9.54
      - name: Launch packaged app, paste reference, capture actual UI
        env:
          GH_TOKEN: ${{ github.token }}
          APP_KIND: ${{ matrix.app }}
        run: xvfb-run -a -s '-screen 0 1280x800x24' python research/monarch_cam_restart_batch1/desktop_matrix.py
