name: Panama-Plus EP1 Orcas vs Humpbacks Cinema 3D Render

on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths:
      - 'panama_plus_3d_kit/vo/**'
      - 'panama_plus_3d_kit/timeline.json'
      - 'panama_plus_3d_kit/build_audio.py'
      - 'panama_plus_3d_kit/scene.html'
      - 'panama_plus_3d_kit/render_webgl.mjs'
      - '.github/workflows/panama-plus-3d-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panama-ep1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Three.js & Playwright Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl
          cd panama_plus_3d_kit
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save three@0.170.0 playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Download Verified CC0 Ocean & Canyon .glb Models
        run: |
          set -e
          DEST="$PWD/panama_plus_3d_kit/assets"
          mkdir -p "$DEST" "$PWD/panama_plus_3d_kit/qc"
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Edu-Art-3D/Eduart-orca-3D/main/orca.glb -o "$DEST/orca.glb"
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Edu-Art-3D/Eduart-whale-3D/main/whale.glb -o "$DEST/whale.glb"
          BASE="https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs"
          curl -L --fail --retry 3 "$BASE/quaternius-animatedfish/models/fish1/fish1.glb" -o "$DEST/fish1.glb"
          curl -L --fail --retry 3 "$BASE/quaternius-animatedfish/models/fish2/fish2.glb" -o "$DEST/fish2.glb"
          curl -L --fail --retry 3 "$BASE/quaternius-animatedfish/models/shark/shark.glb" -o "$DEST/shark.glb"
          curl -L --fail --retry 3 "$BASE/quaternius-animatedfish/models/dolphin/dolphin.glb" -o "$DEST/dolphin.glb"
          curl -L --fail --retry 3 "$BASE/quaternius-animatedfish/models/manta_ray/manta_ray.glb" -o "$DEST/manta_ray.glb"
          curl -L --fail --retry 3 "$BASE/polyhaven-nature-rocks/models/boulder_01/boulder_01.glb" -o "$DEST/boulder_01.glb"
          curl -L --fail --retry 3 "$BASE/polyhaven-nature-rocks/models/rock_07/rock_07.glb" -o "$DEST/rock_07.glb"

      - name: Render Chunk ${{ matrix.chunk }}/6 (1080x1920 Cinema 3D)
        env:
          CHUNK_INDEX: ${{ matrix.chunk }}
          CHUNK_COUNT: '6'
        run: |
          set -o pipefail
          cd panama_plus_3d_kit
          node render_webgl.mjs --render-only 2>&1 | tee "qc/render_chunk_${CHUNK_INDEX}.log"
          tar -cf "frames_chunk_${CHUNK_INDEX}.tar" -C _frames .

      - name: Upload Rendered Frame Chunk
        uses: actions/upload-artifact@v4
        with:
          name: ep1-frames-chunk-${{ matrix.chunk }}
          path: panama_plus_3d_kit/frames_chunk_${{ matrix.chunk }}.tar
          retention-days: 1

  assemble-and-commit:
    needs: render-chunk
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Audio Stack & Earshot SFX
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl git
          python3 -m pip install --upgrade pip -q
          python3 -m pip install -q numpy scipy
          mkdir -p panama_plus_3d_kit/assets panama_plus_3d_kit/_frames panama_plus_3d_kit/qc
          git clone --depth 1 https://github.com/Leonxlnx/earshot.git /tmp/earshot || true
          if [ -d /tmp/earshot/takes ]; then
            cp -r /tmp/earshot/takes panama_plus_3d_kit/assets/earshot_takes
          fi

      - name: Master Arena Voiceover + Earshot + Ocean DSP (-14 LUFS)
        run: python3 panama_plus_3d_kit/build_audio.py

      - name: Download All 6 Frame Chunks
        uses: actions/download-artifact@v4
        with:
          path: panama_plus_3d_kit/_chunks

      - name: Encode 1080x1920 Master MP4 + Contact Sheet + QC
        run: |
          set -e
          cd panama_plus_3d_kit
          for c in 0 1 2 3 4 5; do
            tar -xf "_chunks/ep1-frames-chunk-${c}/frames_chunk_${c}.tar" -C _frames
          done
          rm -rf _chunks
          node render_webgl.mjs --encode-only
          ls -lh ../deliverables/MONARCH_Why_Orcas_Fear_Humpbacks_PanamaPlus_1080x1920.mp4 qc/

      - name: Commit Deliverable, Contact Sheet & QC Report back to branch
        run: |
          set -e
          git config user.name "MONARCH Render Bot"
          git config user.email "workadilchandio@gmail.com"
          git add -f deliverables/MONARCH_Why_Orcas_Fear_Humpbacks_PanamaPlus_1080x1920.mp4 \
                     panama_plus_3d_kit/qc/contact_sheet.png \
                     panama_plus_3d_kit/qc/qc_report.json
          git commit -m "render(ep1-orca-cinema): 1080x1920 cinema 3D master + QC [skip ci]"
          PUSHED=0
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin arena/2a8ad29e-top1
            if git push origin HEAD:arena/2a8ad29e-top1; then
              PUSHED=1
              break
            fi
            sleep 6
          done
          [ "$PUSHED" = "1" ] || exit 1
