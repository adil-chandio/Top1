name: Panama-Plus 3D Cloud Render

on:
  push:
    branches:
      - main
      - arena/2a8ad29e-top1
    paths:
      - 'panama_plus_3d_kit/trigger.txt'
      - 'panama_plus_3d_kit/build_audio.py'
      - 'panama_plus_3d_kit/scene.html'
      - 'panama_plus_3d_kit/render_webgl.mjs'
      - '.github/workflows/panama-plus-3d-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Python Audio Stack, Three.js & Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy edge-tts
          npm install --no-save playwright three
          npx playwright install --with-deps chromium

      - name: Download Verified CC0/Public .glb 3D Models
        run: |
          mkdir -p panama_plus_3d_kit/assets
          curl -L --fail https://raw.githubusercontent.com/Edu-Art-3D/Eduart-orca-3D/main/orca.glb -o panama_plus_3d_kit/assets/orca.glb
          curl -L --fail https://raw.githubusercontent.com/Edu-Art-3D/Eduart-whale-3D/main/whale.glb -o panama_plus_3d_kit/assets/whale.glb
          curl -L --fail https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs/quaternius-animatedfish/models/fish1/fish1.glb -o panama_plus_3d_kit/assets/fish1.glb
          curl -L --fail https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs/quaternius-animatedfish/models/shark/shark.glb -o panama_plus_3d_kit/assets/shark.glb
          python3 -c "
          from pathlib import Path
          for p in ['orca.glb', 'whale.glb', 'fish1.glb', 'shark.glb']:
              f = Path('panama_plus_3d_kit/assets') / p
              hdr = f.read_bytes()[:4]
              assert hdr == b'glTF', f'{p} bad header: {hdr}'
              print(f'Verified {p}: {f.stat().st_size} bytes')
          "

      - name: Build Neural Narration + Cinematic SFX Audio (-14 LUFS)
        run: python3 panama_plus_3d_kit/build_audio.py

      - name: Render 1080x1920 @ 30fps Full 3D Video + Contact Sheet + QC
        run: node panama_plus_3d_kit/render_webgl.mjs

      - name: Commit Deliverable, Contact Sheet & QC Report back to branch
        run: |
          git config user.name "MONARCH Render Bot"
          git config user.email "workadilchandio@gmail.com"
          git add -f deliverables/MONARCH_Why_Orcas_Fear_Humpbacks_PanamaPlus_1080x1920.mp4 panama_plus_3d_kit/qc/contact_sheet.png panama_plus_3d_kit/qc/qc_report.json
          git commit -m "build(panama-plus): deliver 1080x1920 30fps Orca vs Humpback 3D master + QC [skip ci]"
          git push origin HEAD:arena/2a8ad29e-top1

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panama-plus-latest
          name: MONARCH Panama-Plus 3D Render
          files: |
            deliverables/MONARCH_Why_Orcas_Fear_Humpbacks_PanamaPlus_1080x1920.mp4
            panama_plus_3d_kit/qc/contact_sheet.png
            panama_plus_3d_kit/qc/qc_report.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
