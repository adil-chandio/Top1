name: Panama-Plus 3D Cloud Render

on:
  push:
    branches:
      - main
      - arena/2a8ad29e-top1
    paths:
      - 'panama_plus_3d_kit/trigger.txt'
      - 'panama_plus_3d_kit/job.json'
      - 'panama_plus_3d_kit/scene.html'
      - 'panama_plus_3d_kit/render_webgl.mjs'
      - '.github/workflows/panama-plus-3d-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Three.js & Playwright Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq curl
          npm install --no-save playwright three
          npx playwright install --with-deps chromium

      - name: Download .glb model if model_url is set
        run: |
          URL=$(jq -r '.model_url // ""' panama_plus_3d_kit/job.json)
          LOCAL=$(jq -r '.model_local // "assets/model.glb"' panama_plus_3d_kit/job.json)
          if [ -n "$URL" ]; then
            mkdir -p "panama_plus_3d_kit/$(dirname "$LOCAL")"
            curl -L --fail "$URL" -o "panama_plus_3d_kit/$LOCAL"
            ls -lh "panama_plus_3d_kit/$LOCAL"
          fi

      - name: Render 1080x1920 @ 30fps 3D Video
        run: node panama_plus_3d_kit/render_webgl.mjs

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: panama-plus-3d-hero-1080p
          path: panama_plus_3d_kit/out/panama_plus_hero_1080p.mp4
          retention-days: 30

      - name: Publish Release Asset (for direct pull to Google Drive)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panama-plus-latest
          name: MONARCH Panama-Plus 3D Render
          files: panama_plus_3d_kit/out/panama_plus_hero_1080p.mp4
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
