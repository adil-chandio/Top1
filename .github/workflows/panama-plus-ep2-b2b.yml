name: Panama-Plus EP2 B2B 3D Commercial Render

on:
  push:
    branches:
      - main
      - arena/2a8ad29e-top1
    paths:
      - 'panama_plus_3d_kit/ep2_b2b/build_audio.py'
      - 'panama_plus_3d_kit/ep2_b2b/scene.html'
      - 'panama_plus_3d_kit/ep2_b2b/render_webgl.mjs'
      - '.github/workflows/panama-plus-ep2-b2b.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-ep2-b2b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Python Audio Stack, Three.js & Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy edge-tts piper-tts gTTS
          npm install --no-save playwright three
          npx playwright install --with-deps chromium

      - name: Download Verified CC0 .glb Showcase Models
        run: |
          mkdir -p panama_plus_3d_kit/ep2_b2b/assets
          curl -L --fail https://raw.githubusercontent.com/Edu-Art-3D/Eduart-orca-3D/main/orca.glb -o panama_plus_3d_kit/ep2_b2b/assets/orca.glb
          curl -L --fail https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Models/main/packs/quaternius-ships/models/cruise_ship/cruise_ship.glb -o panama_plus_3d_kit/ep2_b2b/assets/cruise_ship.glb
          python3 -c "
          from pathlib import Path
          for p in ['orca.glb', 'cruise_ship.glb']:
              f = Path('panama_plus_3d_kit/ep2_b2b/assets') / p
              assert f.read_bytes()[:4] == b'glTF', f'{p} invalid glTF'
              print(f'Verified {p}: {f.stat().st_size} bytes')
          "

      - name: Build Neural Narration + Dark-Luxury SFX (-14 LUFS)
        run: python3 panama_plus_3d_kit/ep2_b2b/build_audio.py

      - name: Render 1080x1920 @ 30fps B2B 3D Commercial + Contact Sheet + QC
        run: node panama_plus_3d_kit/ep2_b2b/render_webgl.mjs

      - name: Commit Failure Diagnostics if Render Failed
        if: failure()
        run: |
          if [ -f panama_plus_3d_kit/ep2_b2b/qc/render_error.log ]; then
            git config user.name "MONARCH Render Bot"
            git config user.email "workadilchandio@gmail.com"
            git add -f panama_plus_3d_kit/ep2_b2b/qc/render_error.log
            git commit -m "debug(ep2-b2b): capture render_error.log [skip ci]" || true
            git push origin HEAD:arena/2a8ad29e-top1 || true
          fi

      - name: Commit EP2 B2B 3D Deliverable & QC back to branch
        run: |
          git config user.name "MONARCH Render Bot"
          git config user.email "workadilchandio@gmail.com"
          git add -f deliverables/MONARCH_Studio_B2B_3D_Commercial_1080x1920.mp4 panama_plus_3d_kit/ep2_b2b/qc/contact_sheet.png panama_plus_3d_kit/ep2_b2b/qc/qc_report.json
          git commit -m "build(ep2-b2b): deliver MONARCH Studio B2B 3D Commercial + QC [skip ci]"
          git push origin HEAD:arena/2a8ad29e-top1

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panama-plus-latest
          name: MONARCH Panama-Plus 3D Render
          files: |
            deliverables/MONARCH_Studio_B2B_3D_Commercial_1080x1920.mp4
            panama_plus_3d_kit/ep2_b2b/qc/contact_sheet.png
            panama_plus_3d_kit/ep2_b2b/qc/qc_report.json
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
