name: Animal short visual comparison
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/animal-shorts-study.yml]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        video: [xbqcewu, xbro5de, xbqzdtu]
    steps:
      - name: Decode complete Dailymotion film
        env:
          VID: ${{ matrix.video }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U yt-dlp pillow
          yt-dlp --no-playlist -f 'best[height<=360]/best' -o /tmp/film.mp4 https://www.dailymotion.com/video/$VID
          ffprobe -v error -show_entries format=duration -of default=nw=1 /tmp/film.mp4 | sed 's/^/::notice title=duration::/'
          mkdir /tmp/frames /tmp/sheets
          ffmpeg -loglevel error -i /tmp/film.mp4 -vf 'fps=1,scale=160:-1' /tmp/frames/%03d.jpg
          python3 - <<'PYSCRIPT'
          from PIL import Image,ImageDraw
          import glob,io,base64,os
          files=sorted(glob.glob('/tmp/frames/*.jpg'));print('::notice title=coverage::'+str(len(files))+' sampled frames at 1 fps')
          for k in range(0,len(files),8):
            ims=[Image.open(p).convert('RGB') for p in files[k:k+8]];w,h=ims[0].size
            sheet=Image.new('RGB',(w*4,(h+17)*2),'black');d=ImageDraw.Draw(sheet)
            for i,im in enumerate(ims):
              x=(i%4)*w;y=(i//4)*(h+17);sheet.paste(im,(x,y));d.text((x+2,y+h),str(k+i)+'s',fill='white')
            f=io.BytesIO();sheet.save(f,'JPEG',quality=26);data=base64.b64encode(f.getvalue()).decode();open('/tmp/sheets/%02d.txt'%(k//8),'w').write(data)
          PYSCRIPT
      - name: Publish sheet 00
        run: |
          python3 - <<'PYSCRIPT'
          import os
          path='/tmp/sheets/00.txt'
          if os.path.exists(path):
            data=open(path).read();parts=[data[j:j+3000] for j in range(0,len(data),3000)]
            print('::notice title=sheet info::sheet 00 chunks='+str(len(parts)))
            assert len(parts)<=9
            for n,chunk in enumerate(parts): print(f'::notice title=sheet-00-{n:02d}-of-{len(parts):02d}::{chunk}')
          PYSCRIPT
