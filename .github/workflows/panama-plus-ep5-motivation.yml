name: Panama-Plus EP5 Motivation 3D Render

on:
  push:
    branches:
      - main
      - arena/2a8ad29e-top1
    paths:
      - 'panama_plus_3d_kit/ep5_motivation_3d/**'
      - '.github/workflows/panama-plus-ep5-motivation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-ep5-motivation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11 & Node 20
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg, Python Audio Stack, Earshot SFX, Three.js & Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg curl git
          python -m pip install --upgrade pip -q
          python -m pip install -q numpy scipy
          npm install --no-save playwright three
          npx playwright install --with-deps chromium
          mkdir -p panama_plus_3d_kit/ep5_motivation_3d/assets
          git clone --depth 1 https://github.com/Leonxlnx/earshot.git /tmp/earshot || true
          if [ -d /tmp/earshot/takes ]; then
            cp -r /tmp/earshot/takes panama_plus_3d_kit/ep5_motivation_3d/assets/earshot_takes
          fi

      - name: Build Frame-Locked Narration + Ambient Chord Bed + Earshot SFX (-14 LUFS)
        run: python3 panama_plus_3d_kit/ep5_motivation_3d/build_audio.py

      - name: Render 1080x1920 @ 30fps Full 3D Video + Contact Sheet + QC
        run: node panama_plus_3d_kit/ep5_motivation_3d/render_webgl.mjs

      - name: Commit Failure Diagnostics if Render Failed
        if: failure()
        run: |
          if [ -f panama_plus_3d_kit/ep5_motivation_3d/qc/render_error.log ]; then
            git pull --rebase origin arena/2a8ad29e-top1 || true
            git config user.name "MONARCH Render Bot"
            git config user.email "workadilchandio@gmail.com"
            git add -f panama_plus_3d_kit/ep5_motivation_3d/qc/render_error.log
            git commit -m "debug(ep5-motivation): capture render_error.log [skip ci]" || true
            git push origin HEAD:arena/2a8ad29e-top1 || true
          fi

      - name: Commit Deliverable, Contact Sheet & QC Report back to branch
        run: |
          git config user.name "MONARCH Render Bot"
          git config user.email "workadilchandio@gmail.com"
          git add -f deliverables/MONARCH_Motivation_MainAbhiBhiApniTarafHoon_PanamaPlus_1080x1920.mp4 panama_plus_3d_kit/ep5_motivation_3d/qc/contact_sheet.png panama_plus_3d_kit/ep5_motivation_3d/qc/qc_report.json
          git commit -m "build(ep5-motivation): deliver 1080x1920 30fps Motivation 3D master + QC [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin arena/2a8ad29e-top1 && git push origin HEAD:arena/2a8ad29e-top1 && break || sleep 6
          done
