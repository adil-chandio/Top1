name: Lane network probe
on:
  push:
    paths:
      - 'external_lane_trigger/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measure real network reach from a GitHub runner
        run: |
          mkdir -p external_evidence
          {
            echo "{"
            echo '  "measured_by": "github_actions_runner",'
            echo '  "runner": "ubuntu-latest",'
            echo '  "results": ['
            first=1
            for u in https://www.youtube.com https://youtu.be https://www.instagram.com https://www.tiktok.com https://huggingface.co https://cdn-lfs.huggingface.co https://raw.githubusercontent.com https://yt-dlp.org https://pypi.org; do
              code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 (X11; Linux x86_64)' "$u" 2>/dev/null || echo 000)
              [ $first -eq 0 ] && echo ','
              first=0
              printf '    {"url": "%s", "http": "%s"}' "$u" "$code"
            done
            echo
            echo "  ]"
            echo "}"
          } > external_evidence/lane_network_probe.json
          cat external_evidence/lane_network_probe.json
      - name: Install yt-dlp and test real platform extraction
        continue-on-error: true
        run: |
          python -m pip install --quiet yt-dlp || true
          echo "--- yt-dlp version ---" >> external_evidence/ytdlp_probe.txt
          yt-dlp --version >> external_evidence/ytdlp_probe.txt 2>&1 || true
          echo "--- try a public YouTube video metadata ---" >> external_evidence/ytdlp_probe.txt
          yt-dlp --no-warnings --skip-download --print '%(title)s|%(duration)s' \
            'https://www.youtube.com/watch?v=aqz-KE-bpKQ' >> external_evidence/ytdlp_probe.txt 2>&1 || true
          cat external_evidence/ytdlp_probe.txt
      - name: Commit evidence back to the branch
        run: |
          git config user.name 'accounts-lane-bot'
          git config user.email 'accounts-lane@users.noreply.github.com'
          git add external_evidence/
          git commit -m 'Lane probe: real runner network + yt-dlp evidence' || echo 'nothing to commit'
          git push origin HEAD:arena/944c619c-top1 && echo PUSH_OK || echo PUSH_FAIL
