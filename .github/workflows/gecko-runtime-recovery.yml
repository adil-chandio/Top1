name: Gecko science figures and minimal runtime recovery
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_restart_batch1/gecko_runtime_and_figures.py, .github/workflows/gecko-runtime-recovery.yml]
permissions:
  contents: read
  checks: write
jobs:
  recovery:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python -m pip install Pillow==11.3.0
      - run: python research/monarch_cam_restart_batch1/gecko_runtime_and_figures.py
        env:
          GH_TOKEN: ${{ github.token }}
