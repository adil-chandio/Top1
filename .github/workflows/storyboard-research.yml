name: Public YouTube storyboard research
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/storyboard-research.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        video: [UnHFiv5M0i4, r5cqJTU5D5I]
    steps:
      - name: Inspect public player metadata for storyboard previews
        env:
          VID: ${{ matrix.video }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,re,os
          vid=os.environ['VID'];url='https://www.youtube.com/watch?v='+vid
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          try:
            with urllib.request.urlopen(req,timeout=25) as r: html=r.read().decode('utf8','replace')
            marker='ytInitialPlayerResponse';pos=html.find(marker); start=html.find('{',pos);data,_=json.JSONDecoder().raw_decode(html[start:])
            spec=data.get('storyboards',{}).get('playerStoryboardSpecRenderer',{}).get('spec')
            print('::notice title=storyboard metadata::'+json.dumps({'video':vid,'playability':data.get('playabilityStatus',{}).get('status'),'has_storyboard':bool(spec),'keys':list(data.get('storyboards',{}))}))
            if spec:
              fields=spec.split('|');print('::notice title=storyboard levels::'+json.dumps(fields[1:]))
              open('/tmp/storyboard_spec','w').write(spec)
          except Exception as e:print('::notice title=storyboard error::'+str(e))
          PY
      - name: Download and sample a public storyboard if available
        env:
          VID: ${{ matrix.video }}
        run: |
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import os,urllib.request,base64,io
          from PIL import Image,ImageDraw
          if not os.path.exists('/tmp/storyboard_spec'): exit()
          levels=open('/tmp/storyboard_spec').read().split('|');base=levels[0];out=[]
          for level,field in enumerate(levels[1:]):
            a=field.split('#')
            if len(a)<8:continue
            w,h,count,cols,rows,interval=map(int,a[:6]); name,sigh=a[6:8]
            if w<100:continue
            sheets=(count+cols*rows-1)//(cols*rows)
            chosen=sorted(set([0,sheets//4,sheets//2,(3*sheets)//4,sheets-1]))
            try:
              for n in chosen:
                u=base.replace('$L',str(level)).replace('$N',name.replace('$M',str(n)))+'&sigh='+sigh
                with urllib.request.urlopen(u,timeout=25) as r: img=Image.open(io.BytesIO(r.read())).convert('RGB')
                # sample central tile, each tile is a specific timestamp rather than video playback
                tile=min(cols*rows//2,max(0,count-n*cols*rows-1)); x=(tile%cols)*w;y=(tile//cols)*h
                out.append((img.crop((x,y,x+w,y+h)).resize((160,90)),(n*cols*rows+tile)*interval/1000))
              print('::notice title=sample details::level='+str(level)+' size='+str(w)+'x'+str(h)+' interval_ms='+str(interval)+' tiles='+str(count)+' sheets='+str(sheets))
              break
            except Exception as e:print('::notice title=storyboard download error::'+str(e));out=[]
          if out:
            sheet=Image.new('RGB',(160*len(out),108),'white');d=ImageDraw.Draw(sheet)
            for i,(im,t) in enumerate(out):sheet.paste(im,(160*i,0));d.text((160*i,91),str(round(t,1))+'s',fill='black')
            f=io.BytesIO();sheet.save(f,'JPEG',quality=25);b=base64.b64encode(f.getvalue()).decode();parts=[b[i:i+3000] for i in range(0,len(b),3000)]
            if len(parts)<=9:
              for i,p in enumerate(parts):print(f'::notice title={os.environ["VID"]}-{i:02d}-of-{len(parts):02d}::{p}')
            else:print('::notice title=error::sample too large')
          PY
