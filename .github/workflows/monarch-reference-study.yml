    steps:
      - name: Inspect the public Dailymotion player
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p study transport
          trap 'rm -rf "$RUNNER_TEMP/study"' EXIT
          printf '%s\n' "$RECIPIENT" > study/recipient.pem
          curl --fail --silent --show-error --max-time 22 -H 'Accept: application/json' 'https://www.dailymotion.com/player/metadata/video/xac3wl6' -o study/player.json
          python3 - <<'PYWORK'
          import json, re, subprocess
          from urllib.parse import urlsplit
          from pathlib import Path
          meta = json.loads(Path('study/player.json').read_text())
          if (meta.get('private') is not False or meta.get('protected_delivery') is not False or
              meta.get('is_password_protected') is not False or meta.get('mode') != 'vod' or meta.get('id') != 'xac3wl6'):
              raise SystemExit('No public unprotected VOD. Stop.')
          if not 38 <= meta.get('duration', 0) <= 42:
              raise SystemExit('Public player metadata did not identify the expected 40-second clip.')
          playlist = next(item['url'] for item in meta['qualities']['auto'] if item['type'] == 'application/x-mpegURL')
          origin = urlsplit(playlist)
          if origin.scheme != 'https' or origin.hostname != 'cdndirector.dailymotion.com':
              raise SystemExit('Unexpected player delivery origin; not requesting it.')
          # Use only the ordinary playable stream advertised by this public player.
          # Preserve its frame cadence. No source audio or public screenshots.
          try:
              proc = subprocess.run(['ffmpeg','-nostdin','-hide_banner','-v','error','-xerror',
                '-rw_timeout','12000000','-i',playlist,'-t','42','-an','-sn','-dn','-vf',
                'scale=720:-2:flags=lanczos','-fps_mode','passthrough','-threads','2','-c:v','libx264',
                '-preset','veryfast','-crf','17','-pix_fmt','yuv420p','study/viewport.mp4'],
                stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=135)
          except subprocess.TimeoutExpired:
              raise SystemExit('Public playback timed out; no access workaround attempted.')
          if proc.returncode:
              statuses = sorted(set(re.findall(rb'HTTP error ([0-9]{3})', proc.stderr)))
              raise SystemExit('Public playback could not be decoded. HTTP statuses: ' + (', '.join(s.decode() for s in statuses) or 'none reported'))
          data = json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-count_frames',
            '-show_entries','stream=width,height,avg_frame_rate,nb_read_frames,duration','-of','json','study/viewport.mp4']))['streams'][0]
          if not 38 <= float(data['duration']) <= 42 or int(data['nb_read_frames']) < 900:
              raise SystemExit('Received stream was incomplete; not packaging it.')
          report = {'id':meta['id'],'title':meta['title'],'listing_owner':meta['owner']['username'],'verified_listing':meta.get('verified'), 'inspection_encode':data}
          Path('transport/receipt.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PYWORK
          # The repository is public. Transport the temporary viewing copy only
          # to this session's local reader; the corresponding key is not on GitHub.
          openssl cms -encrypt -binary -aes256 -in study/viewport.mp4 -outform DER -out transport/viewport.cms study/recipient.pem
      - name: Transfer one-day sealed inspection copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monarch-xac3wl6-inspection
          path: ${{ runner.temp }}/transport/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
