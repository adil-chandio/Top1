    steps:
      - name: Inspect the public Dailymotion player
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p study transport
          trap 'rm -rf "$RUNNER_TEMP/study"' EXIT
          printf '%s\n' "$RECIPIENT" > study/recipient.pem
          python3 - <<'PYWORK'
          import base64, hashlib, json, re, subprocess, urllib.error, urllib.request
          from urllib.parse import urlsplit
          from pathlib import Path
          agent = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/137.0.0.0 Safari/537.36'
          page = 'https://www.dailymotion.com/video/xac3wl6'
          def note(text):
              print('::notice title=Public reference::' + str(text).replace('%','%25').replace('\r','%0D').replace('\n','%0A'), flush=True)
          def public_get(url, limit):
              req = urllib.request.Request(url, headers={'User-Agent':agent,'Referer':page})
              with urllib.request.urlopen(req, timeout=18) as response:
                  return response.read(limit+1)
          def issue(error):
              return f'HTTP {error.code}' if isinstance(error, urllib.error.HTTPError) else type(error).__name__
          def safe_title(meta):
              return {key:meta.get(key) for key in ('id','duration','mode','private','protected_delivery','is_password_protected','verified')}
          try:
              meta = json.loads(public_get('https://www.dailymotion.com/player/metadata/video/xac3wl6', 1200000))
          except Exception as error:
              note('Public player metadata failed: ' + issue(error))
              raise SystemExit(1)
          note(json.dumps(safe_title(meta)))
          if (meta.get('private') is not False or meta.get('protected_delivery') is not False or
              meta.get('is_password_protected', False) is not False or meta.get('id') != 'xac3wl6' or meta.get('mode') != 'vod'):
              note('No ordinary public unprotected VOD available. Stopped.')
              raise SystemExit(1)
          if not 38 <= meta.get('duration', 0) <= 42:
              note('Public player did not identify the 40-second reference. Stopped.')
              raise SystemExit(1)
          playlist = next((item['url'] for item in meta.get('qualities',{}).get('auto',[]) if item['type'] == 'application/x-mpegURL'), None)
          report = {'id':meta['id'],'title':meta['title'],'listing_owner':meta['owner']['username'],'verified_listing':meta.get('verified')}
          cmd = ['ffmpeg','-nostdin','-hide_banner','-v','error','-rw_timeout','12000000','-user_agent',agent,
            '-referer',page,'-i',playlist or '', '-t','42','-an','-sn','-dn','-vf','scale=720:-2:flags=lanczos',
            '-fps_mode','passthrough','-threads','2','-c:v','libx264','-preset','veryfast','-crf','17','-pix_fmt','yuv420p','study/viewport.mp4']
          try:
              origin = urlsplit(playlist or '')
              if origin.scheme != 'https' or not origin.hostname or not origin.hostname.endswith('.dailymotion.com'):
                  raise ValueError('No supported public HLS delivery endpoint.')
              proc = subprocess.run(cmd,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=100)
              if proc.returncode:
                  codes = sorted(set(re.findall(rb'HTTP error ([0-9]{3})',proc.stderr)))
                  reason = 'HTTP ' + ', '.join(s.decode() for s in codes) if codes else ('FFmpeg status ' + str(proc.returncode))
                  raise ValueError(reason)
              video = json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-count_frames',
                '-show_entries','stream=width,height,avg_frame_rate,nb_read_frames,duration','-of','json','study/viewport.mp4']))['streams'][0]
              if not 38 <= float(video['duration']) <= 42 or int(video['nb_read_frames']) < 880:
                  raise ValueError('Stream incomplete: ' + json.dumps(video))
              report['inspection_encode'] = video
              subprocess.run(['openssl','cms','-encrypt','-binary','-aes256','-in','study/viewport.mp4','-outform','DER','-out','transport/viewport.cms','study/recipient.pem'],check=True)
              note('Decoded public VOD ' + json.dumps(video))
          except Exception as error:
              report['video_unavailable'] = str(error) if isinstance(error, ValueError) else issue(error)
              note('Public video unavailable: ' + report['video_unavailable'])
          # Preview thumbnails are independently exposed for the public player scrubber.
          # Do not substitute them for a full-frame decode in the report.
          for name, href in [('filmstrip',meta.get('filmstrip_url')),('seeker',meta.get('seeker_url')),('opening',meta.get('first_frames',{}).get('720'))]:
              u=urlsplit(href or '')
              if u.scheme != 'https' or not u.hostname or not u.hostname.endswith('.dmcdn.net'): continue
              try:
                  data=public_get(href, 7500000)
                  if not data or len(data)>7500000: raise ValueError('Invalid preview size')
                  raw=Path(f'study/{name}.bin'); raw.write_bytes(data)
                  subprocess.run(['openssl','cms','-encrypt','-binary','-aes256','-in',str(raw),'-outform','DER','-out',f'transport/{name}.cms','study/recipient.pem'],check=True)
                  small=Path(f'study/{name}-small.jpg')
                  subprocess.run(['ffmpeg','-v','error','-i',str(raw),'-frames:v','1','-vf','scale="min(iw,900)":-2','-q:v','11',str(small)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  if small.is_file() and small.stat().st_size <= 65000:
                      enc=Path(f'study/{name}-small.cms')
                      subprocess.run(['openssl','cms','-encrypt','-binary','-aes256','-in',str(small),'-outform','DER','-out',str(enc),'study/recipient.pem'],check=True)
                      blob=base64.b64encode(enc.read_bytes()).decode()
                      for i in range(0,len(blob),12000):
                          print('::notice title=Sealed '+name+f' {i//12000:02d}::'+blob[i:i+12000],flush=True)
                  note(name+' public preview: '+str(len(data))+' bytes ('+hashlib.sha256(data).hexdigest()[:12]+')')
              except Exception as error:
                  note(name+' preview unavailable: '+issue(error))
          Path('transport/receipt.json').write_text(json.dumps(report,indent=2))
          PYWORK
      - name: Transfer one-day sealed inspection copy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monarch-xac3wl6-inspection
          path: ${{ runner.temp }}/transport/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
