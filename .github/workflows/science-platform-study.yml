name: Gecko science visual comparison
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/science-platform-study.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: geckskin
            url: https://www.dailymotion.com/video/x3ba78j
          - name: climbing
            url: https://www.dailymotion.com/video/x87hv1d
    steps:
      - name: Get public information and sample if accessible
        env:
          NAME: ${{ matrix.name }}
          URL: ${{ matrix.url }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U yt-dlp pillow
          yt-dlp --no-playlist -v -F "$URL" > /tmp/formats.log 2>&1 || true
          python3 - <<'PY'
          import os
          lines=open('/tmp/formats.log').readlines();s=' | '.join(l.strip() for l in lines if any(k in l for k in ['ERROR:', 'WARNING:', 'Available formats', 'Downloading webpage','Downloading video formats']))
          print('::notice title=access '+os.environ['NAME']+'::'+s.replace('%','%25')[:3000])
          PY
          if grep -q 'Available formats' /tmp/formats.log; then
            yt-dlp --no-playlist --download-sections '*0-65' -f 'best[height<=360]/best' -o '/tmp/clip.%(ext)s' "$URL" > /tmp/download.log 2>&1 || true
            python3 - <<'PY'
          import glob,subprocess,os,base64,io
          from PIL import Image,ImageDraw
          files=[p for p in glob.glob('/tmp/clip.*') if not p.endswith('.part')];print('::notice title=download '+os.environ['NAME']+'::files='+str([os.path.basename(p) for p in files]))
          if not files: exit()
          frames=[]
          for t in [0,15,30,45,60]:
            p=subprocess.run(['ffmpeg','-loglevel','error','-ss',str(t),'-i',files[0],'-frames:v','1','-f','image2pipe','-vcodec','png','-'],capture_output=True,timeout=25)
            if p.returncode==0 and p.stdout:
              im=Image.open(io.BytesIO(p.stdout)).convert('RGB');im.thumbnail((160,90));frames.append((im,t))
          print('::notice title=sample '+os.environ['NAME']+'::decoded='+str(len(frames)))
          if not frames:exit()
          sheet=Image.new('RGB',(160*len(frames),108),'black');draw=ImageDraw.Draw(sheet)
          for i,(im,t) in enumerate(frames):sheet.paste(im,(i*160,0));draw.text((i*160,92),str(t)+'s',fill='white')
          f=io.BytesIO();sheet.save(f,'JPEG',quality=25);b=base64.b64encode(f.getvalue()).decode();parts=[b[i:i+3000] for i in range(0,len(b),3000)]
          if len(parts)>9:print('::notice title=sample error::too large');exit()
          for i,p in enumerate(parts):print(f'::notice title={os.environ["NAME"]}-{i:02d}-of-{len(parts):02d}::{p}')
          PY
          fi
