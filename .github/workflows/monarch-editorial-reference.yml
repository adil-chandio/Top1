name: Monarch editorial reference acquisition
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths: [research/monarch_cam_discovery_2026_11/editorial_reference_probe.py]
permissions:
  contents: read
  checks: write
concurrency:
  group: monarch-editorial-reference-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install reviewed standard media and transcription dependencies
        run: |
          python -m pip install cryptography==46.0.3 faster-whisper==1.2.1
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Acquire and measure; return encrypted research excerpt only
        env:
          GH_TOKEN: '${{ github.token }}'
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '30'
          HF_HUB_ETAG_TIMEOUT: '15'
        run: python research/monarch_cam_discovery_2026_11/editorial_reference_probe.py
