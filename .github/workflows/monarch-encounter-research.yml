name: Monarch encounter research
on:
  push:
    branches: [arena/4c154e66-top1]
    paths:
      - '.github/workflows/monarch-encounter-research.yml'
      - 'research/monarch-encounters/collect.py'
permissions:
  contents: write
jobs:
  public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect bounded public YouTube evidence
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python research/monarch-encounters/collect.py
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-encounter-public-evidence
          path: research/monarch-encounters/results/
          retention-days: 14
          if-no-files-found: error
      - name: Preserve public evidence on authorized session branch
        run: |
          test "$GITHUB_REF_NAME" = "arena/4c154e66-top1"
          git config user.name "monarch-research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/monarch-encounters/results/public-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: preserve public YouTube snapshot [skip ci]"
          git push origin HEAD:arena/4c154e66-top1
