name: Gecko audio analysis
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-audio-analysis.yml]
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download reference and inspect audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U yt-dlp
          yt-dlp --no-playlist -f 'best[height<=360]/best' -o /tmp/film.mp4 https://www.dailymotion.com/video/x6i0u21
          ffmpeg -v error -i /tmp/film.mp4 -vn -ac 1 -ar 48000 /tmp/audio.wav
      - name: Install and run audio classifiers
        run: |
          python -m pip install -q torch transformers librosa soundfile accelerate
          python - <<'PY'
          import os
          os.environ['HF_HUB_DISABLE_XET']='1'
          import numpy as np, librosa, torch
          from transformers import ClapModel, ClapProcessor, pipeline
          y,sr=librosa.load('/tmp/audio.wav',sr=48000,mono=True)
          print('::notice title=audio::duration '+str(round(len(y)/sr,2))+' seconds')
          labels=['A person speaking or narration','Instrumental music playing','Ambient atmospheric music','Birds chirping in nature','Insects chirping','Wind blowing','Rain falling','Water flowing','Footsteps on ground','A reptile crawling','A cinematic whoosh sound effect','A loud impact or thud','Silence or very quiet background','Electronic sound effects']
          try:
            model=ClapModel.from_pretrained('laion/clap-htsat-unfused').eval()
            proc=ClapProcessor.from_pretrained('laion/clap-htsat-unfused')
            results=[]
            with torch.no_grad():
              for start in range(0,int(np.ceil(len(y)/sr)),5):
                segment=y[start*sr:min((start+5)*sr,len(y))]
                if len(segment)<sr: continue
                inp=proc(text=labels,audio=segment,sampling_rate=sr,return_tensors='pt',padding=True)
                scores=model(**inp).logits_per_audio[0].softmax(dim=-1)
                best=torch.topk(scores,3)
                results.append(str(start)+'s '+ '; '.join(labels[i]+': '+str(round(v.item(),3)) for v,i in zip(best.values,best.indices)))
            print('::notice title=CLAP 0-30::'+' | '.join(results[:7]))
            print('::notice title=CLAP 35-end::'+' | '.join(results[7:]))
          except Exception as e:
            print('::warning title=CLAP failed::'+str(e).replace('\n',' ')[:900])
          PY
