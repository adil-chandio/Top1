name: Temporary gecko runtime library inspection
on:
  push:
    branches: [arena/b040eefc-top1]
    paths: [.github/workflows/gecko-runtime.yml]
permissions:
  contents: read
jobs:
  libraries:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        group: [0, 1, 2, 3]
    timeout-minutes: 10
    steps:
      - name: Locate runtime libraries
        run: |
          python3 - <<'PY'
          import ctypes.util, glob, os, subprocess, tarfile, io, base64, gzip
          names=['libGL.so.1','libICE.so.6','libSM.so.6','libXfixes.so.3','libXi.so.6','libXrender.so.1','libXxf86vm.so.1','libxkbcommon.so.0']
          entries=subprocess.check_output(['ldconfig','-p'],text=True)
          paths={}
          for name in names:
              lines=[line for line in entries.splitlines() if line.strip().startswith(name+' ')]
              if not lines: raise RuntimeError('Missing '+name)
              paths[name]=lines[0].split(' => ')[1]
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w') as tar:
              for name,path in paths.items():
                  payload=open(os.path.realpath(path),'rb').read()
                  info=tarfile.TarInfo(name); info.size=len(payload); info.mode=0o755; info.mtime=0
                  tar.addfile(info,io.BytesIO(payload))
          data=base64.b64encode(gzip.compress(buf.getvalue(),mtime=0)).decode()
          chunks=[data[i:i+3500] for i in range(0,len(data),3500)]
          if len(chunks)>160: raise RuntimeError('Runtime payload exceeds transfer budget')
          os.makedirs('/tmp/runtime-chunks', exist_ok=True)
          for i,chunk in enumerate(chunks): open(f'/tmp/runtime-chunks/{i:03}', 'w').write(chunk)
          open('/tmp/runtime-chunks/count', 'w').write(str(len(chunks)))
          PY
      - name: Runtime chunk segment 1
        env:
          GROUP: ${{ matrix.group }}
        run: |
          start=$((GROUP*40+0)); end=$((start+7))
          for i in $(seq -f '%03g' "$start" "$end"); do if test -f /tmp/runtime-chunks/$i; then echo "::notice title=runtime-$i::$(cat /tmp/runtime-chunks/$i)"; fi; done
      - name: Runtime chunk segment 2
        env:
          GROUP: ${{ matrix.group }}
        run: |
          start=$((GROUP*40+8)); end=$((start+7))
          for i in $(seq -f '%03g' "$start" "$end"); do if test -f /tmp/runtime-chunks/$i; then echo "::notice title=runtime-$i::$(cat /tmp/runtime-chunks/$i)"; fi; done
      - name: Runtime chunk segment 3
        env:
          GROUP: ${{ matrix.group }}
        run: |
          start=$((GROUP*40+16)); end=$((start+7))
          for i in $(seq -f '%03g' "$start" "$end"); do if test -f /tmp/runtime-chunks/$i; then echo "::notice title=runtime-$i::$(cat /tmp/runtime-chunks/$i)"; fi; done
      - name: Runtime chunk segment 4
        env:
          GROUP: ${{ matrix.group }}
        run: |
          start=$((GROUP*40+24)); end=$((start+7))
          for i in $(seq -f '%03g' "$start" "$end"); do if test -f /tmp/runtime-chunks/$i; then echo "::notice title=runtime-$i::$(cat /tmp/runtime-chunks/$i)"; fi; done
      - name: Runtime chunk segment 5
        env:
          GROUP: ${{ matrix.group }}
        run: |
          start=$((GROUP*40+32)); end=$((start+7))
          for i in $(seq -f '%03g' "$start" "$end"); do if test -f /tmp/runtime-chunks/$i; then echo "::notice title=runtime-$i::$(cat /tmp/runtime-chunks/$i)"; fi; done
      - name: Runtime chunk count
        run: echo "::notice title=runtime-count::$(cat /tmp/runtime-chunks/count)"
