name: Monarch Cam bounded market research
on:
  push:
    branches: [arena/2a8ad29e-top1]
    paths:
      - research/monarch_cam_market/collect.py
      - .github/workflows/monarch-cam-market-research.yml
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public evidence without printing credentials
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTAP1: ${{ secrets.YTAP1 }}
          YTAPI1: ${{ secrets.YTAPI1 }}
          YT_KEY: ${{ secrets.YT_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python research/monarch_cam_market/collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monarch-cam-market-evidence
          path: research/monarch_cam_market/data/
          retention-days: 14
